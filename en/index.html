 frecuencia asistida por IA, estudio de equidad en la atención urgente a personas sin hogar y estudio de monitorización de la atención aguda a domicilio.", "latestK": "ÚLTIMAS PUBLICACIONES", "latest": [{"j": "Critical Care · 2026", "h": "El prono cambia el aerosol que inhala el personal a pie de cama", "p": "Dos maniquíes que respiran, 32 configuraciones y velocimetría por imágenes de partículas: el prono redujo la exposición dentro de la mascarilla en la mayoría de los casos, pero la aumentó con una CPAP sellada en la cabecera.", "a": "Primer autor: Dr. Tzu-Yao Hung, jefe de servicio · coautor Dr. Che-Chang Hsu", "d": "10.1186/s13054-026-06416-9"}, {"j": "Emergency Medicine Journal · 2026", "h": "Troponina elevada en la TSV: ¿hay que preocuparse?", "p": "La elevación de troponina predice con fuerza el ingreso, pero no la evolución a 30 días. Trabajo completado por el Dr. Sheng-Han Yu durante la residencia, dirigido por el Dr. Tzu-Yao Hung, y premiado con una mención de honor en el foro de investigación de residentes de nueve hospitales.", "a": "Primer autor: Dr. Sheng-Han Yu · coautor Dr. Jr-Han Liou", "d": "10.1136/emermed-2026-216291"}]}, "intl": {"eyebrow": "International · internacional e interdisciplinar", "h2": "Intercambio internacional: el mundo entra en urgencias", "lead": "Profesionales sanitarios de otros países vienen a Zhongxing a nuestros talleres de vía aérea y a hacer estancias de observación con nosotros; y nosotros llevamos la investigación hecha en Zhongxing a congresos internacionales en Europa. En lo interdisciplinar, llevamos seis años investigando sobre aerosoles con el Departamento de Ingeniería Energética y de Refrigeración y Climatización de la Universidad Nacional de Tecnología de Taipéi (Taipei Tech).", "cards": [{"h": "Profesionales extranjeros aprenden vía aérea en Zhongxing", "p": "Médicos y enfermeros de otros países participan en nuestros talleres de vía aérea y practican estación por estación: ventilación con mascarilla, videolaringoscopia e intubación con fibroscopio."}, {"h": "Estancia completada, certificado en mano", "p": "Los profesionales visitantes acompañan los turnos de urgencias y participan en el día docente; al terminar, el servicio les entrega un certificado."}, {"h": "La investigación de Zhongxing en la escena internacional", "p": "Congreso mundial de vía aérea WAMM (Italia, 2025), EUSEM, ICEM y AMEE: residentes y adjuntos presentan juntos en el extranjero."}, {"h": "Interdisciplinar: medicina × ingeniería", "p": "Con el Departamento de Ingeniería de Refrigeración y Climatización de Taipei Tech creamos una plataforma de medición de aerosoles de alta fidelidad que, mediante velocimetría por imágenes de partículas, convierte los aerosoles invisibles en datos."}]}, "hist": {"eyebrow": "History", "h2": "Un siglo de historia: elige un año", "lead": "Fuentes: programa de formación de especialistas en medicina de urgencias de la sede Zhongxing (versión 18, revisada el 12/05/2026) y noticias relacionadas.", "nav": "Usa las flechas para cambiar de año", "items": [{"t": "Fundación del Hospital de la Cruz Roja", "h": "Hospital de la sección de Taiwán de la Cruz Roja Japonesa", "p": "Según el programa de formación del hospital, el antecesor de la sede Zhongxing se fundó en 1905 y fue entonces el primer hospital docente de Taiwán.", "tag": "Inicio"}, {"t": "Nace la unidad de urgencias", "h": "Segundo Hospital Afiliado de la Universidad Nacional de Taiwán", "p": "Rebautizado como Segundo Hospital Afiliado de la NTU, crea una unidad de «urgencias»: el comienzo de nuestro servicio de urgencias.", "tag": "Año uno de urgencias"}, {"t": "Urgencias 24 horas", "h": "Abren las urgencias de 24 horas", "p": "Desde entonces, abiertas todo el año. En 1983 se inaugura el edificio de urgencias.", "tag": "Todo el año"}, {"t": "Nuevo edificio y red de emergencias", "h": "Urgencias se traslada a la planta baja del nuevo edificio", "p": "Participa en el sistema de atención de doble vía de la red de emergencias médicas de Taipéi y coorganiza el simulacro Wan-An n.º 22.", "tag": "Red de emergencias"}, {"t": "Terremoto del 21 de septiembre", "h": "Atención en el terremoto 921 en el centro y norte de Taiwán", "p": "Participa en las labores de atención y recibe reconocimientos del Gobierno de la Ciudad de Taipéi, el Gobierno del Condado de Taichung, el Colegio de Médicos de Taipéi y la Federación Nacional de Colegios de Médicos.", "tag": "Respuesta a desastres"}, {"t": "Primer puesto de cribado de fiebre de Taiwán", "h": "SARS: el puesto de cribado de fiebre abre el 13 de mayo", "p": "El primer puesto de cribado de fiebre de Taiwán se instala frente a Urgencias de Zhongxing, y otros hospitales vienen a conocerlo. Durante el SARS asume la responsabilidad asistencial del sur de Taipéi, notifica 105 pacientes, supera con éxito la epidemia y recibe el reconocimiento oficial por servicios meritorios.", "tag": "Servicios meritorios"}, {"t": "Pasa a llamarse sede Zhongxing", "h": "Hospital de la Ciudad de Taipéi, sede Zhongxing", "p": "Adopta el nombre de sede Zhongxing y prepara un sistema de traslados aéreos; en octubre de ese año comienzan los traslados aéreos interhospitalarios.", "tag": "Traslado aéreo"}, {"t": "Hospital formador en urgencias", "h": "Acreditado como hospital formador en medicina de urgencias", "p": "Con 10 especialistas adjuntos a tiempo completo, desde agosto de 2014 recluta residentes de medicina de urgencias y entra de lleno en la formación en medicina de urgencias.", "tag": "Hospital docente"}, {"t": "Explosión de polvo del Formosa Fun Coast", "h": "Respuesta a múltiples víctimas sin unidad de quemados", "p": "Todo el hospital activa la respuesta ante múltiples víctimas, atiende a grandes quemados y los deriva a centros médicos. El Dr. Tzu-Yao Hung, jefe de servicio, recibe el reconocimiento oficial por servicios meritorios del Ministerio de Salud y Bienestar; el jefe de residentes Chieh-Hung Lin publica la experiencia en el Journal of Acute Medicine (2019).", "tag": "Servicios meritorios"}, {"t": "Nace CrazyatLAB", "h": "Fundación de CrazyatLAB con otros apasionados de la vía aérea", "p": "El Dr. Tzu-Yao Hung funda con otros docentes de vía aérea el colectivo CrazyatLAB y lleva la enseñanza de la vía aérea difícil a la formación de residentes.", "tag": "Docencia en vía aérea"}, {"t": "Evaluación móvil", "h": "La evaluación bidireccional de residentes pasa al móvil", "p": "El sistema de evaluación web se rehízo como app móvil (AppSheet) para dar retroalimentación de hitos y EPA en tiempo real. El estudio ganó un premio de bronce en el Congreso Internacional de Educación Médica del Taipei Veterans General Hospital de 2023 y se publicó en JMIR Medical Education en 2025.", "tag": "CBME"}, {"t": "Reforma de urgencias completada", "h": "Reforma integral de circuitos, control de infecciones y prevención de la violencia", "p": "Las obras de reforma de urgencias terminan en abril de 2019 e integran circuitos asistenciales, control de infecciones y protección frente a la violencia en urgencias.", "tag": "Espacios"}, {"t": "Equipo de investigación en aerosoles", "h": "Creación con Taipei Tech de un equipo de investigación en prevención de aerosoles", "p": "Al inicio de la pandemia se inicia la colaboración con el Departamento de Ingeniería Energética y de Refrigeración y Climatización de la Universidad Nacional de Tecnología de Taipéi; desde el año siguiente se publica en PLoS ONE, Annals of Emergency Medicine y otras revistas.", "tag": "Interdisciplinar"}, {"t": "La tormenta de Wanhua", "h": "Heping cierra sus urgencias y Zhongxing asume la carga", "p": "Reconvertimos ventanillas de toma de muestras, procesamos 200–400 muestras al día, intubamos a pacientes confirmados y el personal vivió aislado durante dos meses; urgencias nunca cerró. Recibimos el reconocimiento oficial por servicios meritorios.", "tag": "Servicios meritorios"}, {"t": "Consulta de dispensación rápida «Snow House»", "h": "Casi 15.000 atenciones en abril–mayo", "p": "En el pico nacional de la pandemia organizamos la consulta de dispensación rápida «Snow House»: en el momento álgido, 500 pacientes en 4 horas, preservando la capacidad para urgencias graves.", "tag": "Pandemia"}, {"t": "Mejor póster del ICEM", "h": "Nuestros residentes en la escena internacional", "p": "El Dr. Chih-Chieh Wu (entonces residente) gana el ICEM Campbell MacFarlane Best Poster Award; ese mismo año, nuestros residentes ganan el concurso de diagnóstico toxicológico de un vistazo y el Dr. Wei-Lun Chen recibe el Premio Joven Médico.", "tag": "Reconocimientos"}, {"t": "Memorando con Bomberos", "h": "Hospital Municipal × Bomberos de Taipéi: más capacidad de rescate", "p": "Firmado el 7 de diciembre por el jefe de bomberos Mo Huai-tsu y el director general Hsiao Sheng-huang: formación y simulacros conjuntos, rescates conjuntos en grandes desastres, atención conjunta en incidentes con múltiples víctimas y cursos diseñados en común.", "tag": "Colaboración interinstitucional"}, {"t": "Terremoto de Hualien", "h": "Nuestros médicos se movilizan por el terremoto de Hualien", "p": "Los Dres. Ya-Chin Liang y Wei-Lun Chen son médicos colaboradores del equipo de rescate de Taipéi: la medicina de desastres pasa del simulacro al terreno.", "tag": "Respuesta a desastres"}, {"t": "Salud de los bomberos", "h": "Segundo memorando con los Bomberos de Taipéi", "p": "Firmado el 2 de julio por el jefe de bomberos Mo Huai-tsu y el director general Wang Chih-hung: chequeos de salud para bomberos, un sistema de gestión y atención sanitaria y derivación ante resultados anómalos.", "tag": "Colaboración interinstitucional"}, {"t": "La investigación sigue", "h": "Critical Care y Emergency Medicine Journal", "p": "El Dr. Tzu-Yao Hung firma como primer autor un estudio en Critical Care sobre el prono y la exposición del personal a aerosoles; el estudio del Dr. Sheng-Han Yu sobre TSV y troponina, completado durante la residencia, se publica en Emergency Medicine Journal. Junto con el estudio de Indoor Air sobre terapia inhalada, la línea de investigación en aerosoles sigue creciendo.", "tag": "Investigación"}, {"t": "Edificio inteligente de urgencias y críticos", "h": "Ascenso a hospital de urgencias de máximo nivel de responsabilidad (en planificación)", "p": "Según noticias de agosto de 2026, el nuevo edificio, de 11 plantas sobre rasante y 4 subterráneas, comenzaría a construirse en julio de 2029 y terminaría en 2033; las plantas subterráneas conectarían con la estación de metro Beimen como vía de transporte médico de emergencia en caso de desastre.", "tag": "Futuro"}]}, "crisis": {"eyebrow": "Mass casualty · Pandemic · Disaster", "h2": "Cada vez que la ciudad sufre una crisis, estamos allí", "lead": "Sin unidad de quemados y sin la escala de un centro médico, Urgencias de Zhongxing ha recibido tres veces el reconocimiento oficial por servicios meritorios: en el SARS, en la explosión de polvo del Formosa Fun Coast y en el brote de Wanhua. Nuestra filosofía de mando es sencilla: en el lugar siempre debe haber un comandante claramente identificado, y los relevos deben decirse en voz alta y con claridad.", "stories": [{"band": "2003 · SARS", "tag": "Servicios meritorios", "h": "El primer puesto de cribado de fiebre de Taiwán", "p": "El 13 de mayo de 2003 se inauguró frente a Urgencias de Zhongxing el primer «puesto de cribado de fiebre» de Taiwán, y otros hospitales vinieron a conocerlo. Durante el SARS, Zhongxing asumió la responsabilidad asistencial del sur de Taipéi y alivió la presión sobre los hospitales vecinos.", "facts": [["05.13", "Apertura del puesto de cribado"], ["105", "Pacientes notificados"], ["Sur", "Responsabilidad asistencial"]]}, {"band": "2015 · Formosa Fun Coast", "tag": "Servicios meritorios", "h": "Sin unidad de quemados, pero atendiendo a grandes quemados", "p": "Aunque no tenía unidad de quemados, todo el hospital activó la respuesta ante múltiples víctimas, atendió en poco tiempo a grandes quemados y, una vez estabilizados, los trasladó a los centros médicos adecuados. El entonces jefe de residentes, Chieh-Hung Lin, recopiló la experiencia y la publicó en el Journal of Acute Medicine.", "facts": [["33", "Grandes quemados (artículo)"], ["Todo el hospital", "Movilización ante múltiples víctimas"], ["2019", "Publicación de la experiencia"]]}, {"band": "2021 · La tormenta de Wanhua", "tag": "Servicios meritorios", "h": "Heping cierra sus urgencias y Zhongxing recibe el primer impacto", "p": "La vecina sede Heping se convirtió en hospital dedicado a COVID-19 por un brote intrahospitalario y cerró sus urgencias. En Zhongxing transformamos la ventana de cristal de la farmacia de urgencias en ventanilla de toma de muestras con caja de entrega; médicos de medicina interna y cirugía hicieron juntos turnos de muestreo, con 200–400 muestras al día, sin interrumpir las urgencias. Mientras se habilitaban las plantas COVID, manejamos la vía aérea de los pacientes confirmados inestables y realizamos la intubación de más de la mitad de los confirmados del hospital. El personal vivió aislado durante dos meses.", "facts": [["200–400", "Muestras al día"], ["&gt;½", "Confirmados del hospital intubados"], ["2 meses", "Personal en aislamiento"]]}, {"band": "2022 · «Snow House»", "tag": "Pico nacional de la pandemia", "h": "500 pacientes en cuatro horas, sin perder capacidad para urgencias graves", "p": "En el pico pandémico de mayo de 2022, urgencias organizó con otros servicios la consulta de dispensación rápida «Snow House», que ofrecía de día y de noche toma de muestras y dispensación rápida de medicamentos; en abril–mayo de 2022 atendió cerca de 15.000 visitas de urgencias y consultas. Wan Hai Lines donó cabinas de aislamiento de presión negativa, el presidente Fei-Long Chen donó casetas modulares de toma de muestras e Inventec donó contenedores de muestreo. Funcionó hasta la disolución del centro de mando epidémico en mayo de 2023.", "facts": [["~15.000", "Atenciones en abril–mayo"], ["500", "Pacientes en 4 horas en el pico"], ["2023.05", "Misión cumplida"]]}, {"band": "2023 → 2025 · Rescate y bomberos", "tag": "Colaboración interinstitucional", "h": "Memorandos con los Bomberos de Taipéi", "p": "El 7 de diciembre de 2023, el Hospital Municipal de Taipéi y el Departamento de Bomberos de Taipéi firmaron un memorando de entendimiento: participación mutua en formaciones y simulacros, misiones de rescate conjuntas ante grandes desastres en el país y atención urgente conjunta en incidentes con múltiples víctimas en Taipéi. Los Dres. Ya-Chin Liang y Wei-Lun Chen son médicos colaboradores del equipo de búsqueda y rescate de Taipéi, y varios adjuntos están acreditados como comandantes de desastres por el Departamento de Salud. El Dr. Ya-Chin Liang también imparte formación al equipo de rescate, incluido un taller práctico de primeros auxilios para perros de búsqueda. En el terremoto de Hualien de 2024, nuestros médicos se movilizaron. En julio de 2025 llegó un segundo memorando, dedicado a los chequeos y la gestión de la salud de los bomberos.", "facts": [["2023.12", "Memorando de rescate"], ["0403", "Movilización terremoto de Hualien"], ["2025.07", "Salud de los bomberos"]]}, {"band": "2020 → 2026 · De la experiencia a la ciencia", "tag": "Interdisciplinar con Taipei Tech", "h": "Un equipo de investigación en aerosoles nacido en la pandemia", "p": "En 2020, el equipo de urgencias y el Departamento de Ingeniería Energética y de Refrigeración y Climatización de la Universidad Nacional de Tecnología de Taipéi crearon un equipo de investigación en prevención de aerosoles. Con maniquíes de alta fidelidad y velocimetría por imágenes de partículas, cuantifican la exposición del personal durante la oxigenoterapia, la RCP y la terapia inhalada. Los resultados se han publicado en Annals of Emergency Medicine, Scientific Reports, Journal of Hospital Infection e Indoor Air.", "facts": [["7", "Artículos de la serie sobre aerosoles"], ["6", "Años de proyectos del Departamento de Salud"], ["ICEM", "Mejor póster 2023"]]}], "quote": "«La multitarea en urgencias es como cuidar varias relaciones a la vez: llevar el ritmo de cada una para que todos lleguen con calma a la siguiente etapa.»", "quoteSrc": "— Adaptado del sitio web de reclutamiento de residentes de Urgencias de Zhongxing"}, "honors": {"eyebrow": "Honors", "h2": "Cuadro de honor: el próximo puedes ser tú", "lead": "Queremos que seáis mejores que nosotros: ese es el propósito de la enseñanza.", "items": [{"y": "2023 · AMSTERDAM", "h": "ICEM Campbell MacFarlane Best Poster Award", "p": "El Dr. Chih-Chieh Wu, entonces en formación, fue premiado por su estudio sobre distancia de dispersión y concentración de aerosoles durante la oxigenoterapia.", "gold": true}, {"y": "2023 · Sociedad de Medicina de Urgencias", "h": "Campeones del diagnóstico toxicológico de un vistazo", "p": "La Dra. Hsin-Ling Chen llevó a nuestros residentes a la victoria.", "gold": true}, {"y": "2023 · Taipéi", "h": "Premio Joven Médico", "p": "El Dr. Wei-Lun Chen, médico adjunto formado en Urgencias de Zhongxing y experto en medicina de desastres.", "gold": true}, {"y": "2023 · Congreso internacional de educación médica de Taipei Veterans General Hospital", "h": "Bronce en el concurso de resúmenes de investigación", "p": "Investigación sobre educación médica basada en competencias."}, {"y": "2003 · 2015 · 2021", "h": "Tres reconocimientos oficiales por servicios meritorios", "p": "SARS, explosión de polvo del Formosa Fun Coast y pandemia de COVID-19. El Dr. Tzu-Yao Hung recibió el reconocimiento del Ministerio de Salud y Bienestar por la explosión de polvo del Formosa Fun Coast."}, {"y": "1999", "h": "Reconocimiento por la atención en el terremoto 921", "p": "Participación en la atención en el centro y norte de Taiwán, con reconocimientos del Gobierno de la Ciudad de Taipéi, el Gobierno del Condado de Taichung y los colegios de médicos."}, {"y": "Hospital de la Ciudad de Taipéi", "h": "Médicos destacados · Profesores destacados", "p": "Dr. Bor-Hen Wu (médico destacado, 2023), Dr. Tzu-Yao Hung (profesor destacado, 2016; médico destacado, 2020) y Dra. Hsin-Ling Chen (médica destacada)."}, {"y": "Residentes", "h": "Residente destacado", "p": "Residentes de Urgencias de Zhongxing han sido elegidos residentes destacados."}, {"y": "2025 · Taipéi", "h": "Simulacro de resiliencia urbana", "p": "Nuestro equipo de respuesta a desastres participó en el simulacro de resiliencia urbana de Taipéi; el comandante médico informó en el lugar a las autoridades inspectoras."}]}, "place": {"eyebrow": "Beimen · Taipei Main Station · Dadaocheng", "h2": "En el lugar más antiguo, y más nuevo, de Taipéi", "lead": "Al este, la Estación Principal de Taipéi y las Taipei Twin Towers, que no dejan de crecer; al norte, Dadaocheng, con sus tiendas centenarias de té y de telas. Al salir del turno, en diez minutos a pie llegas a los sabores de siempre de la calle Dihua.", "mapAria": "Mapa esquemático del entorno de la sede Zhongxing: al sureste, la Estación Principal de Taipéi y las Taipei Twin Towers; al sur, Beimen (Puerta Norte); al norte, Dadaocheng y la calle Dihua; al oeste, el río Tamsui", "map": {"river": "Río Tamsui", "rd1": "Av. Zhongxiao Oeste", "rd2": "Calle Yanping Norte", "rd3": "Calle Zhengzhou", "rd4": "Calle Dihua", "ddc": "Dadaocheng", "mrt": "Estación Beimen", "gate": "Beimen (Puerta Norte)", "tms": "Estación Principal de Taipéi", "twin": "Taipei Twin Towers", "us": "Urgencias de la sede Zhongxing"}, "mapNote": "Mapa esquemático, no a escala. Dirección: calle Zhengzhou n.º 145, distrito de Datong, Taipéi.", "list": [{"h": "Estación Principal de Taipéi · Nudo de transportes", "p": "Aquí confluyen el tren de alta velocidad, el ferrocarril de Taiwán, el metro de Taipéi y el metro del aeropuerto de Taoyuan. Eso significa urgencias de viajeros diarios y turistas, y también estar en primera línea ante incidentes con múltiples víctimas."}, {"h": "Beimen · Puerta del oeste", "p": "A pie desde la estación de metro Beimen o desde la salida Y27 de Taipei City Mall (galería subterránea). El entorno de Beimen sigue renovándose con el proyecto de la Puerta Oeste de Taipéi."}, {"h": "Dadaocheng · Calle Dihua", "p": "Puerto comercial de té y productos secos desde la dinastía Qing, sigue siendo hoy la gran calle de compras del Año Nuevo Lunar y un centro de la cultura de las calles antiguas. Sus mayores, sus comerciantes y sus turistas son también nuestros pacientes."}, {"h": "Wanhua · Comunidad vulnerable", "p": "Nuestro hospital se centra en la atención a los colectivos vulnerables y en la medicina comunitaria. Atendemos desde hace años a personas sin hogar y mayores que viven solos en el entorno de la Estación Principal de Taipéi y Wanhua, e investigamos la equidad en la atención de urgencias."}], "fut1": {"eyebrow": "En planificación · inicio de obras 2029 · fin 2033", "h3": "Edificio inteligente de urgencias y cuidados críticos", "svgA": "11 plantas sobre rasante", "svgB": "4 plantas subterráneas: espacio de triaje y reanimación en desastres", "svgC": "→ Estación de metro Beimen", "spec": [["11F", "Plantas sobre rasante"], ["B4", "Plantas subterráneas"], ["150+", "Camas de agudos subterráneas en desastres"]], "li": ["Previsto el ascenso a <b>hospital de urgencias de máximo nivel de responsabilidad</b>", "Urgencias, quirófanos, UCI y plantas de agudos concentrados en el nuevo edificio, con sistemas de salud inteligentes", "Un sistema pionero de transporte médico de emergencia subterráneo: si ocurre un accidente en el tren de alta velocidad, el ferrocarril, el metro de Taipéi o el metro de Taoyuan, las plantas subterráneas se convierten en espacio temporal de triaje y reanimación, conectado con la estación de metro Beimen y la galería subterránea"], "src": "Fuente: United Daily News (udn.com), agosto de 2026. La comisión de urbanismo de Taipéi aprobó el 23 de julio de 2026 flexibilizar el coeficiente de ocupación. El calendario está sujeto a la aprobación de las autoridades competentes."}, "fut2": {"eyebrow": "Finalización prevista desde 2027", "h3": "Nuestras vecinas, las Taipei Twin Towers", "spec": [["360 m", "Torre D1 · 70 plantas"], ["280 m", "Torre C1 · 53 plantas"], ["60.600 millones de NT$", "Inversión total"]], "p": "El proyecto conjunto C1/D1 será el segundo edificio más alto de Taiwán y el emblema de la Puerta Oeste de Taipéi, con unos 16.000 empleos previstos. En abril de 2026, la estructura de acero de C1 había llegado a la planta 41 y las obras de D1 a la planta 32. Más afluencia de personas y más actividad comercial: el papel de urgencias será aún más importante.", "src": "Fuente: Economic Daily News, abril de 2026", "smartH": "Urgencias inteligentes", "smartP": "Urgencias de Zhongxing colabora con socios tecnológicos de la industria en un proyecto de triaje inteligente y monitorización continua de constantes vitales, con el objetivo de detectar antes el empeoramiento de los pacientes en sala de espera. (Proyecto en desarrollo)"}}, "join": {"eyebrow": "Buscamos residentes de medicina de urgencias", "h2": "El mundo de Urgencias de Zhongxing está lleno de tesoros.<br>¿Miras hacia lo lejos?", "p": "Si quieres salir a jugar, nosotros somos tus entrenadores. Ven a visitarnos, acompaña un turno o habla directamente con nuestros residentes.", "btn1": "Web de reclutamiento original", "btn2": "Ver de nuevo el programa", "rows": [["Departamento de Docencia e Investigación, sede Zhongxing", "02-2552-3234"], ["Dirección", "Calle Zhengzhou n.º 145, distrito de Datong, Taipéi"], ["Cómo llegar", "Metro Beimen · Taipei City Mall Y27"]], "copy": "Copiar", "copied": "Copiado"}, "gallery": {"eyebrow": "Life at Zhongxing", "h2": "Después del turno, también somos una familia", "lead": "Hacemos guardias juntos, vamos a clase juntos, y también comemos y cantamos juntos."}, "footer": {"a": "© Servicio de Urgencias, Hospital de la Ciudad de Taipéi, sede Zhongxing", "b": "Fuentes: programa de formación de especialistas en medicina de ur n médica en una carpa del equipo TPE USAR", "usar3": "El equipo de búsqueda y rescate de Taipéi se reúne", "usar4": "Formación del equipo de rescate: foto de grupo tras el curso de primeros auxilios caninos del Dr. Ya-Chin Liang", "usar5": "Formación del equipo de rescate: el Dr. Ya-Chin Liang enseña primeros auxilios prácticos para perros de búsqueda"}, "rot": {"pre": "Cada semana en Zhongxing practicas", "words": ["intubación difícil", "intubar al jefe", "ecografía a pie de cama", "reanimación", "mando en catástrofes", "dar clase desde el atril"]}, "app": {"eyebrow": "Innovación docente · JMIR Med Educ 2025", "h2": "Tu progreso, a la vista en tu móvil", "lead": "Desde 2018, Urgencias de Zhongxing pasó la evaluación bidireccional de residentes del papel a una app móvil. En la última hora de cada turno, el adjunto responsable da retroalimentación de hitos y EPA en la app. Ves tu curva de progreso en cualquier momento y qué escenarios clínicos obligatorios te faltan. Este enfoque se convirtió en un estudio publicado y fue premiado.", "phone": {"t": "Mis hitos", "s": "Ilustración", "k1": "Media EPA del trimestre", "k2": "Escenarios obligatorios hechos", "rows": ["Intubación (incl. videolaringoscopia)", "Ecografía focalizada", "Liderar el equipo de reanimación", "Dar malas noticias"]}, "chartT": "App móvil vs evaluación en papel/web", "a": "App", "b": "Papel / web", "m": ["Se declaran «muy satisfechos»", "Ven juntos número, tendencia y tasa de cumplimiento"], "note": "Datos: Chen HL, …, Hung TY. JMIR Med Educ 2025;11:e57216. Encuesta a 74 docentes, residentes y directores de programa de centros de residencia de urgencias en Taiwán (grupo app 14, grupo papel/web 60).", "pts": ["Menos evaluaciones omitidas (P=.02)", "Más fácil ver tu evolución (P<.001)", "Más fácil ver qué escenarios clínicos obligatorios faltan (P<.001)", "Sin tiempo extra para evaluar o dar retroalimentación"], "awardY": "2023 · Congreso Internacional de Educación Médica del Taipei Veterans General Hospital", "awardH": "Concurso de resúmenes de investigación, premio de bronce", "awardP": "Estudio premiado: comparación de app, papel y web para una formación a medida de residentes de urgencias. Premiados: Tzu-Yao Hung, Hsin-Ling Chen, Chia-Wen Chang, Yi-Ching Chiu.", "read": "Leer el artículo"}, "faq": {"eyebrow": "Preguntas · para futuros residentes", "h2": "Lo que quizá te preguntas", "items": [{"q": "¿Cuál es el horario?", "a": "16 turnos de 12 horas al mes, unas 192 horas (máximo 200). En los meses de urgencias de adultos, las noches van en una semana fija, sin alternar día y noche. El martes es día docente, sin primera línea."}, {"q": "¿Lo de «intubar al jefe» va en serio?", "a": "Sí. En la última prueba de vía aérea, el jefe participa como «paciente» despierto voluntario: con anestesia tópica y monitorización completa, el residente completa una secuencia de vía aérea con videolaringoscopia y endoscopia flexible, y el jefe le da su opinión en el momento. Es nuestra sesión más popular, y la más fotografiada."}, {"q": "¿Me dejarán solo en primera línea el primer año?", "a": "No. En R1–R2 ves pacientes con supervisión completa de un adjunto, hay dos adjuntos de guardia las 24 horas y la última hora de cada turno es retroalimentación individual. Además tienes dos tutores, dentro y fuera del servicio."}, {"q": "¿Un hospital regional da suficiente paciente crítico?", "a": "Dos meses en cada una de nuestras UCI médica y quirúrgica, más 1–3 meses en el área de críticos de urgencias de NTUH, pediatría de MacKay, trauma en Linkou Chang Gung y toxicología en Taipei Veterans General."}, {"q": "¿La investigación es obligatoria? ¿Es estresante?", "a": "Al menos un póster o artículo al año, a partir de una pregunta clínica y con un adjunto a tu lado. Desde R3, reunión de investigación cada dos meses. Nuestros residentes han ganado el premio al mejor póster del ICEM y publicado como primeros autores en revistas SCI."}, {"q": "¿Hay vida después del trabajo?", "a": "Sí. La docencia se concentra en los martes y el horario es previsible; 7–10 días de vacaciones al año según el año de residencia. El equipo sale a cenar y a cantar karaoke a menudo; las fotos están arriba."}, {"q": "¿Cómo me presento?", "a": "Las plazas y los plazos siguen los anuncios anuales del Ministerio de Salud y Bienestar y de la Sociedad Taiwanesa de Medicina de Urgencias. Puedes visitarnos o hacer una rotación de observación primero. Contacto: Departamento de Docencia e Investigación, sede Zhongxing, 02-2552-3234."}]}, "chief": {"stamp": "APROBADO · POR EL JEFE", "eyebrow": "Intubate the Chief · aprobación de vía aérea", "h2": "¿Quieres aprobar vía aérea? <em>Intuba al jefe.</em>", "lead": "En Zhongxing, la última prueba de vía aérea no es un maniquí. El jefe se sienta, se aplica él mismo la anestesia tópica y abre la boca, para que el residente complete una secuencia de vía aérea con paciente despierto: alguien que habla y le da su opinión en el momento. Los más jóvenes se hacen selfies, porque este momento merece recordarse.", "path": [{"b": "Talleres con maniquí", "s": "Ventilación con mascarilla, laringoscopia directa y videolaringoscopia, bougie y aspiración SALAD, en grupos pequeños hasta que salga solo."}, {"b": "Cadáveres y simulación de alta fidelidad", "s": "Visión solo de epiglotis y un modelo cadavérico de angina de Ludwig: el criterio se entrena en las vías aéreas más difíciles."}, {"b": "La sala de reanimación real", "s": "Con supervisión del adjunto y al menos 35 intubaciones exitosas antes de R3."}, {"b": "Último nivel: el propio jefe", "s": "Anestesia tópica con paciente despierto, videolaringoscopia y endoscopia flexible. Cuando el jefe asiente, apruebas."}], "fine": "El jefe participa como voluntario. La práctica de vía aérea con paciente despierto se hace con anestesia tópica, monitorización completa y material de rescate preparado."}, "care": {"eyebrow": "Urgencias públicas metropolitanas", "h2": "Urgencias de calidad, y una red de seguridad para la ciudad", "lead": "Somos el servicio de urgencias del Hospital Municipal de Taipéi, junto a la estación central. Trabajadores que van y vienen, turistas, mayores que viven solos, vecinos sin hogar: todos encuentran a los mismos especialistas en urgencias y reciben el mismo nivel de atención.", "tiles": [{"n": "12 / 12", "h": "Todos los adjuntos son especialistas en urgencias", "p": "Los 12 adjuntos a tiempo completo son especialistas en medicina de urgencias; hay dos adjuntos presentes las 24 horas y la ecografía a pie de cama siempre está a mano."}, {"n": "Sin hogar", "h": "Pacientes, no problemas", "p": "Mucha gente alrededor de la estación central no tiene hogar. Con nuestros trabajadores sociales y la ayuda médica del Departamento de Bienestar Social de Taipéi, quien no puede pagar también puede completar su atención urgente."}, {"n": "Investigación", "h": "Tener seguro no es estar atendido", "p": "Con varios años de datos de urgencias, estudiamos las altas voluntarias tempranas y las reconsultas de las personas sin hogar, para cerrar las brechas en la atención (estudio en curso)."}, {"n": "Agudos a domicilio", "h": "El urgenciólogo llega a casa", "p": "Tras la valoración, los mayores con movilidad reducida pueden recibir visitas a domicilio o por telemedicina de médicos con formación en urgencias y completar el tratamiento agudo en casa."}, {"n": "Paliativos", "h": "Presentes hasta el final", "p": "Todos los adjuntos están formados en cuidados paliativos. Impulsamos una atención aguda adaptada a los mayores y la toma de decisiones compartida con pacientes y familias."}, {"n": "Docencia", "h": "La calidad se enseña", "p": "Día docente del martes, retroalimentación en tiempo real con la app, supervisión a pie de cama: la formación del residente hoy es la atención del paciente mañana."}], "note": "El estudio sobre personas sin hogar aún no se ha publicado; los resultados se compartirán tras su publicación revisada por pares."}, "stars": {"eyebrow": "Cuadro de honor de residentes", "h2": "Los residentes también suben al escenario", "lead": "En Zhongxing, los premios, las comunicaciones orales y la investigación original no son solo cosa de adjuntos. Todo lo que sigue lo lograron nuestros residentes durante su formación. El próximo puedes ser tú.", "awards": [{"y": "2023 · ICEM ÁMSTERDAM", "who": "Dr. Chih-Chieh Wu", "h": "Premio Campbell MacFarlane al mejor póster", "p": "Premiado en la International Conference on Emergency Medicine por su estudio sobre la distancia de dispersión y la concentración de aerosoles durante la oxigenoterapia."}, {"y": "2023 · CIUDAD DE TAIPÉI", "who": "Dr. Wei-Lun Chen", "h": "Premio Joven Xinglin (青年杏林獎)", "p": "Se quedó en Zhongxing al terminar la residencia y hoy es adjunto con dedicación a la medicina de desastres."}, {"y": "RESIDENCIA", "who": "Dr. Chung-Shiung Wen", "h": "Mejor residente", "p": ""}, {"y": "FORO DE INVESTIGACIÓN DE RESIDENTES DE NUEVE HOSPITALES", "who": "Dr. Sheng-Han Yu", "h": "Comunicación oral, sección quirúrgica: mención de honor", "p": "Premiado por su estudio sobre TSV y troponina completado durante la residencia (dirigido por el Dr. Tzu-Yao Hung), publicado en 2026 en Emergency Medicine Journal."}], "papersH": "Investigación original completada durante la residencia", "papersP": "La residencia de urgencias es exigente, pero con la tutoría de sus profesores estos médicos completaron investigación original durante su formación. Cuatro de ellos se quedaron y hoy son nuestros adjuntos. Estos son sus artículos como primer autor.", "papers": [{"who": "Dr. Chih-Chieh Wu", "now": ""}, {"who": "Dr. Wei-Lun Chen", "now": "HOY ADJUNTO"}, {"who": "Dr. Chieh-Hung Lin", "now": "HOY ADJUNTO"}, {"who": "Dr. Cheng-Wei Tseng", "now": "HOY ADJUNTO"}, {"who": "Dr. Sheng-Han Yu", "now": "HOY ADJUNTO"}], "note": "Premios y artículos recopilados de los registros del servicio; los enlaces llevan al DOI."}}};

/* ---------- ECG ---------- */
(function(){const c=$('ecg');if(!c)return;const ctx=c.getContext('2d');let w,h,x=0,pts=[];const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){const dpr=devicePixelRatio||1;w=c.clientWidth;h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);pts=new Array(Math.max(1,Math.ceil(w))).fill(null);for(let i=0;i<pts.length;i++)pts[i]=beat((i%per)/per);x=Math.floor(pts.length*.7)}
  const per=150;
  function beat(t){const b=h*.62;if(t<.08)return b-Math.sin(t/.08*Math.PI)*h*.06;if(t<.14)return b;if(t<.16)return b+h*.06;if(t<.19)return b-h*.5;if(t<.22)return b+h*.14;if(t<.34)return b;if(t<.48)return b-Math.sin((t-.34)/.14*Math.PI)*h*.11;return b}
  function draw(){for(let i=0;i<2;i++){pts[x]=beat((x%per)/per);x=(x+1)%pts.length;for(let k=0;k<3;k++)pts[(x+k)%pts.length]=null}
    ctx.clearRect(0,0,w,h);ctx.strokeStyle='rgba(143,227,245,.08)';ctx.lineWidth=1;for(let gx=0;gx<w;gx+=16){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,h);ctx.stroke()}for(let gy=0;gy<h;gy+=16){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(w,gy);ctx.stroke()}
    ctx.strokeStyle='#8FE3F5';ctx.lineWidth=2;ctx.beginPath();let pen=false;for(let i=0;i<pts.length;i++){const p=pts[i];if(p==null){pen=false;continue}if(!pen){ctx.moveTo(i,p);pen=true}else ctx.lineTo(i,p)}ctx.stroke();
    if(!reduce)requestAnimationFrame(draw)}
  size();draw();addEventListener('resize',()=>{size();if(reduce)draw()})})();
