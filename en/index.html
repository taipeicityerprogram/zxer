<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zhongxing ED | Emergency Department, Taipei City Hospital Zhongxing Branch</title><meta name="description" content="Emergency Department of Taipei City Hospital, Zhongxing Branch, next to Taipei Main Station: emergency medicine residency, airway and POCUS training, Tuesday teaching day, research and international exchange."><link rel="canonical" href="https://taipeicityerprogram.github.io/zxer/en/"><link rel="alternate" hreflang="zh-Hant" href="https://taipeicityerprogram.github.io/zxer/"><link rel="alternate" hreflang="en" href="https://taipeicityerprogram.github.io/zxer/en/"><link rel="alternate" hreflang="fr" href="https://taipeicityerprogram.github.io/zxer/fr/"><link rel="alternate" hreflang="es" href="https://taipeicityerprogram.github.io/zxer/es/"><link rel="alternate" hreflang="x-default" href="https://taipeicityerprogram.github.io/zxer/"><meta property="og:type" content="website"><meta property="og:title" content="Zhongxing ED | Emergency Department, Taipei City Hospital Zhongxing Branch"><meta property="og:description" content="Emergency Department of Taipei City Hospital, Zhongxing Branch, next to Taipei Main Station: emergency medicine residency, airway and POCUS training, Tuesday teaching day, research and international exchange."><meta property="og:url" content="https://taipeicityerprogram.github.io/zxer/en/"><meta property="og:image" content="https://taipeicityerprogram.github.io/zxer/img/chief4.webp"><link rel="icon" href="../img/logo.webp"><script>window.FORCE_LANG="en"</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout concept: 北車與大稻埕之間的急救室 —— 天空藍與大地綠為主色，紅磚色只用在需要警示的地方；生理監視器的等寬數字貫穿全站。 */
:root{
  --paper:#F3F4F0; --panel:#FFFFFF; --ink:#1B2A32; --muted:#56646C; --line:#D6DCD8; --chip:#E6ECE9;
  --signal:#1F6FA5;   /* 天空藍：主色 */
  --jade:#4A7536;     /* 大地綠：次色 */
  --brick:#A6452B;    /* 大稻埕紅磚：只用於警示與新 */
  --amber:#A8740B;
  --btn:#1F6FA5; --deep-sky:#1D6292; --deep-earth:#3F6A2E; --deep-brick:#94402A;
  --mon-bg:#0D1A21; --mon-fg:#8FE3F5; --mon-dim:#24414E; --mon-red:#FF7A5C; --mon-amber:#FFC85A; --mon-k:#6FA9BC;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-serif:"Noto Serif TC","PMingLiU",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E151A; --panel:#152027; --ink:#E5ECEF; --muted:#9BA9B1; --line:#25333B; --chip:#1C2A31;
  --signal:#72B9E8; --jade:#93C274; --brick:#E8826A; --amber:#F1C055;
  --btn:#2A7BB3; --mon-bg:#081014; --mon-dim:#1C333D; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E151A; --panel:#152027; --ink:#E5ECEF; --muted:#9BA9B1; --line:#25333B; --chip:#1C2A31;
  --signal:#72B9E8; --jade:#93C274; --brick:#E8826A; --amber:#F1C055;
  --btn:#2A7BB3; --mon-bg:#081014; --mon-dim:#1C333D; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;margin:0}
:lang(en) body,:lang(fr) body,:lang(es) body{line-height:1.65}
a{color:var(--signal);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,figure:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:0}
.skip:focus{left:16px;top:8px;z-index:50;background:var(--panel);padding:8px 12px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h2{font-size:clamp(1.7rem,3.4vw,2.5rem);font-weight:900;letter-spacing:-.01em}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);font-weight:600}
.lead{color:var(--muted);max-width:66ch;font-size:1.05rem}
section{padding-block:72px;border-top:1px solid var(--line)}
.sec-head{display:grid;gap:12px;margin-bottom:36px}
.note{font-size:.82rem;color:var(--muted);margin-top:14px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#fff}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;color:var(--muted);font-size:.9rem;padding:6px 10px;border-radius:999px}
.nav a:hover{color:var(--ink);background:var(--chip)}
.nav a.cta{background:var(--btn);color:#fff;font-weight:700}
.langs{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.langs button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:.78rem;font-weight:600;padding:6px 10px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.langs button:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
@media (max-width:720px){.nav{display:none}.langs{margin-left:auto}}

/* ---------- hero ---------- */
.hero{padding-block:44px 56px;border-top:0}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}}
.hero .emblem{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hero .emblem img{width:84px;height:84px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 6px 20px -10px rgba(0,0,0,.5)}
.hero h1{font-size:clamp(2.1rem,5.2vw,3.9rem);font-weight:900;letter-spacing:-.02em;line-height:1.14}
:lang(en) .hero h1,:lang(fr) .hero h1,:lang(es) .hero h1{font-size:clamp(2rem,4.6vw,3.4rem);letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--signal)}
.hero .sub{margin-top:18px;font-size:1.08rem;color:var(--muted);max-width:36em}
.actions{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:700;text-decoration:none;border:1.5px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer;font-family:var(--f-body);font-size:.98rem}
.btn.primary{background:var(--btn);border-color:var(--btn);color:#fff}
.btn:hover{transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.btn:hover{transform:none}}
.mosaic{display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:clamp(340px,44vw,520px);min-width:0}
.mosaic .ph{margin:0;height:100%}
.mosaic .ph:first-child{grid-row:span 2}
.mosaic .ph img{height:100%}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
@media (max-width:760px){.pillars{grid-template-columns:1fr}}
.pillar{border-top:3px solid var(--jade);padding-top:12px;display:grid;gap:4px;min-width:0}
.pillar:nth-child(1){border-color:var(--signal)} .pillar:nth-child(3){border-color:var(--brick)}
.pillar h3{font-size:1.05rem}
.pillar p{color:var(--muted);font-size:.93rem}
.mission{margin-top:22px;font-family:var(--f-serif);font-weight:600;font-size:1.05rem;color:var(--ink);max-width:62ch}

/* ---------- monitor band ---------- */
.band{background:var(--mon-bg);color:var(--mon-fg);border-top:0;padding-block:22px}
.band-grid{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:1px;background:var(--mon-dim);border-radius:10px;overflow:hidden;font-family:var(--f-mono)}
@media (max-width:900px){.band-grid{grid-template-columns:repeat(2,1fr)}.band-grid .ecgcell{grid-column:1/-1}}
.band-grid>div{background:var(--mon-bg);padding:14px 16px;display:grid;gap:2px;align-content:center;min-width:0}
.ecg{width:100%;height:84px;display:block}
.vital .k{font-size:.68rem;letter-spacing:.12em;color:var(--mon-k)}
.vital .v{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:600;line-height:1.1}
.vital .u{font-size:.72rem;color:#A9D3DE;font-family:var(--f-body)}
.vital.red .v{color:var(--mon-red)} .vital.amb .v{color:var(--mon-amber)}

/* ---------- photos ---------- */
.ph{position:relative;margin:0;border-radius:var(--r);overflow:hidden;background:var(--chip);cursor:zoom-in;min-width:0}
.ph img{display:block;width:100%;height:100%;object-fit:cover;max-width:100%}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 9px;font-size:.8rem;line-height:1.35;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,31%);gap:12px;overflow-x:auto;padding-bottom:8px;margin-top:22px;scroll-snap-type:x mandatory}
.rail .ph{aspect-ratio:4/3;scroll-snap-align:start}
@media (max-width:600px){.rail{grid-auto-columns:78%}}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.row3 .ph{aspect-ratio:4/3}
@media (max-width:700px){.row3{grid-template-columns:1fr 1fr}.row3 .ph:last-child{grid-column:1/-1;aspect-ratio:16/9}}
.lb{position:fixed;inset:0;z-index:60;background:rgba(5,10,12,.9);display:grid;place-items:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.lb img{max-width:100%;max-height:82vh;border-radius:8px;object-fit:contain}
.lb p{color:#fff;margin-top:10px;text-align:center;font-size:.95rem}
.lb button{all:unset;cursor:pointer;position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:18px;color:#fff;font-size:1.6rem;line-height:1;padding:6px 10px;border-radius:8px}
.lb button:focus-visible{outline:2px solid #fff}

/* ---------- audience ---------- */
.aud-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.tab{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 18px;border-radius:999px;font-family:var(--f-body);font-size:.98rem;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:860px){.grid3{grid-template-columns:1fr}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:8px;align-content:start;min-width:0}
.tile .num{font-family:var(--f-mono);font-size:1.6rem;font-weight:600;color:var(--signal);line-height:1.15;overflow-wrap:anywhere}
.tile p{color:var(--muted);font-size:.95rem}

/* ---------- signature ---------- */
.sig{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:900px){.sig{grid-template-columns:1fr}}
.sig-card{border-radius:18px;display:grid;align-content:start;min-width:0;border:1px solid var(--line);background:var(--panel);overflow:hidden}
.sig-card .cover{aspect-ratio:16/9;border-radius:0}
.sig-card .in{padding:clamp(22px,3vw,32px);display:grid;gap:16px}
.sig-card.air{background:#14232B;color:#E9F1F4;border-color:#14232B}
.sig-card.air .muted,.sig-card.air li{color:#BFD0D7}
.sig-card h3{font-size:clamp(1.35rem,2.4vw,1.8rem);font-weight:900}
.sig-card .muted{color:var(--muted)}
.sig-card ul{margin:0;padding-left:1.1em;display:grid;gap:6px;font-size:.95rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.steps{grid-template-columns:repeat(2,1fr)}}
.step{border:1px solid color-mix(in srgb,currentColor 25%,transparent);border-radius:10px;padding:10px;display:grid;gap:2px;align-content:start;min-width:0}
.step b{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.06em;color:var(--signal)}
.sig-card.air .step b{color:var(--mon-amber)}
.sig-card.air .eyebrow{color:var(--mon-amber)}
.step span{font-size:.85rem;line-height:1.45}
.evid{display:grid;gap:8px;border-top:1px dashed color-mix(in srgb,currentColor 30%,transparent);padding-top:12px}
.evid a{color:inherit;font-size:.9rem;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent)}
.evid .k{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;opacity:.75}
.ws{margin-top:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:900px){.ws{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.ws{grid-template-columns:1fr}}
.ws .tile{padding:18px}
.ws .tile .num{font-size:1.05rem;font-family:var(--f-body);font-weight:900}

/* ---------- Tuesday ---------- */
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:24px}
.d{border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;background:var(--panel);min-width:0}
.d b{display:block;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.1em;color:var(--muted)}
.d span{font-size:.76rem;color:var(--muted);line-height:1.35;display:block;margin-top:4px}
.d.tue{background:var(--btn);border-color:var(--btn)}
.d.tue b,.d.tue span{color:#fff}
@media (max-width:640px){.d span{display:none}}
.tue-grid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media (max-width:860px){.tue-grid{grid-template-columns:1fr}}
.tue-list{display:grid;gap:6px}
@media (max-width:860px){.tue-list{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;padding-bottom:6px}}
.tue-btn{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.tue-btn:focus-visible{outline:3px solid var(--signal)}
.tue-btn .dt{font-family:var(--f-mono);font-size:.85rem;font-weight:600;color:var(--muted)}
.tue-btn .who{font-size:.9rem}
.tue-btn[aria-selected="true"]{border-color:var(--signal);box-shadow:inset 4px 0 0 var(--signal)}
.tue-btn[aria-selected="true"] .dt{color:var(--signal)}
.agenda{background:var(--mon-bg);color:var(--mon-fg);border-radius:14px;padding:22px;font-family:var(--f-mono);min-width:0;display:grid;gap:14px;align-content:start}
.agenda .hd{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.78rem;letter-spacing:.1em;color:var(--mon-k)}
.agenda .host{font-family:var(--f-body);font-size:1.25rem;font-weight:700;color:#EAF7FB}
.agenda ol{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:a}
.agenda li{display:grid;grid-template-columns:2.4em 1fr;gap:10px;align-items:baseline;font-family:var(--f-body);font-size:1rem;color:#DDF1F7;padding:10px 12px;border:1px solid var(--mon-dim);border-radius:8px}
.agenda li::before{counter-increment:a;content:counter(a,decimal-leading-zero);font-family:var(--f-mono);color:var(--mon-amber);font-size:.85rem}
.agenda .ft{font-size:.8rem;color:#A9D3DE;font-family:var(--f-body)}

/* ---------- training ---------- */
.feat .tile h3{display:flex;gap:10px;align-items:center}
.feat .tile h3 .dot{width:10px;height:10px;border-radius:50%;background:var(--jade);flex:none}
.planner{margin-top:44px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;min-width:0}
.planner-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:end;margin-bottom:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:6px 14px;border-radius:999px;font-family:var(--f-body);font-size:.9rem;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--deep-earth);border-color:var(--deep-earth);color:#fff}
.bar{display:flex;height:58px;border-radius:8px;overflow:hidden;gap:2px;background:var(--line)}
.seg{display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:700;color:#fff;padding:0 4px;text-align:center;line-height:1.2;min-width:0;overflow:hidden}
.seg.home{background:var(--deep-sky)} .seg.in{background:var(--deep-earth)} .seg.out{background:#A8740B} .seg.rs{background:#3A4750}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 4px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rot-list{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px 24px}
@media (max-width:640px){.rot-list{grid-template-columns:1fr}}
.rot-list li{display:grid;grid-template-columns:4.6em 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.rot-list li b{font-family:var(--f-mono);color:var(--signal);font-size:.92rem}
.rot-list li small{display:block;color:var(--muted)}
.rot-goal{margin-top:16px;color:var(--muted);font-size:.95rem}
.flag{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:44px}
@media (max-width:760px){.flag{grid-template-columns:1fr}}
.fl{border-radius:14px;padding:24px;display:grid;gap:10px;align-content:start;background:var(--panel);border:2px solid var(--jade);min-width:0}
.fl .k{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;color:var(--jade);font-weight:600}
.fl h3{font-size:1.3rem}
.fl p{color:var(--muted);font-size:.95rem}
.fl .mo{font-family:var(--f-mono);font-size:1.5rem;font-weight:600;color:var(--signal)}
.partners{margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:900px){.partners{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.partners{grid-template-columns:1fr}}
.partner{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--panel);display:grid;gap:4px;align-content:start;min-width:0}
.partner span{font-size:.85rem;color:var(--muted)}
.partner .k{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;color:var(--jade)}
.week{margin-top:44px;overflow-x:auto}
.week table{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
.week th,.week td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.week th{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.1em;color:var(--muted);font-weight:500}
.week td:first-child{font-weight:700;white-space:nowrap}

/* ---------- faculty ---------- */
.culture{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px}
@media (max-width:900px){.culture{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.culture{grid-template-columns:1fr}}
.cu{border-top:3px solid var(--signal);padding-top:12px;display:grid;gap:6px;align-content:start;min-width:0}
.cu b{font-family:var(--f-mono);font-size:1.7rem;font-weight:600;line-height:1.1}
.cu h3{font-size:1.02rem}
.cu p{font-size:.9rem;color:var(--muted)}
.fac{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
@media (max-width:960px){.fac{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.fac{grid-template-columns:1fr}}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:10px;align-content:start;min-width:0}

", "h": "可預期的工時", "p": "每班 12 小時、每月約 192 小時（上限 200）。輪到成人急診時，夜班固定排一週，不排來回切換的「花花班」。"}, {"n": "R1–R2", "h": "主治醫師全程督導", "p": "第一、二年在教學主治醫師督導下看診；每天上班的最後一小時，帶班老師挑一個案例即時回饋。24 小時兩線主治醫師。"}, {"n": "每週二", "h": "教學日，不用顧第一線", "p": "教學日當天住院醫師不負責第一線臨床，跟著主治醫師上核心課程、讀書會（Tintinalli 第 9 版）、期刊與病例討論。"}, {"n": "App 評核", "h": "能力導向（CBME）", "p": "里程碑與 EPA 評核全部在住院醫師 App 上完成，成果發表於 JMIR Medical Education（2025）。你隨時看得到自己的成長曲線。"}, {"n": "雙導師", "h": "有人接住你", "p": "科內與科外雙導師、每月導生會、每季與院長有約，另有院內心理師協助評估壓力。"}, {"n": "第一年就發表", "h": "從臨床問題開始做研究", "p": "每年至少一篇學會海報或論文。住院醫師的氣膠研究在 2023 年拿下 ICEM 最佳海報獎。"}], [{"n": "PGY", "h": "PGY 急診訓練合作醫院", "p": "中興院區為二年期畢業後一般醫學訓練合作醫院。急診從 PGY 開始扎根 POCUS 超音波與呼吸道課程。"}, {"n": "R3 當助教", "h": "學長姐帶你做", "p": "第三年住院醫師起擔任 PGY 呼吸道與超音波課程助教，再逐步上台講授。教學相長是本科的文化。"}, {"n": "瘋氣道", "h": "插管工具一次摸齊", "p": "影像式喉頭鏡、Pentax AWS、影像插管條、纖維鏡、高角度喉頭鏡，以及插管透明人與新生兒插管假人。"}, {"n": "短期訓練", "h": "UGY、見習、實習：依需求安排", "p": "UGY、見習與實習醫學生可依你的需求，安排長短不一的急診訓練。台北車站旁的區域醫院急診，病人組成多元：銀髮族、無家者、觀光客與通勤族，加上大量傷患演練，都是課本外的學習。"}, {"n": "國際", "h": "跟著老師出國發表", "p": "近年在 ICEM（阿姆斯特丹）、EUSEM（巴塞隆納）、AMEE（瑞士）、WAMM（義大利）都有發表。"}, {"n": "聯絡", "h": "想來參訪？", "p": "請洽中興院區教學研究科（02-2552-3234），或往下看「加入我們」。"}], [{"n": "交班", "h": "交接要說清楚，也要有人認真聽", "p": "清楚的交接是我們的指揮哲學。救護車到院的那幾分鐘，決定了病人接下來的照護。"}, {"n": "演練", "h": "一起上場的大量傷患演練", "p": "城市韌性演習與大量傷患演練中，急診與救護、消防同仁一起從現場分流練到院內後送。"}, {"n": "搜救隊", "h": "臺北市搜救隊的合作夥伴", "p": "2023 年 12 月，臺北市立聯合醫院與臺北市政府消防局簽署合作備忘錄，雙方定期互相參與訓練與演練；梁雅欽、陳緯綸醫師為搜救隊特約醫師。2024 年花蓮地震，科內醫師集結出隊。"}, {"n": "DMAT", "h": "院內災難醫療隊", "p": "多位主治醫師具衛生局災難指揮官資格，平時一起訓練，災時一起出勤。"}, {"n": "呼吸道", "h": "現場最重要的那口氣", "p": "我們的呼吸道工作坊從面罩通氣與 SALAD 抽吸練起——這也是救護現場最關鍵的技能。"}, {"n": "聯絡", "h": "想一起練？", "p": "單位合作與參訪，請洽中興院區教學研究科（02-2552-3234）。"}]]}, "sig": {"eyebrow": "Signature training · 看論文就知道我們強在哪", "h2": "兩塊招牌：呼吸道與 POCUS", "lead": "我們研究什麼，就教什麼。困難呼吸道與床邊超音波，是中興急診論文最多、課最好玩、住院醫師練得最扎實的兩件事。", "evk": "EVIDENCE · 我們自己的論文", "air": {"eyebrow": "Airway · 瘋氣道 CrazyatLAB", "h3": "看不到聲門的那一刻，你知道下一步。", "p": "科主任洪子堯是瘋氣道職人講師，博士論文就是「只見會厭時的困難插管策略」。科內的大體與假人研究，受試者用的正是剛到急診 2–5 個月的 PGY 醫師，研究結果直接回饋  JMIR Med Educ 2025;11:e57216。全台急診住院醫師訓練單位的 74 位教師、住院醫師與計畫主持人問卷（App 組 14 人、紙本／網頁組 60 人）。", "pts": ["漏評的情況較少（P=.02）", "更容易看出自己的表現趨勢（P<.001）", "更容易知道還缺哪些必要臨床情境（P<.001）", "評核與回饋花的時間沒有增加"], "awardY": "2023 · 臺北榮總國際醫學教育研討會", "awardH": "研究論文摘要競賽 銅獎", "awardP": "得獎題目：以達成「量身訂做」為導向，比較使用 App、紙本或網站評估急診住院醫師訓練之優劣。得獎者：洪子堯、陳欣伶、張嘉雯、邱乙晴。", "read": "閱讀論文"}, "faq": {"eyebrow": "FAQ · 給想來的你", "h2": "你可能想問的事", "items": [{"q": "工時大概是多少？", "a": "每月 16 班、每班 12 小時，約 192 小時（上限 200）。輪成人急診時夜班固定排一週，不排日夜來回切換的班。每週二是教學日，不負責第一線臨床。"}, {"q": "「先插主任」是真的嗎？", "a": "是真的。呼吸道訓練的最後一關，由主任自願擔任清醒的「病人」：在表面麻醉與完整監測下，住院醫師用影像喉頭鏡與軟式內視鏡完成清醒呼吸道流程，主任當場回饋。這是我們最受歡迎、也最常被拍照的一堂課。"}, {"q": "第一年會不會被丟在第一線？", "a": "不會。R1–R2 全程在主治醫師督導下看診，24 小時有兩線主治醫師在場，每天最後一小時有一對一回饋。另有科內、科外雙導師。"}, {"q": "區域醫院會不會看不到重症？", "a": "本院內科與外科加護病房各 2 個月，加上臺大急診重症區 1–3 個月、馬偕兒科、林口長庚外傷與北榮毒物科外訓，重症與特殊病例都補得到。"}, {"q": "一定要做研究嗎？壓力大嗎？", "a": "每年至少一篇學會海報或論文，從臨床問題出發，主治醫師一起帶。R3 起每兩個月一次研究會議。住院醫師已有 ICEM 最佳海報獎與 SCI 第一作者論文的例子。"}, {"q": "下班後有生活嗎？", "a": "有。教學集中在週二，班表可預期；年休依年資 7–10 天。科裡常一起聚餐、唱歌，照片都在上面。"}, {"q": "怎麼申請？", "a": "招募名額與時程依每年衛福部與急診醫學會公告。歡迎先來參訪或跟診，請洽中興院區教學研究科 02-2552-3234。"}]}, "chief": {"stamp": "PASSED · 主任認證", "eyebrow": "Intubate the Chief · 插管畢業考", "h2": "想拿插管通行證？<em>先插主任。</em>", "lead": "在中興，呼吸道訓練的最後一關不在假人身上。主任親自坐上椅子、自己做好表面麻醉、張開嘴，讓住院醫師在一位清醒、會說話、會當場回饋的「病人」身上，走完一次清醒呼吸道流程。旁邊的學弟妹忙著自拍——因為這一刻值得記住。", "path": [{"b": "假人工作坊", "s": "面罩通氣、直接與影像喉頭鏡、bougie、SALAD 抽吸，小組輪站練到手順。"}, {"b": "大體與高擬真模擬", "s": "只見會厭、模擬 Ludwig 咽峽炎的大體情境——在最難的呼吸道裡練判斷。"}, {"b": "真實急救室", "s": "主治醫師在旁督導，R3 前累積至少 35 例成功插管。"}, {"b": "最後一關：主任本人", "s": "清醒下的表面麻醉、影像喉頭鏡與軟式內視鏡。主任點頭，你才算過關。"}], "fine": "主任自願擔任受試者；清醒呼吸道練習在表面麻醉、完整監測與急救設備備妥下進行。"}, "care": {"eyebrow": "Public metropolitan emergency care", "h2": "高品質急診，也是城市的安全網", "lead": "我們是臺北市立聯合醫院的急診，就在台北車站旁。通勤族、觀光客、獨居長者、無家可歸的朋友——走進中興急診的每一個人，面對的都是同一群急診專科主治醫師，得到的都是同一套標準的照護。", "tiles": [{"n": "12 / 12", "h": "每一位主治都是急診專科", "p": "12 位專任主治醫師全數具急診專科資格，24 小時兩線主治醫師在場，床邊超音波隨時可用。"}, {"n": "無家者", "h": "把他們當病人，不當問題", "p": "台北車站周邊有不少無家可歸的朋友。我們與社工合作，經由臺北市社會局的醫療補助，讓無力負擔的人也能完成急診治療。"}, {"n": "研究", "h": "有健保，不等於有被照顧到", "p": "我們正以多年急診資料，研究無家者提早離院與返診的落差，找出照護可以補上的缺口（研究進行中）。"}, {"n": "在宅急症", "h": "急診醫師走進家裡", "p": "行動不便的長者，經醫師評估後可由急診背景的醫師到宅或遠距訪視，在家完成急症治療。"}, {"n": "安寧", "h": "最後一哩路也不缺席", "p": "主治醫師均具安寧緩和照護資格，推動高齡友善急症照護與醫病共享決策，陪病人和家屬做出最適合的選擇。"}, {"n": "教學", "h": "品質，是教出來的", "p": "週二教學日、App 即時回饋、主治床邊督導——住院醫師今天的訓練，就是病人明天得到的照護。"}], "note": "無家者研究尚未發表，結果將於同儕審查刊出後公開。"}, "stars": {"eyebrow": "Resident Hall of Fame", "h2": "住院醫師，也能站上舞台", "lead": "在中興，得獎、上台報告、完成原著研究，不是主治醫師的專利。以下都是我們的住院醫師在受訓期間完成的成就——下一個就是你。", "awards": [{"y": "2023 · ICEM 阿姆斯特丹", "who": "伍智杰醫師", "h": "Campbell MacFarlane 最佳海報獎", "p": "以氧氣治療時氣膠擴散距離與濃度的研究，在國際急診醫學會議獲獎。"}, {"y": "2023 · 臺北市", "who": "陳緯綸醫師", "h": "青年杏林獎", "p": "完訓後留在中興，成為災難醫學專長的主治醫師。"}, {"y": "住院醫師", "who": "溫仲雄醫師", "h": "最佳住院醫師", "p": ""}, {"y": "九院住院醫師研究發表", "who": "余陞翰醫師", "h": "外科組口頭報告佳作", "p": "以住院醫師期間完成的 SVT 與 troponin 研究獲獎（洪子堯主任指導），該研究 2026 年刊登於 Emergency Medicine Journal。"}], "papersH": "住院醫師階段就完成的原著研究", "papersP": "急診住院醫師訓練並不輕鬆，但這幾位醫師在繁重的訓練之餘，仍在師長指導下完成了原著研究。其中四位完訓後留下，成為我們的主治醫師。以下為各自的第一作者論文。", "papers": [{"who": "伍智杰醫師", "now": ""}, {"who": "陳緯綸醫師", "now": "現任主治醫師"}, {"who": "林玠鴻醫師", "now": "現任主治醫師"}, {"who": "曾丞尉醫師", "now": "現任主治醫師"}, {"who": "余陞翰醫師", "now": "現任主治醫師"}], "note": "得獎與論文資料依科內紀錄整理，論文連結至 DOI。"}}, "en": {"meta": {"lang": "en", "title": "Zhongxing ED | Emergency Department, Taipei City Hospital Zhongxing Branch", "skip": "Skip to main content", "langLabel": "Language", "desc": "Emergency Department of Taipei City Hospital, Zhongxing Branch, next to Taipei Main Station: emergency medicine residency, airway and POCUS training, Tuesday teaching day, research and international exchange."}, "nav": {"who": "For you", "sig": "Airway · POCUS", "tue": "Tuesday Teaching Day", "train": "Training & partners", "fac": "Faculty", "res": "Research", "intl": "International", "hist": "Our history", "crisis": "Disasters & pandemics", "honors": "Honors", "place": "Taipei Main Station · Dadaocheng", "join": "Join us", "app": "Teaching innovation", "faq": "FAQ", "care": "Care for the city", "stars": "Resident wins"}, "hero": {"eyebrow": "Taipei City Hospital, Zhongxing Branch · Department of Emergency Medicine", "h1": "Rooted in old Taipei,<br><em>ready for every emergency</em>.", "sub": "From the crossroads of Taipei Main Station to the century-old shophouses of Dadaocheng. At Zhongxing ED, rapid emergency care, difficult airway, point-of-care ultrasound, clinical teaching and disaster response all sit within one team. All 12 attending physicians are board-certified in emergency medicine and work full-time.", "btn1": "See how we train", "btn2": "I need care", "mission": "Our mission: to provide timely, safe and compassionate emergency care, while we keep improving the skills, evidence and systems our community depends on.", "pillars": [{"t": "Guarding our community", "d": "The first line of defense for Taipei Main Station, Beimen, Dadaocheng and Wanhua."}, {"t": "Craftsmanship in airway and ultrasound", "d": "What we research is what we teach. Our papers are our curriculum."}, {"t": "Prepared for the unexpected", "d": "SARS, the Formosa Fun Coast dust explosion, the Wanhua COVID-19 outbreak. We were there every time."}]}, "mon": {"aria": "Department figures in a patient-monitor style: about 30,000 ED visits a year, 12 full-time attending physicians, 4 partner medical centers, 42–48 months of residency training", "k1": "ED VISITS / YR", "u1": "Average annual ED visits, 2023–2025", "k2": "ATTENDINGS", "u2": "All full-time, all board-certified in EM", "k3": "PARTNER CENTERS", "u3": "Partner training medical centers", "k4": "TRAINING", "v4": "42–48", "u4": "months · EM residency"}, "logoAlt": "Zhongxing ED logo: the Taipei skyline on the left, Dadaocheng shophouses on the right, and lungs, an ultrasound probe and an ECG trace in the center", "who": {"eyebrow": "Choose who you are", "h2": "Who are you?", "tabs": ["Patients and families", "Future EM residents", "Medical students · UGY · PGY", "Paramedics · EMT"], "panels": [[{"n": "24 h", "h": "Emergency care, every day of the year", "p": "We have offered 24-hour emergency care since 1976. Medical, surgical and pediatric patients are seen in separate areas, with separate rooms for children and adults. Gynecology has its own private, patient-friendly room (the \"Warm Room\")."}, {"n": "12", "h": "Every shift is covered by EM specialists", "p": "All 12 full-time attending physicians are board-certified in emergency medicine, with two attending physicians on duty 24 hours a day. Three ultrasound machines at the bedside allow immediate focused scans."}, {"n": "MRT Beimen", "h": "Right next to Taipei Main Station", "p": "No. 145, Zhengzhou Road, Datong District, Taipei. Walking distance from MRT Beimen Station, or walk from Exit Y27 of the Taipei City Mall underground."}, {"n": "Acute care at home", "h": "Acute care at home after discharge", "p": "For patients with limited mobility or difficulty reaching a hospital, and after a physician's assessment, doctors with emergency medicine backgrounds can visit at home or remotely. Acute illnesses such as pneumonia, urinary tract infections and soft-tissue infections can be treated at home."}, {"n": "Palliative · Geriatric", "h": "Care for older adults and patients at the end of life", "p": "All attending physicians are qualified in hospice and palliative care. We promote age-friendly acute care (ACE) and shared decision-making, and work with the Department of Integrated Medicine to link the ED with inpatient, home and long-term care."}, {"n": "Isolation pathway", "h": "Infection triage for safer care", "p": "Isolation rooms have their own entrance and isolated ventilation. Patients with fever or suspected infectious disease are separated at triage. The ED observation unit has 18 beds, each with a privacy curtain."}], [{"n": "16 shifts / mo", "h": "Predictable hours", "p": "Each shift is 12 hours, about 192 hours a month (capped at 200). On adult ED rotations, night shifts come in fixed one-week blocks. No erratic day-night switching."}, {"n": "R1–R2", "h": "Full attending supervision", "p": "In the first and second years you see patients under a teaching attending physician. In the last hour of every shift, the supervising attending picks one case for immediate feedback. Two attending physicians are on duty 24 hours a day."}, {"n": "Every Tuesday", "h": "Teaching day, off the front line", "p": "On teaching day, residents are not responsible for front-line clinical work. They spend the day with an attending physician on core lectures, a reading group (Tintinalli, 9th edition), journal club and case discussions."}, {"n": "App-based assessment", "h": "Competency-based (CBME)", "p": "All milestone and EPA assessments are completed in the resident app. The results were published in JMIR Medical Education (2025). You can see your own growth curve at any time."}, {"n": "Two mentors", "h": "Someone has your back", "p": "Each resident has two mentors, one inside and one outside the department. There are monthly mentor meetings, a quarterly meeting with the hospital superintendent, and an in-house psychologist to help assess stress."}, {"n": "Publish in year one", "h": "Research that starts from clinical questions", "p": "At least one conference poster or paper every year. Our residents' aerosol research won the ICEM Best Poster Award in 2023."}], [{"n": "PGY", "h": "Partner hospital for PGY emergency training", "p": "The Zhongxing Branch is a partner hospital for the two-year postgraduate general medical training program. In the ED, POCUS and airway training begin in PGY."}, {"n": "R3 as TAs", "h": "Senior residents teach you", "p": "From the third year, residents serve as teaching assistants for PGY airway and ultrasound courses, and then step up to lecture. Learning by teaching is part of our culture."}, {"n": "CrazyatLAB", "h": "Get hands-on with every intubation tool", "p": "Video laryngoscopes, Pentax AWS, video intubation stylets, fiberoptic scopes, hyperangulated laryngoscopes, a transparent intubation manikin and a neonatal intubation manikin."}, {"n": "Short-term training", "h": "UGY, clerks and interns: tailored to you", "p": "UGY students, clerks and interns can arrange short emergency rotations of a length that fits their needs. A regional hospital ED next to Taipei Main Station, with a diverse patient mix: older adults, people experiencing homelessness, tourists and commuters. Add mass casualty drills, and you learn what textbooks leave out."}, {"n": "International", "h": "Present abroad with your teachers", "p": "Recent presentations at ICEM (Amsterdam), EUSEM (Barcelona), AMEE (Switzerland) and WAMM (Italy)."}, {"n": "Contact", "h": "Want to visit?", "p": "Contact the Department of Education and Research, Zhongxing Branch (02-2552-3234), or scroll down to \"Join us\"."}], [{"n": "Handover", "h": "Said clearly, heard carefully", "p": "Clear handover is our command philosophy. The few minutes when an ambulance arrives shape everything that follows for the patient."}, {"n": "Drills", "h": "Mass-casualty drills, side by side", "p": "In city resilience exercises and mass-casualty drills, ED, EMS and fire crews practise together from field triage to in-hospital transfer."}, {"n": "USAR", "h": "Partners of Taipei Search and Rescue", "p": "In December 2023, Taipei City Hospital and the Taipei City Fire Department signed an MOU to train and drill together regularly; Drs Ya-Chin Liang and Wei-Lun Chen are contracted physicians of the search-and-rescue team. During the 2024 Hualien earthquake, our doctors mobilised."}, {"n": "DMAT", "h": "Hospital disaster medical team", "p": "Several attendings are certified disaster commanders by the Health Department. We train together and deploy together."}, {"n": "Airway", "h": "The breath that matters most", "p": "Our airway workshops start with mask ventilation and SALAD suction, the skills that matter most in the field."}, {"n": "Contact", "h": "Want to train with us?", "p": "For partnerships and visits, contact the Zhongxing Branch Department of Education and Research (02-2552-3234)."}]]}, "sig": {"eyebrow": "Signature training · our papers show our strengths", "h2": "Two signatures: airway and POCUS", "lead": "What we research is what we teach. Difficult airway and point-of-care ultrasound are where Zhongxing ED publishes the most, teaches the most engaging courses, and gives residents the most solid training.", "evk": "EVIDENCE · our own papers", "air": {"eyebrow": "Airway · CrazyatLAB", "h3": "When you cannot see the glottis, you know the next step.", "p": "Department director Dr. Tzu-Yao Hung is a CrazyatLAB instructor. His doctoral dissertation was on strategies for difficult intubation when only the epiglottis is visible. In the department's cadaver and manikin studies, the participants are PGY doctors who have been in the ED for only 2–5 months. The findings feed straight back into your training.", "steps": [{"b": "STEP 1", "s": "Bag-mask ventilation, direct laryngoscopy with a bougie, and SALAD suction airway decontamination"}, {"b": "STEP 2", "s": "The full range of video laryngoscopy: hyperangulated laryngoscopes, video intubation stylets, fiberoptic scopes"}, {"b": "STEP 3", "s": "Peyton's four-step approach for video intubation stylet training (AMEE 2024)"}, {"b": "STEP 4", "s": "Cricothyrotomy (FONA) and rescue algorithms; 35 successful intubations before R3"}], "li": ["Small-group workshops: two manikin stations in rotation, and when you get stuck, a TA coaches you one-on-one on a manikin alongside", "Annual airway TRM drills, with nursing colleagues taking part", "During the pandemic we developed the SHE bougie safe intubation technique, published in Emerg Med J"], "ev": ["Epiglottis-only cadaver model: the video intubation stylet had the best first-pass success (Sci Rep 2025)", "Randomized cadaver trial simulating Ludwig's angina (Am J Emerg Med 2024)", "Seated patients: intubation from the right rear vs face to face (West J Emerg Med 2025)"]}, "us": {"eyebrow": "POCUS · point-of-care ultrasound", "h3": "Trade your stethoscope for a probe, starting in PGY.", "p": "Three faculty certified by the emergency ultrasound committee, plus Dr Che-Chang Hsu, who writes about ultrasound anatomy. Training starts in PGY. By R3 you can perform focused ultrasound on your own and write formal reports under attending supervision.", "steps": [{"b": "Machines", "s": "High-end color Doppler with contrast (CEUS), Philips Sparq, handheld ultrasound"}, {"b": "Courses", "s": "Abdominal pain (\"blood, fluid, gallbladder, kidney\"), flank pain, DVT, RUSH, heart valves"}, {"b": "Gamified", "s": "Dr. Bor-Hen Wu's gamified POCUS teaching and spot-diagnosis contests"}, {"b": "Goal", "s": "150 scans and 11 required case types before R3"}], "li": ["One month in the ultrasound unit in R3, with an optional 1–3 months of emergency ultrasound at Shin Kong", "Ultrasound-guided nerve blocks for pain control, central venous access and procedures", "From R3, serve as a TA for PGY ultrasound courses"], "ev": ["Disco spotlight sign: detecting pneumomediastinum with ultrasound (Am J Emerg Med 2017)", "Point-of-care ultrasound diagnosis of acute epiglottitis (Am J Emerg Med 2011)"]}, "ws": [{"n": "REBOA workshop", "p": "Hands-on practice with resuscitative endovascular balloon occlusion of the aorta, led by disaster medicine specialist Dr. Wei-Lun Chen."}, {"n": "Emergency delivery workshop", "p": "Scenario: a woman in labor arrives at the ED entrance by taxi, with the baby's head already crowning. Practice step by step until the placenta is delivered."}, {"n": "Toxicology mock oral exam", "p": "Pesticide poisoning, novel psychoactive substances, toxic chemical disasters. Practice your responses in the board oral exam format."}, {"n": "Venomous snake training", "p": "Identifying and managing Taiwan's six major venomous snakes, from the scene to antivenom."}]}, "tue": {"eyebrow": "Tuesday Teaching Day · 09:00–15:00", "h2": "Every Tuesday is your teaching day", "lead": "We concentrate teaching on Tuesdays. Residents are not responsible for front-line clinical work that day and spend the whole day in class with attendings. Attendings take turns hosting, each leading the field they know best.", "days": [{"d": "MON", "s": "Clinical"}, {"d": "TUE", "s": "Teaching day"}, {"d": "WED", "s": "Hospital-wide grand rounds"}, {"d": "THU", "s": "Clinical"}, {"d": "FRI", "s": "Monthly joint surgical conference"}, {"d": "SAT", "s": "Monthly radiology conference"}, {"d": "SUN", "s": "Clinical"}], "src": "Source: Zhongxing ED teaching-day agendas and teaching files, 2023–2025.", "menuH": "Every Tuesday, always on the menu", "menu": ["Core curriculum (Tintinalli, 9th ed.)", "Book club and journal club", "Case-based discussion (CbD)", "72-hour return-visit review", "Chart writing", "Ethics and law", "Simulation and workshops"], "modH": "Fields hosted in rotation by our attendings", "modules": [{"f": "Critical care (ICU-level management)", "p": "Assessing and managing critically ill ED patients, bridging to intensive care."}, {"f": "Airway · Research", "p": "Difficult-airway workshops and residents' research progress meetings."}, {"f": "POCUS", "p": "From abdominal and flank pain to DVT and RUSH: a complete bedside ultrasound curriculum."}, {"f": "Trauma", "p": "ATLS core curriculum and trauma management."}, {"f": "ECG · Book club", "p": "ECG interpretation and textbook reading."}, {"f": "Pediatric emergencies · Sports medicine", "p": "Critical pediatric emergencies, fluids and shock in children, and pediatric mock oral exams."}, {"f": "Emergency OB/GYN", "p": "Common obstetric and gynecological emergencies, from bleeding in pregnancy to precipitous delivery."}, {"f": "Prehospital care · Disaster", "p": "Prehospital care and medical direction, DMAT, and simulation workshops such as REBOA."}, {"f": "Airway · Toxicology", "p": "Airway management and toxicology."}]}, "train": {"eyebrow": "Emergency Medicine Residency · 42–48 months", "h2": "What makes our residency different", "lead": "Emergency medicine residency here lasts 42–48 months. With acute and critical care in the community at our core, we train emergency physicians who can handle disasters, understand palliative care, do research and teach others.", "feat": [{"h": "Difficult airway", "p": "The department director is a CrazyatLAB instructor. The department has Trachway, Pentax AWS, fiberoptic scopes, and hyperangulated and channeled video laryngoscopes. Before R3, residents complete at least 35 successful intubations and can perform a cricothyrotomy."}, {"h": "POCUS and contrast-enhanced ultrasound", "p": "High-end color Doppler ultrasound with contrast capability (CEUS), Philips Sparq and handheld ultrasound. Three faculty certified by the emergency ultrasound committee. Residents complete at least 150 focused ultrasound scans before R3."}, {"h": "Toxicology and environmental medicine", "p": "A toxicology curriculum of 15 topics, covering pesticides, heavy metals, novel psychoactive substances, snakebites and marine envenomation. One month of external training in the Division of Clinical Toxicology at Taipei Veterans General Hospital. Our residents won the toxicology spot-diagnosis championship of the Taiwan Society of Emergency Medicine."}, {"h": "Disaster medicine and EMS", "p": "The hospital emergency operations center and DMAT, rotations at the dispatch command center and with advanced life support ambulance teams, and courses in nuclear disaster and combat casualty response. Taipei City urban search-and-rescue team physicians and disaster commanders teach in person."}, {"h": "Palliative and geriatric care", "p": "All attending physicians are qualified in hospice and palliative care. Before promotion, residents take part in a palliative care role-play theater. You learn to break bad news, discuss DNR orders and recognize patients at the end of life."}, {"h": "Gamification and simulation", "p": "Gamified ultrasound teaching, REBOA workshops, venomous snake training, and emergency delivery and neonatal resuscitation simulation. Nursing colleagues join the annual airway TRM drill."}], "planner": {"eyebrow": "Rotation planner", "h3": "Where do you train each year?", "legend": ["Zhongxing ED", "In-house / other TCH branches", "Partner hospital rotations", "Research"], "month": "mo", "monthsTitle": "months", "note": "Based on the 2026 training plan. Residents draft their own schedules, which are adjusted after approval by the program director and department director.", "years": {"R1": {"goal": "Goals: recognize abnormal vital signs, take a complete history and physical exam, learn basic ultrasound and ECG interpretation, and hold a valid ACLS certificate. After passing a 360-degree assessment (EPA ≥ 3), residents may manage triage level 1 patients.", "items": [["Adult ED", "Zhongxing ED"], ["Pediatrics", "Women and Children's Branch or MacKay"], ["Internal medicine", "General medicine wards"], ["Surgery", "General surgery and consults"], ["Obstetrics and gynecology", "OB/GYN wards and ED"], ["Otolaryngology", "Outpatient clinic and consults"], ["Ophthalmology", "Outpatient clinic and consults"]]}, "R2": {"goal": "Goals: manage several patients at once and set priorities; get certified in intermediate procedures such as intubation, chest tubes and central venous catheters; obtain ETTC, ATLS or APLS.", "items": [["Adult ED", "Zhongxing ED"], ["Medical ICU", "Critical care medicine"], ["Pediatrics", "Women and Children's Branch or MacKay"], ["Neurology", "Wards and neck ultrasound"], ["Surgery", "Surgery and trauma"], ["Disaster medicine", "Emergency operations center and DMAT"], ["Medical imaging", "Diagnostic radiology"], ["Elective", "Linkou Chang Gung ED/trauma, Shin Kong ultrasound"]]}, "R3": {"goal": "Goals: lead ED operations during peak hours and receive chief resident administrative training; 150 focused ultrasound scans, 35 intubations and cricothyrotomy; obtain AILS; start serving as a TA for PGY courses and designing research.", "items": [["Adult ED", "Zhongxing ED"], ["Surgical ICU", "Critical care medicine"], ["Pediatric ED", "Women and Children's Branch or MacKay"], ["Psychiatry", "Songde Branch"], ["Emergency medical services", "Dispatch command center + advanced life support teams"], ["Ultrasound", "Ultrasound unit"], ["Toxicology", "Clinical Toxicology, Taipei Veterans General Hospital"], ["Elective · remote area", "Kinmen Hospital, NTUH Hsinchu Biomedical Park Branch, or others"]]}, "R3.5": {"goal": "Goals: develop a subspecialty interest, complete a research publication and training in disasters and toxic chemical disasters, take part in ACLS instructor and EMS medical director training, and pass the emergency medicine board examination.", "items": [["Adult ED", "Zhongxing ED"], ["Pediatric ED", "Pediatric wards and ED"], ["Elective", "Linkou Chang Gung, Shin Kong, MacKay, or our department"], ["Research", "Choose a topic and a supervisor"]]}}}, "flag": [{"k": "FLAGSHIP · PEDIATRICS", "h": "MacKay Memorial Hospital · Pediatrics and Pediatric Emergency", "mo": "Up to 4 months", "p": "Pediatric and pediatric emergency training takes place at the TCH Women and Children's Branch or MacKay Pediatrics, for four months in total. MacKay is an emergency medicine training hospital and the base hospital for our referral program. An additional 1–3 months of emergency or critical care medicine can be chosen as an elective."}, {"k": "FLAGSHIP · CRITICAL CARE", "h": "National Taiwan University Hospital (NTUH) · ED Critical Care Area", "mo": "1–3 months", "p": "Care for the sickest patients in a medical center's emergency critical care area, and see case volumes that are less common in a regional hospital. Together with 2 months each in our own medical and surgical ICUs, critical care training can reach up to 7 months."}, {"k": "TRAUMA", "h": "Linkou Chang Gung Memorial Hospital · Emergency Department · Trauma", "mo": "1 month each", "p": "During electives, spend at least one month each in the Linkou Chang Gung ED and the trauma ED, learning major trauma team and massive transfusion protocols."}, {"k": "TOXICOLOGY", "h": "Taipei Veterans General Hospital · Division of Clinical Toxicology", "mo": "1 month", "p": "At a medical center accredited for clinical toxicology specialty training, handle all kinds of poisoning consults and poison information inquiries."}], "partners": [{"k": "PEDIATRICS", "b": "TCH Women and Children's Branch", "s": "Pediatrics and obstetrics and gynecology"}, {"k": "ULTRASOUND", "b": "Shin Kong Wu Ho-Su Memorial Hospital", "s": "Emergency ultrasound, 1–3 months"}, {"k": "REMOTE AREA", "b": "Kinmen Hospital, Ministry of Health and Welfare · NTUH Hsinchu Biomedical Park Branch", "s": "Remote-area acute and critical care, 1 month"}, {"k": "PSYCHIATRY", "b": "TCH Songde Branch", "s": "Psychiatric wards and clinics, 1 month"}], "weekH": "Regular academic schedule beyond Tuesdays", "weekCols": ["When", "Activity", "Content"], "week": [["Last hour of every shift", "Clinical feedback", "The supervising attending picks one case to discuss and gives real-time milestone assessment in the app"], ["Monthly", "Reading group", "Tintinalli's Emergency Medicine, 9th edition; new residents also have a Minor emergency reading group"], ["Second Friday of each month", "Joint ED–surgery conference", "Case reports, trauma team activation and trauma quality indicators"], ["One Saturday a month", "Joint ED–radiology conference", "Reading images together with radiologists"], ["Every other month", "Joint conference with Integrated Medicine", "Linking the ED with inpatient, home and long-term care"], ["Every two months from R3", "Research meeting", "From clinical question to study design, IRB and submission"]]}, "fac": {"eyebrow": "All board-certified in EM · all full-time", "h2": "Our faculty", "lead": "Every attending is board-certified in emergency medicine and works full-time. The team is young, positive and driven, and we never leave residents to fend for themselves. Teachers marked \"Trained here · now attending\" completed residency at Zhongxing and stayed. Select \"Read story\" to see each teacher's background.", "culture": [{"b": "100%", "h": "All full-time, all board-certified in EM", "p": "Every teacher who supervises you is an emergency medicine specialist. We have no part-time physicians."}, {"b": "Young", "h": "A young attending team", "p": "Many of our attendings are early in their careers. They are not much older than you, remember being residents and are willing to see you through."}, {"b": "4", "h": "Attendings trained at Zhongxing", "p": "Drs Chieh-Hung Lin, Wei-Lun Chen, Cheng-Wei Tseng and Sheng-Han Yu all completed residency here and stayed. The best reference is when senior residents stay on as teachers."}, {"b": "2", "h": "Two attendings on duty 24 hours a day", "p": "R1–R2 are fully supervised by attendings, with one-on-one feedback in the last hour of every shift. Nobody will tell you to \"just handle it yourself\"."}], "all": "All", "story": "Read story", "doctor": "Dr.", "tags": {"airway": "Airway", "us": "Ultrasound", "icu": "Critical care", "trauma": "Trauma", "peds": "Pediatrics", "obgyn": "OB/GYN", "sport": "Sports medicine", "ecg": "ECG", "tox": "Toxicology", "pre": "Prehospital", "dis": "Disaster", "hah": "Hospital at home", "res": "Research", "home": "Trained at Zhongxing"}, "people": [{"r": "Department Director · Medical Secretary · Airway Teaching", "li": ["PhD, Department of Biological Science and Technology, and Assistant Professor, School of Medicine, National Yang Ming Chiao Tung University (NYCU)", "CrazyatLAB instructor; IRCAD airway course instructor", "ACLS/APLS instructor; faculty certified by the emergency ultrasound committee", "Host of the podcast \"Emergency Medicine: Got It Yet?\""], "s": "A graduate of Yang-Ming Medical School, he served his alternative military service in São Tomé and Príncipe, West Africa. After emergency medicine training at Shin Kong, he has worked at Zhongxing ED since 2002. Under the pen name \"Daoren\", he has written \"Dark Fairy Tales from the ER\", \"One Minute to Save a Life: A Home First-Aid Handbook\", \"24 Hours to Save a Life: A Trauma First-Aid Handbook\", \"The Backpacker Doctor's Travel Health Guide\", \"Notes of a Young Doctor on a Black Island in West Africa\" and \"Four Doctors' Magical Adventure in South America\". During the pandemic he set up the intubation protocol, which led to an interdisciplinary aerosol research team with Taipei Tech. He received an official commendation for meritorious service from the Ministry of Health and Welfare for the Formosa Fun Coast dust explosion, an Outstanding Teacher award in 2016 and an Outstanding Physician award in 2020.", "q": "A department director obsessed with airway teaching, and an author who writes under the pen name \"Daoren\".", "tp": ["Difficult-airway workshops", "Awake airway (\"intubate the chief\")", "Aerosol research", "Research progress meetings"], "od": "A backpacker doctor who served his alternative military service in São Tomé and Príncipe, West Africa; writes popular-science books and hosts a podcast."}, {"r": "Program Director, EM Residency · Critical care (ICU-level management)", "li": ["MSc, Institute of Environmental and Occupational Health Sciences, National Yang Ming Chiao Tung University", "DTMH studies, Liverpool School of Tropical Medicine, UK, 2023", "ACLS instructor; member of the hospital medical education committee", "Outstanding Physician, Taipei City Hospital"], "s": "She trained in emergency medicine at Shin Kong and specializes in toxicology and environmental medicine. She led our residents to win the 2023 toxicology spot-diagnosis championship of the Taiwan Society of Emergency Medicine. With a dream of joining Médecins Sans Frontières, she completed tropical medicine studies in Liverpool from September to December 2023. A mother of three, she is also a Dadaocheng tour guide who shares the neighborhood's charm with visitors from abroad. Her research on mobile CBME assessment was published in JMIR Medical Education.", "q": "A mother of three, and the program director who led residents to a toxicology spot-diagnosis championship.", "tp": ["Critical care (ICU-level management)", "Toxicology and pesticide poisoning", "Emerging drugs of abuse", "Emergency tropical medicine", "Emergency delivery workshop", "Breaking bad news and medical ethics"], "od": "A licensed Dadaocheng tour guide who shows foreign visitors around the neighbourhood; dreaming of Médecins Sans Frontières, she studied tropical medicine in Liverpool."}, {"r": "Deputy Director, Department of Emergency Medicine · POCUS Program Lead", "li": ["Faculty certified by the emergency ultrasound committee", "ACLS instructor", "Currently in a master's program at National Taiwan University", "Certified fitness professional", "Team physician, Chinese Taipei delegation, 2022 Deaflympics (Brazil)"], "s": "He completed an ultrasound research fellowship in the later part of his emergency medicine training at Shin Kong. He has been involved in a medical device startup. At Zhongxing he has made POCUS training start in PGY, and trainees consistently rate it highly. In 2022 he served as team physician for Taiwan's delegation to the Deaflympics in Brazil.", "q": "The deputy director who roots POCUS from PGY all the way to the board exam.", "tp": ["RUSH", "Deep vein thrombosis", "Acute flank pain", "Gallbladder and bile duct", "Ultrasound for dyspnea", "Ocular and testicular ultrasound", "Ultrasound-guided lumbar puncture"], "od": "A certified fitness professional and former medical-device entrepreneur; during the pandemic he travelled to Brazil as a Deaflympics team physician."}, {"r": "Ultrasound teaching · Gamified teaching", "li": ["ACLS/APLS instructor", "Faculty certified by the emergency ultrasound committee", "Outstanding Physician, Taipei City Hospital, 2023", "Emergency ultrasound fellow, Shin Kong Hospital"], "s": "The very first fellow of Shin Kong's emergency ultrasound fellowship, he leads ultrasound training for Zhongxing residents. A lover of gamified teaching, he brings laughter wherever he goes and builds games into bedside ultrasound teaching. He loves to travel.", "q": "Where he goes, laughter follows: he brings games into ultrasound teaching.", "tp": ["Lung ultrasound", "POCUS in CPR", "Aortic ultrasound", "Fluid responsiveness", "Cardiac valves", "Diagnostic reasoning and cognitive bias"], "od": "Loves to travel and plays Magic: The Gathering."}, {"r": "Bedside POCUS teaching · Ultrasound anatomy", "li": ["Emergency ultrasound fellow, Shin Kong Hospital", "Ultrasound anatomy columnist, POCUS Academy"], "s": "A graduate of Chung Shan Medical University School of Medicine, he trained in emergency medicine at Shin Kong and completed an ultrasound fellowship there. At Zhongxing he teaches ultrasound anatomy: building 3D structures in your head from 2D images, and spotting pathology in the images as if playing a POCUS game. He enjoys photography and cats.", "q": "An ultrasound-anatomy craftsman who builds 3D structures in his head from 2D images.", "tp": ["Ultrasound anatomy", "POCUS Game", "End-of-life conversations and ethics in the ED"], "od": "Photography and cats; he records daily life in images."}, {"r": "Trauma Training Lead", "li": ["AHA ACLS instructor", "Disaster commander qualification, Department of Health"], "s": "After completing emergency medicine training at MacKay, he moved to Zhongxing, where he is responsible for trauma education. On the night of the Formosa Fun Coast dust explosion, he was the physician on duty at MacKay's Tamsui branch and saw the mass casualty activation and response firsthand.", "q": "On the night of the Formosa Fun Coast dust explosion, he was the emergency physician on duty at MacKay Tamsui.", "tp": ["ATLS", "Abdominal trauma", "Major trauma mock oral exams", "Pelvic dislocation and compartment syndrome", "Massive transfusion", "Deep neck infection"]}, {"r": "ECG teaching · Book club", "li": ["Graduate of National Taiwan University College of Medicine; completed residency at Zhongxing ED", "Disaster commander qualification, Department of Health", "First author of the Formosa Fun Coast dust explosion response paper"], "s": "After completing his specialty training at Zhongxing ED, he stayed on as an attending physician. As chief resident, he documented the Formosa Fun Coast dust explosion response and published it. His ECG teaching is careful and sharp, and he has performed many nerve blocks in the ED. Father of two.", "q": "A meticulous, sharp ECG teacher who wrote up the dust-explosion response as chief resident.", "tp": ["ECG interpretation", "Shock and respiratory failure", "Massive transfusion", "Tension pneumothorax", "Myocardial infarction", "Nerve blocks"], "od": "Father of two, whose humorous banter helps everyone unwind after a hard shift."}, {"r": "Pediatric emergencies · Sports medicine", "li": ["APLS instructor", "Completed a sports medicine program; team physician for sports teams on several occasions", "Former emergency attending, Kinmen Hospital", "Corresponding author, Indoor Air 2026"], "s": "A graduate of Yang-Ming Medical School, she trained in emergency medicine at Shuang Ho Hospital, then served in Kinmen and stayed on as an attending. At Zhongxing she leads pediatric teaching: critical pediatric emergencies, fluids and shock in children, pediatric infections and respiratory emergencies, plus pediatric mock oral exams at board standard. A keen sports-medicine doctor, she has served as team physician several times, including with the U17 women's football team in Ulaanbaatar, Mongolia. She is also active in research, as corresponding author of a 2026 aerosol paper. She loves diving, comics and video games.", "q": "From Kinmen to Ulaanbaatar: a team physician who takes pediatric emergency and sports medicine wherever she goes.", "tp": ["Critical pediatric emergencies", "Fluids and shock in children", "Pediatric respiratory emergencies", "Abdominal pain and foreign-body ingestion in children", "Fever with rash", "Pediatric mock oral exams", "Medical law"], "od": "Diving, comics and video games."}, {"r": "Disaster · Prehospital care · DMAT", "li": ["Online medical control physician", "Disaster commander qualification, Department of Health", "Contracted physician, Taipei City urban search-and-rescue team", "Team physician, Special Olympics"], "s": "A graduate of Chung Shan Medical University, he completed emergency medicine training at Dalin Tzu Chi Hospital. He specializes in disaster response and prehospital care, plans training for our hospital's DMAT, and runs courses on incident command systems and hospital combat casualty response.", "q": "Turning the hospital into a system that can respond: DMAT, incident command, combat-casualty planning.", "tp": ["Hospital incident command system", "Search-dog first aid (rescue-team training)", "Nuclear and chemical disasters", "TECC (tactical emergency casualty care)", "Hospital combat-casualty response plan", "Chemical mass-casualty drills", "EMS research directions"], "od": "Team physician for the Special Olympics."}, {"r": "Prehospital care · Disaster medicine", "li": ["Taipei City Young Physician Award (Qingnian Xinglin Award), 2023", "Contracted physician, Taipei City urban search-and-rescue team", "Disaster commander qualification, Department of Health", "Deployed for the Hualien earthquake rescue"], "s": "A graduate of Yang-Ming Medical School, he did his alternative military service as a doctor in Kinmen, and is an Amis warrior from Ji'an, Hualien. A fine product of Zhongxing ED training, he specializes in disaster medicine and prehospital care, and is one of the main authors of our aerosol research series. A top badminton player.", "q": "An Amis warrior from Ji'an, Hualien, and a disaster-medicine attending trained at Zhongxing.", "tp": ["REBOA workshop", "Taiwan disaster medical triage", "Japan DMAT", "Blast injuries", "Chemical and electrical injuries", "Emerging street drugs"], "od": "A natural athlete and a top badminton player."}, {"r": "Emergency obstetrics and gynecology teaching", "li": ["Completed residency at Zhongxing ED", "First author, West J Emerg Med 2025 (seated intubation randomized trial)", "First author, Emerg Med J 2024"], "s": "A new-generation attending physician who completed residency at Zhongxing and stayed on. As a resident he took part in difficult airway and aerosol research, and published as first author a randomized crossover trial of seated intubation from the right rear versus face to face.", "q": "A new-generation attending trained at Zhongxing, from upright-intubation research to emergency OB/GYN.", "tp": ["Emergency OB/GYN", "Difficult-airway research"]}, {"r": "Airway management · Toxicology", "li": ["Completed EM residency at Zhongxing, now an attending", "First author, Emerg Med J 2026 (SVT and troponin, completed during residency)", "Honourable mention, oral presentation (surgical division), Nine-Hospital Resident Research Forum", "Co-author of aerosol and difficult-airway studies (Indoor Air 2026, Sci Rep 2025, Am J Emerg Med 2024)"], "s": "He completed residency at Zhongxing and stayed on as an attending. As a resident he joined the aerosol and difficult-airway research team and co-authored several papers. His clinical focus is airway management and toxicology, which he brings to Tuesday teaching day.", "q": "A new attending who joined the research team while still a resident.", "tp": ["Airway management", "Toxicology", "Aerosol research"]}, {"r": "Attending, Integrated Medicine · Hospital at Home (HAH)", "li": ["Trained as an EM resident at Zhongxing", "ICEM 2023 Campbell MacFarlane Best Poster Award", "First author, Sci Rep 2023 (aerosol dispersion during oxygen therapy)"], "s": "As a resident he won the Best Poster Award at ICEM in Amsterdam for research on aerosol dispersion during oxygen therapy, and taught our Hospital at Home course. Now an attending in Integrated Medicine, he works in Taiwan's Hospital at Home programme, helping homebound patients finish treatment for pneumonia, urinary and soft-tissue infections at home, and is one of the ED's closest partners.", "q": "Starting from the ED, he brings acute care back into patients' homes.", "tp": ["Hospital at Home", "Echocardiography", "POCUS for fluid status"]}], "homeBadge": "Trained here · now attending", "partnerBadge": "Integrated Medicine · ED partner", "pfBtn": "Profile →", "pfTopics": "What they teach", "pfCv": "Background and achievements", "pfStory": "Story", "pfOff": "Off duty", "pfPubs": "Publications ({n}; up to 5 shown)"}, "res": {"eyebrow": "Research · updated Oct 2026", "h2": "Research that starts from clinical questions", "lead": "Our research mission: to make emergency airway management and respiratory therapy safer for patients, healthcare workers and the care environment. Our two main lines are <b>bioaerosol exposure during emergency and critical airway procedures</b> and <b>intubation strategies for the difficult airway</b>. We also study competency-based medical education, national health insurance data and clinical cases. Every paper links to its DOI.", "hl": [{"b": "Q1", "s": "Annals of Emergency Medicine, JMIR Med Educ (ranked No. 1 in education), Indoor Air"}, {"b": "8", "s": "papers in our aerosol series, 2021–2026"}, {"b": "2", "s": "randomized difficult airway trials in fresh frozen cadavers"}, {"b": "7", "s": "consecutive years of research grants from the Taipei City Department of Health and the National Science and Technology Council (NSTC)"}], "search": "Search titles, journals or authors", "count": "{n} papers", "empty": "No matching papers. Try another keyword.", "cats": {"all": "All", "aer": "Aerosol", "air": "Airway", "edu": "Medical education", "us": "Ultrasound", "dis": "Disaster", "nhi": "NHI database", "case": "Clinical", "oth": "Other"}, "summaries": {"ina26": "A hierarchy of protection during inhalation therapy: negative pressure ≫ N95 on the patient ≫ surgical mask. An open T-tube should not rely on single-point HEPA extraction alone.", "jfma26": "Using ISAR to screen older adults for risk of ED return visits and readmission.", "sr25": "Fresh frozen cadaver \"epiglottis-only\" difficult airway model: the video intubation stylet had advantages in first-pass success and intubation time.", "ina25": "Mechanical CPR produced significantly less aerosol at the head end than manual CPR. An endotracheal tube with HEPA plus extraction almost completely eliminated it.", "wjem25": "Randomized crossover comparison of intubation from the right rear versus face to face in seated patients.", "jmir25": "Zhongxing ED's mobile CBME assessment system: more immediate than paper or web forms, and preferred by residents.", "jhi25": "When isolation rooms are lacking, directional air purifiers and HEPA extraction can serve as alternatives to negative-pressure rooms.", "emj24": "An ED imaging diagnosis case.", "ajem24": "Randomized cadaver trial simulating Ludwig's angina: the video intubation stylet had better success and efficiency.", "sr23b": "The ICEM 2023 Best Poster Award study: dispersion distance does not equal concentration. The patient's feet are an overlooked high-exposure zone.", "sr23a": "Adding a tight-fitting mask to bystander hands-only CPR can reduce exposure at the head end by more than 80%.", "aem23": "An Annals of Emergency Medicine image case.", "aem22": "Comparing aerosol generation across five methods of preoxygenation before intubation.", "plos21": "Early pandemic: a negative-pressure isolation hood and HEPA extraction to protect intubating staff.", "emj20": "Safe intubation techniques for COVID-19.", "bmc19": "When only the epiglottis is visible, lifting the epiglottis with the tube is the key to higher success.", "jam19": "Formosa Fun Coast dust explosion: how a regional hospital without a burn unit responded.", "ajem17": "A new ultrasound sign for diagnosing pneumomediastinum.", "cc26": "Prone positioning redirects exhaled aerosol: in-mask exposure of bedside staff fell in 13 of 16 paired comparisons (mean −51%), but rose with a sealed CPAP mask at the head.", "emj26": "Paroxysmal SVT in the ED: troponin elevation strongly predicts hospital admission but not 30-day outcomes (propensity-matched cohort)."}, "grantsH": "Research grants (principal investigator: Tzu-Yao Hung)", "grants": [["Quantifying exposure to infectious aerosols during manual and mechanical CPR, and evaluating prevention strategies", "Taipei City Department of Health · 2026"], ["Mechanisms of and treatment strategies for brain dysfunction caused by hyperammonemia", "NSTC · 2025–2026"], ["A randomized controlled trial comparing right-rear and face-to-face tracheal intubation in seated patients (Pentax AWS, video intubation stylet, hyperangulated laryngoscope)", "Taipei City Department of Health · 2025"], ["Assessing aerosol transmission risk during oxygen therapy with multi-point environmental concentration measurement and flow visualization", "Taipei City Department of Health · 2024"], ["Effectiveness of negative pressure, HEPA suction and surgical masks in clearing aerosols in an enclosed isolation space", "Taipei City Department of Health · 2023"], ["Aerosol leakage risk of various airway devices during continuous compressions and 30:2 CPR", "Taipei City Department of Health · 2022"], ["Combining a negative-pressure isolation hood, HEPA and video laryngoscopy to reduce the risk of infectious airway procedures", "Taipei City Department of Health · 2021"]], "confH": "International conference presentations", "conf": [["Third World Airway Management Meeting (WAMM), Italy", "2025 · poster"], ["AMEE (Association for Medical Education in Europe) conference, Switzerland: Peyton's four-step approach for video intubation stylet training", "2024"], ["European Airway Management Society Congress, Baveno, Italy", "2023"], ["EUSEM (European Society for Emergency Medicine), Barcelona: mobile CBME assessment; aerosol exposure in three CPR scenarios", "2023"], ["ICEM (International Conference on Emergency Medicine), Amsterdam: <b>Campbell MacFarlane Best Poster Award</b>", "2023"], ["Asian Conference on Emergency Medicine", "2021"], ["EUSEM: Glasgow 2018, Prague 2019, online 2020", "Multiple"]], "ongoing": "<b>Ongoing and planned (not yet published):</b> a smart triage and continuous vital-sign monitoring project (with industry technology partners), AI-assisted low-dose, high-frequency airway training, a study of equity in emergency care for people experiencing homelessness, and a monitoring study of acute care at home.", "latestK": "LATEST PUBLICATIONS", "latest": [{"j": "Critical Care · 2026", "h": "Prone positioning changes the aerosol bedside staff inhale", "p": "Two breathing manikins, 32 configurations, particle image velocimetry: proning lowered in-mask exposure in most configurations, but raised it with a sealed CPAP mask at the head.", "a": "First author: Dr Tzu-Yao Hung, department director · co-author Dr Che-Chang Hsu", "d": "10.1186/s13054-026-06416-9"}, {"j": "Emergency Medicine Journal · 2026", "h": "Raised troponin in SVT: should we worry?", "p": "Troponin elevation strongly predicts admission but not 30-day outcomes. Completed by Dr Sheng-Han Yu during residency under Dr Tzu-Yao Hung, and awarded an honourable mention at the Nine-Hospital Resident Research Forum.", "a": "First author: Dr Sheng-Han Yu · co-author Dr Jr-Han Liou", "d": "10.1136/emermed-2026-216291"}]}, "intl": {"eyebrow": "International · across borders and disciplines", "h2": "International exchange: bringing the world into the ED", "lead": "Doctors and nurses from abroad come to Zhongxing for our airway workshops and shadow us on shift. We also take the research done at Zhongxing to international conferences in Europe. Across disciplines, our aerosol research partnership with the Department of Energy and Refrigerating Air-Conditioning Engineering at National Taipei University of Technology (Taipei Tech) is now six years old.", "cards": [{"h": "Clinicians from abroad learn airway at Zhongxing", "p": "Doctors and nurses from other countries join our airway workshops and practice station by station, from bag-mask ventilation and video laryngoscopy to fiberoptic intubation."}, {"h": "Finish the clerkship, take home a certificate", "p": "Visiting clinicians shadow in the ED and join teaching days. At the end, the department awards a certificate."}, {"h": "Taking Zhongxing research to the world stage", "p": "WAMM World Airway Management Meeting (Italy, 2025), EUSEM, ICEM, AMEE. Residents and attendings present abroad together."}, {"h": "Interdisciplinary: medicine × engineering", "p": "With Taipei Tech's Department of Refrigerating Air-Conditioning Engineering, we built a high-fidelity aerosol measurement platform that uses particle image velocimetry to turn invisible aerosols into data."}]}, "hist": {"eyebrow": "History", "h2": "A century of history: select a year to read its story", "lead": "Sources: Zhongxing Branch Emergency Medicine Residency Training Plan (18th revision, May 12, 2026) and related news reports.", "nav": "Use the arrow keys to switch years", "items": [{"t": "Red Cross Hospital founded", "h": "Japanese Red Cross Society Taiwan Branch Hospital", "p": "According to the hospital's training plan, the predecessor of the Zhongxing Branch was founded in 1905 as Taiwan's first teaching hospital.", "tag": "The beginning"}, {"t": "Emergency service established", "h": "Second Affiliated Hospital of National Taiwan University", "p": "Renamed the Second Affiliated Hospital of National Taiwan University, it set up an emergency service. This was the start of our emergency care.", "tag": "Year one of the ED"}, {"t": "24-hour emergency care", "h": "24-hour emergency care begins", "p": "Open every day of the year from then on. The emergency building opened in 1983.", "tag": "Always open"}, {"t": "New building and emergency network", "h": "ED moves to the ground floor of a new building", "p": "Took part in Taipei City's \"dual-track emergency medical network\" and co-organized the Wan An No. 22 exercise.", "tag": "Emergency network"}, {"t": "921 earthquake relief", "h": "921 earthquake relief in central and northern Taiwan", "p": "Took part in relief work and was commended by the Taipei City Government, the Taichung County Government, the Taipei Medical Association and the Taiwan Medical Association.", "tag": "Disaster response"}, {"t": "Taiwan's first fever screening station", "h": "SARS: fever screening station opens on May 13", "p": "Taiwan's first fever screening station was set up outside the Zhongxing ED, and other hospitals came to observe. During SARS we carried major medical responsibility for southern Taipei and reported 105 patients. The fight against SARS succeeded, and we received an official commendation for meritorious service.", "tag": "Official commendation"}, {"t": "Renamed Zhongxing Branch", "h": "Taipei City Hospital, Zhongxing Branch", "p": "Renamed the Zhongxing Branch, it prepared an air medical transfer system and began inter-hospital air transfers in October of that year.", "tag": "Air transfer"}, {"t": "EM training hospital", "h": "Accredited as an emergency medicine training hospital", "p": "With 10 full-time board-certified attending physicians, we began recruiting emergency medicine residents in August 2014 and formally entered emergency medicine education.", "tag": "Teaching hospital"}, {"t": "Formosa Fun Coast dust explosion", "h": "Mass casualty response without a burn unit", "p": "The whole hospital activated its mass casualty response, admitted patients with major burns and referred them to medical centers. Director Tzu-Yao Hung received an official commendation for meritorious service from the Ministry of Health and Welfare. Chief resident Chieh-Hung Lin published the response in the Journal of Acute Medicine (2019).", "tag": "Official commendation"}, {"t": "CrazyatLAB founded", "h": "CrazyatLAB founded with fellow enthusiasts", "p": "Director Tzu-Yao Hung and fellow airway educators founded CrazyatLAB, bringing difficult airway teaching into residency training.", "tag": "Airway education"}, {"t": "Mobile assessment", "h": "Two-way resident assessment moves to the phone", "p": "The web-based assessment system was rebuilt as a mobile app (AppSheet) for real-time milestone and EPA feedback. The study won a Bronze Award at the 2023 Taipei Veterans General Hospital International Medical Education Conference and was published in JMIR Medical Education in 2025.", "tag": "CBME"}, {"t": "ED renovation completed", "h": "Full renovation for patient flow, infection control and violence prevention", "p": "The ED renovation was completed in April 2019, integrating patient flow, infection control and protection against workplace violence.", "tag": "Space"}, {"t": "Aerosol research team", "h": "Aerosol prevention research team formed with Taipei Tech", "p": "Early in the pandemic we partnered with the Department of Energy and Refrigerating Air-Conditioning Engineering at National Taipei University of Technology. From the following year, results were published in journals including PLoS ONE and Annals of Emergency Medicine.", "tag": "Interdisciplinary"}, {"t": "Wanhua outbreak", "h": "Heping closed its ED, and Zhongxing took the load", "p": "We built a testing window, collected 200–400 samples a day and intubated confirmed patients. Staff lived in isolation from their families for two months, and the ED never closed. We received an official commendation for meritorious service.", "tag": "Official commendation"}, {"t": "\"Snow House\" rapid prescription clinic", "h": "Nearly 15,000 visits in April–May", "p": "At the national peak of the epidemic, we organized the \"Snow House\" rapid prescription clinic, seeing 500 patients in 4 hours at its peak and protecting capacity for critical emergencies.", "tag": "Pandemic response"}, {"t": "ICEM Best Poster", "h": "Residents on the international stage", "p": "Dr. Chih-Chieh Wu (then a resident) won the ICEM Campbell MacFarlane Best Poster Award. The same year, our residents won the toxicology spot-diagnosis championship, and Dr. Wei-Lun Chen received the Young Physician Award.", "tag": "Honors"}, {"t": "Fire Department MOU", "h": "Taipei City Hospital × Taipei City Fire Department: strengthening search and rescue", "p": "Signed on 7 December by Fire Chief Mo Huai-tsu and Taipei City Hospital CEO Hsiao Sheng-huang: joint training and drills, joint rescue missions in major disasters, joint emergency care in mass-casualty incidents, and jointly planned education courses.", "tag": "Interagency partnership"}, {"t": "Hualien earthquake", "h": "Our physicians mobilise for the Hualien earthquake", "p": "Drs Ya-Chin Liang and Wei-Lun Chen serve as contracted physicians of the Taipei search-and-rescue team: disaster medicine moves from drills to the real thing.", "tag": "Disaster response"}, {"t": "Protecting firefighters' health", "h": "A second MOU with the Taipei City Fire Department", "p": "Signed on 2 July by Fire Chief Mo Huai-tsu and Taipei City Hospital CEO Wang Chih-hung: health check-ups for firefighters, a health-management and care system, and referral for abnormal results.", "tag": "Interagency partnership"}, {"t": "Research keeps coming", "h": "Critical Care and Emergency Medicine Journal", "p": "Director Tzu-Yao Hung is first author of a Critical Care study on prone positioning and bedside staff aerosol exposure; Dr Sheng-Han Yu's SVT and troponin study, completed during residency, appears in Emergency Medicine Journal. With the Indoor Air inhalation-therapy study, the aerosol research spectrum keeps growing.", "tag": "Research"}, {"t": "Smart building for acute and critical care", "h": "Upgrade to a severe-level (highest-tier) emergency responsibility hospital (planned)", "p": "According to news reports in August 2026, a new building with 11 floors above ground and 4 below is scheduled to start construction in July 2029 and be completed in 2033. Its basement levels will connect to MRT Beimen Station and serve as an emergency medical transport passage during disasters.", "tag": "Future"}]}, "crisis": {"eyebrow": "Mass casualty · Pandemic · Disaster", "h2": "Whenever the city faces a crisis, we are there", "lead": "We have no burn center and are not the size of a medical center. Yet during SARS, the Formosa Fun Coast dust explosion and the Wanhua outbreak, Zhongxing ED received an official commendation for meritorious service three times. Our command philosophy is simple: there must always be one clear commander on scene, and every handover must be said out loud.", "stories": [{"band": "2003 · SARS", "tag": "Official commendation", "h": "Taiwan's first fever screening station", "p": "On May 13, 2003, Taiwan's first \"fever screening station\" opened outside the Zhongxing ED, and other hospitals came to observe. During the SARS outbreak in Taiwan, Zhongxing carried major medical responsibility for southern Taipei and eased the pressure on nearby hospitals.", "facts": [["05.13", "Screening station opens"], ["105", "Patients reported"], ["Southern Taipei", "Major medical responsibility"]]}, {"band": "2015 · Formosa Fun Coast dust explosion", "tag": "Official commendation", "h": "No burn unit, yet we treated major burns", "p": "Although we had no burn center, the whole hospital activated its mass casualty response. Within a short time we admitted patients with major burns and, once they were stable, transferred them to appropriate medical centers. Then chief resident Chieh-Hung Lin documented the response and published it in the Journal of Acute Medicine.", "facts": [["33", "Patients with major burns (paper)"], ["Whole hospital", "Mass casualty mobilization"], ["2019", "Response publish
