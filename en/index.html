", "h": "Second protocole avec les pompiers de Taipei", "p": "Signé le 2 juillet par le chef des pompiers Mo Huai-tsu et le directeur général Wang Chih-hung : bilans de santé des pompiers, dispositif de suivi et de prise en charge, orientation en cas de résultat anormal.", "tag": "Partenariat interinstitutionnel"}, {"t": "La recherche continue", "h": "Critical Care et Emergency Medicine Journal", "p": "Le Dr Tzu-Yao Hung signe en premier auteur une étude dans Critical Care sur le décubitus ventral et l'exposition des soignants aux aérosols ; l'étude du Dr Sheng-Han Yu sur la TSV et la troponine, menée pendant son internat, paraît dans Emergency Medicine Journal. Avec l'étude d'Indoor Air sur l'aérosolthérapie, le spectre de la recherche sur les aérosols s'élargit encore.", "tag": "Recherche"}, {"t": "Bâtiment intelligent des soins critiques", "h": "Vers le statut d'hôpital de référence d'urgence de niveau le plus élevé (en projet)", "p": "Selon la presse d'août 2026, un nouveau bâtiment de 11 étages et 4 niveaux de sous-sol : début des travaux prévu en juillet 2029, achèvement en 2033. Les sous-sols seront reliés à la station de métro Beimen et serviront de couloir d'évacuation médicale en cas de catastrophe.", "tag": "Avenir"}]}, "crisis": {"eyebrow": "Mass casualty · Pandemic · Disaster", "h2": "Quand la ville est frappée, nous sommes sur place", "lead": "Pas de centre de grands brûlés, pas la taille d'un centre médical : pourtant, lors du SRAS, de l'explosion de poussière du Formosa Fun Coast et de l'épidémie de Wanhua, les urgences de Zhongxing ont reçu trois fois la distinction officielle pour services méritoires. Notre philosophie de commandement est simple : il faut toujours un commandant clairement identifié sur le terrain, et chaque passation doit être dite à voix haute.", "stories": [{"band": "2003 · SRAS", "tag": "Services méritoires", "h": "Le premier poste de dépistage de la fièvre de Taïwan", "p": "Le 13 mai 2003, le premier « poste de dépistage de la fièvre » de Taïwan ouvre devant les urgences de Zhongxing ; les autres hôpitaux viennent l'observer. Pendant l'épidémie de SRAS à Taïwan, Zhongxing assume la charge médicale du secteur sud de Taipei et soulage les hôpitaux voisins.", "facts": [["05.13", "Ouverture du poste"], ["105", "Patients déclarés"], ["Secteur sud", "Charge médicale assumée"]]}, {"band": "2015 · Formosa Fun Coast", "tag": "Services méritoires", "h": "Pas de service de grands brûlés, et pourtant des grands brûlés pris en charge", "p": "Sans centre de grands brûlés, tout l'hôpital déclenche le plan afflux massif de victimes, accueille en peu de temps des grands brûlés et les transfère, une fois stabilisés, vers les centres médicaux adaptés. Le chef des internes de l'époque, le Dr Chieh-Hung Lin, a analysé cette expérience et l'a publiée dans le Journal of Acute Medicine.", "facts": [["33", "Grands brûlés (article)"], ["Tout l'hôpital", "Mobilisation afflux massif"], ["2019", "Retour d'expérience publié"]]}, {"band": "2021 · Tempête de Wanhua", "tag": "Services méritoires", "h": "Heping ferme ses urgences, Zhongxing en première ligne", "p": "Le site voisin de Heping, touché par des infections nosocomiales, devient un hôpital dédié COVID et ferme ses urgences. Zhongxing transforme les vitres de la pharmacie des urgences en guichets de prélèvement avec boîtes de transfert ; médecins et chirurgiens assurent ensemble les gardes de prélèvement, 200 à 400 par jour, sans interrompre les urgences. Pendant la mise en place des unités dédiées, l'équipe prend en charge les voies aériennes des patients positifs instables : plus de la moitié des intubations de patients positifs de l'hôpital. Les soignants vivent isolés pendant deux mois.", "facts": [["200–400", "Prélèvements par jour"], ["&gt;½", "Des intubations COVID de l'hôpital"], ["2 mois", "Soignants isolés"]]}, {"band": "2022 · « Snow House »", "tag": "Pic national de l'épidémie", "h": "500 patients en quatre heures, sans rompre la capacité des urgences graves", "p": "Au pic de mai 2022, les urgences organisent avec plusieurs services la consultation de délivrance rapide « Snow House » : prélèvements et délivrance rapide de traitements du matin au soir, soit près de 15 000 consultations en avril–mai 2022. Wan Hai Lines a offert un caisson d'isolement à pression négative, M. Fei-Long Chen, président, des modules préfabriqués de prélèvement, et Inventec un conteneur de prélèvement. Le dispositif a fonctionné jusqu'à la dissolution du centre de commandement en mai 2023.", "facts": [["~15,000", "Consultations avril–mai"], ["500", "Patients en 4 h au pic"], ["2023.05", "Mission accomplie"]]}, {"band": "2023 → 2025 · Sauvetage et partenaires pompiers", "tag": "Partenariat interinstitutionnel", "h": "Protocoles d'accord avec les pompiers de Taipei", "p": "Le 7 décembre 2023, l'Hôpital municipal de Taipei et le service d'incendie de Taipei ont signé un protocole d'accord : participation mutuelle aux formations et exercices, missions de sauvetage communes lors des catastrophes majeures dans le pays, prise en charge commune des afflux massifs de victimes à Taipei. Les Drs Ya-Chin Liang et Wei-Lun Chen sont médecins attitrés de l'équipe de recherche et sauvetage de Taipei, et plusieurs seniors sont commandants de catastrophe certifiés par le Département de la santé. Le Dr Ya-Chin Liang assure aussi des formations pour l'équipe de sauvetage, dont un atelier pratique de premiers secours pour chiens de recherche. Lors du séisme de Hualien en 2024, nos médecins se sont mobilisés. En juillet 2025, un second protocole a suivi, consacré aux bilans de santé et au suivi médical des pompiers.", "facts": [["2023.12", "Accord sauvetage"], ["0403", "Mobilisation séisme de Hualien"], ["2025.07", "Santé des pompiers"]]}, {"band": "2020 → 2026 · De l'expérience à la science", "tag": "Interdisciplinarité avec Taipei Tech", "h": "Une équipe de recherche sur les aérosols née de la pandémie", "p": "En 2020, l'équipe des urgences et le département de génie énergétique et de climatisation de l'Université nationale de technologie de Taipei (Taipei Tech) créent une équipe de recherche sur la prévention des aérosols. Avec des mannequins haute fidélité et la vélocimétrie par images de particules, ils quantifient l'exposition des soignants pendant l'oxygénothérapie, la RCP et la thérapie inhalée. Résultats publiés dans Annals of Emergency Medicine, Scientific Reports, Journal of Hospital Infection et Indoor Air.", "facts": [["7", "Articles sur les aérosols"], ["6", "Années de financement municipal"], ["ICEM", "Meilleur poster 2023"]]}], "quote": "« Le multitâche aux urgences, c'est comme prendre soin de plusieurs relations à la fois : saisir le rythme de chacune et accompagner chacun en douceur vers l'étape suivante. »", "quoteSrc": "— adapté du site de recrutement des internes des urgences de Zhongxing"}, "honors": {"eyebrow": "Honors", "h2": "Palmarès : le prochain, c'est vous", "lead": "Nous voulons que vous deveniez meilleurs que nous : c'est tout le sens de l'enseignement.", "items": [{"y": "2023 · AMSTERDAM", "h": "ICEM Campbell MacFarlane Best Poster Award", "p": "Le Dr Chih-Chieh Wu, alors en formation, primé pour ses travaux sur la distance de dispersion et la concentration des aérosols sous oxygénothérapie.", "gold": true}, {"y": "2023 · Société de médecine d'urgence", "h": "Vainqueurs du concours de diagnostic toxicologique en un coup d'œil", "p": "Les internes, menés par le Dr Hsin-Ling Chen, remportent la victoire.", "gold": true}, {"y": "2023 · Ville de Taipei", "h": "Prix des jeunes médecins", "p": "Le Dr Wei-Lun Chen, médecin senior formé aux urgences de Zhongxing, spécialiste de la médecine de catastrophe.", "gold": true}, {"y": "2023 · Congrès international d'éducation médicale de Taipei Veterans General Hospital", "h": "Médaille de bronze au concours de résumés de recherche", "p": "Travaux sur l'éducation médicale par compétences."}, {"y": "2003 · 2015 · 2021", "h": "Trois fois distingués pour services méritoires", "p": "SRAS, explosion de poussière du Formosa Fun Coast, COVID-19. Le Dr Tzu-Yao Hung a reçu la distinction officielle pour services méritoires du ministère de la Santé et des Affaires sociales pour l'explosion du Formosa Fun Coast."}, {"y": "1999", "h": "Distinction pour les secours lors du séisme du 21 septembre", "p": "Participation aux secours dans le centre et le nord, saluée par le gouvernement de la ville de Taipei, le gouvernement du comté de Taichung et l'Ordre des médecins."}, {"y": "Taipei City Hospital", "h": "Médecins d'excellence · enseignants d'excellence", "p": "Bor-Hen Wu (médecin d'excellence 2023), Tzu-Yao Hung (enseignant d'excellence 2016, médecin d'excellence 2020), Hsin-Ling Chen (médecin d'excellence)."}, {"y": "Internes", "h": "Interne d'excellence", "p": "Un interne des urgences de Zhongxing élu interne d'excellence."}, {"y": "2025 · Ville de Taipei", "h": "Exercice de résilience urbaine", "p": "L'équipe de réponse aux catastrophes a participé à l'exercice de résilience urbaine de Taipei ; le commandant médical a présenté le dispositif sur le terrain aux autorités en inspection."}]}, "place": {"eyebrow": "Beimen · Taipei Main Station · Dadaocheng", "h2": "Au cœur du plus ancien et du plus nouveau Taipei", "lead": "À l'est, la gare principale de Taipei et les Taipei Twin Towers qui sortent de terre ; au nord, Dadaocheng et ses maisons de thé et de tissus centenaires. Après la garde, dix minutes à pied suffisent pour retrouver les saveurs d'antan de la rue Dihua.", "mapAria": "Plan des environs du site de Zhongxing : au sud-est, la gare principale de Taipei et les Taipei Twin Towers ; au sud, la porte Nord ; au nord, Dadaocheng et la rue Dihua ; à l'ouest, le fleuve Tamsui", "map": {"river": "Fleuve Tamsui", "rd1": "Av. Zhongxiao Ouest", "rd2": "Rue Yanping Nord", "rd3": "Rue Zhengzhou", "rd4": "Rue Dihua", "ddc": "Dadaocheng", "mrt": "Station Beimen", "gate": "Porte Nord", "tms": "Gare principale de Taipei", "twin": "Taipei Twin Towers", "us": "Urgences du site de Zhongxing"}, "mapNote": "Plan schématique, pas à l'échelle. Adresse : 145, rue Zhengzhou, district de Datong, Taipei.", "list": [{"h": "Gare principale de Taipei · nœud de transport", "p": "TGV, trains régionaux, métro de Taipei et métro de l'aéroport de Taoyuan s'y croisent. Cela signifie des urgences de navetteurs et de voyageurs, et une première ligne en cas d'afflux massif de victimes."}, {"h": "Beimen · porte de l'ouest", "p": "Accessible à pied depuis la station de métro Beimen, ou depuis la sortie Y27 de la galerie souterraine de Taipei. Le quartier de la porte Nord se transforme dans le cadre du projet de la porte ouest de Taipei."}, {"h": "Dadaocheng · rue Dihua", "p": "Port marchand du thé et des produits secs depuis la dynastie Qing, c'est toujours le grand marché du Nouvel An et un haut lieu de la culture des vieilles rues. Aînés, commerçants et touristes du quartier : nous prenons soin de tous."}, {"h": "Wanhua · populations vulnérables", "p": "Fidèle à sa vocation de médecine communautaire auprès des plus fragiles, l'hôpital prend en charge de longue date les personnes sans abri et les personnes âgées isolées autour de la gare principale de Taipei et de Wanhua, et étudie l'équité des soins d'urgence."}], "fut1": {"eyebrow": "En projet · début des travaux 2029 · achèvement 2033", "h3": "Bâtiment intelligent des soins critiques", "svgA": "11 étages", "svgB": "4 niveaux de sous-sol : espace de tri et de réanimation en cas de catastrophe", "svgC": "→ Station de métro Beimen", "spec": [["11F", "Étages"], ["B4", "Sous-sols"], ["150+", "Lits aigus en sous-sol en cas de catastrophe"]], "li": ["Projet de montée en gamme vers le statut d'<b>hôpital de référence d'urgence de niveau le plus élevé</b>", "Urgences, blocs opératoires, réanimation et lits aigus regroupés dans le nouveau bâtiment, avec un système de santé intelligent", "Une première : un système souterrain d'évacuation médicale d'urgence. En cas d'accident sur le TGV, le train, le métro de Taipei ou celui de Taoyuan, les sous-sols deviennent un espace temporaire de tri et de réanimation, relié à la station de métro Beimen et à la galerie souterraine"], "src": "Source : United Daily News (udn.com), août 2026. La commission d'urbanisme de Taipei a approuvé l'assouplissement du coefficient d'emprise au sol le 23 juillet 2026. Calendrier sous réserve de l'approbation des autorités compétentes."}, "fut2": {"eyebrow": "Achèvement au plus tôt en 2027", "h3": "Les Taipei Twin Towers, nos voisines", "spec": [["360 m", "Tour D1 · 70 étages"], ["280 m", "Tour C1 · 53 étages"], ["60,6 milliards NT$", "Investissement total"]], "p": "Le projet de développement conjoint C1/D1 deviendra le deuxième plus haut gratte-ciel de Taïwan et le symbole de la porte ouest de Taipei, avec environ 16 000 emplois attendus. En avril 2026, la charpente métallique de C1 atteignait le 41e étage et D1 le 32e. Plus de monde, plus d'affaires : le rôle des urgences ne fera que grandir.", "src": "Source : Economic Daily News, avril 2026", "smartH": "Des urgences intelligentes", "smartP": "Les urgences de Zhongxing développent avec des partenaires industriels le tri intelligent et la surveillance continue des constantes vitales, pour détecter plus tôt l'aggravation des patients en salle d'attente. (Projet en cours)"}}, "join": {"eyebrow": "Recrutement d'internes en médecine d'urgence", "h2": "Le monde des urgences de Zhongxing regorge de trésors.<br>Votre regard porte-t-il loin ?", "p": "Vous voulez entrer sur le terrain ? Nous serons vos entraîneurs. Venez nous rendre visite, suivre une garde, ou parlez directement avec nos internes.", "btn1": "Site de recrutement d'origine", "btn2": "Revoir le programme de formation", "rows": [["Service enseignement et recherche, site de Zhongxing", "02-2552-3234"], ["Adresse", "145, rue Zhengzhou, district de Datong, Taipei"], ["Accès", "Station de métro Beimen · galerie souterraine de Taipei, sortie Y27"]], "copy": "Copier", "copied": "Copié"}, "gallery": {"eyebrow": "Life at Zhongxing", "h2": "Après la garde, nous sommes aussi une famille", "lead": "Gardes, cours, mais aussi repas et karaoké : nous partageons tout."}, "footer": {"a": "© Taipei City Hospital, site de Zhongxing · Service de médecine d'urgence", "b": "Sources : programme de formation des spécialistes en médecine d'urgence (révision n° 18 du 12/05/2026), PubMed, United Daily News, Economic Daily News. Dernière mise à jour : octobre 2026. Ce site est informatif et ne constitue pas un avis médical ; en cas d'urgence, appelez le 119 ou rendez-vous aux urgences les plus proches."}, "photos": {"air1": "Atelier voies aériennes : démonstration du stylet vidéo par un senior", "air2": "Rotation par stations en petits groupes, avec un moniteur en accompagnement individuel", "air3": "Des soignants étrangers à l'atelier voies aériennes", "air4": "Entraînement à la vidéolaryngoscopie et à la ventilation au masque", "ircad": "Cours de voies aériennes à l'IRCAD", "us1": "Enseignement de l'échographie au lit du patient", "us2": "POCUS en pratique : on scanne et on discute", "us3": "Entraînement à l'échographie cervicale", "tue1": "Photo de groupe à la fin de la journée pédagogique", "tue2": "Discussion de cas en salle d'enseignement", "tue3": "Enseignement en petit groupe : présentation du matériel de voies aériennes", "intl1": "Fin de stage : remise des certificats", "intl2": "Des soignants étrangers s'exercent aux gestes d'urgence", "intl3": "Discussion de cas avec des soignants en visite", "intl4": "Des médecins étrangers à l'atelier voies aériennes", "intl5": "Simulation en salle de déchocage avec des stagiaires internationaux", "intl6": "WAMM 2025, Italie", "intl7": "Présentation d'un poster en congrès international", "dis1": "Exercice de résilience urbaine : briefing du commandant médical sur le terrain", "dis2": "Exercice d'afflux massif de victimes : poste médical avancé", "dis3": "Exercice d'afflux massif de victimes : tri et évacuation", "dis4": "Entraînement avec l'équipe de recherche et sauvetage de Taipei", "dis5": "Échanges avec l'équipe de recherche et sauvetage des pompiers de Taipei", "dis6": "Commandement par radio pendant l'exercice", "dis7": "Exercice d'afflux massif de victimes aux urgences", "conf1": "Congrès d'hiver de la Société de médecine d'urgence et Journée des urgences de Taïwan", "conf2": "Enregistrement d'une émission de la Société de médecine d'urgence", "life1": "Dîner après la garde", "life2": "Soirée du service", "life3": "Karaoké après la garde", "life4": "Célébration au service", "life5": "Seniors et internes", "sim1": "Salle de déchocage et matériel de simulation", "sim2": "Simulation haute fidélité", "vent": "Enseignement de la ventilation mécanique", "sim3": "Entraînement à la RCP en équipe", "sim4": "Ventilation au masque et atelier voies aériennes", "intl8": "Avec les soignants en visite", "intl9": "Soignantes en visite avec notre interne", "life6": "Un moment ensemble après la garde", "chief1": "Validation airway : le chef est le patient, les plus jeunes font des selfies", "chief2": "Le chef réalise sa propre anesthésie topique", "chief3": "Un interne réalise une vidéolaryngoscopie sur le chef éveillé", "chief4": "Validation airway : intuber le chef", "air5": "Enseignement de la vidéo-intubation en salle de déchocage", "mug": "Une tasse imprimée de notre article : Annals of Emergency Medicine 2022", "laser": "Imagerie par nappe laser de la diffusion d'aérosols pendant les gestes sur les voies aériennes", "covid1": "Pendant la pandémie : transfert d’un patient en équipement de protection complet", "covid2": "Pendant la pandémie : chaque prescription vérifiée ensemble", "drill1": "Exercice de nombreuses victimes : urgences et ambulanciers prennent en charge une victime simulée", "drill2": "Victime simulée sous oxygène au masque pendant l'exercice", "drill3": "Maquillage avant l'exercice", "tue4": "Salle d'enseignement : un cas dévoilé étape par étape", "teach1": "Enseignement par un senior au poste de soins", "care1": "Visite à domicile", "care2": "Rencontre soins palliatifs de Zhongxing (2022)", "life7": "Dîner de toute l'équipe", "life8": "Un café avant la garde", "usar1": "Terrain d'entraînement de l'équipe de sauvetage de Taipei", "usar2": "Préparation médicale sous une tente de l'équipe TPE USAR", "usar3": "Rassemblement de l'équipe de recherche et sauvetage de Taipei", "usar4": "Formation de l'équipe de sauvetage : photo de groupe après le cours de premiers secours canins du Dr Ya-Chin Liang", "usar5": "Formation de l'équipe de sauvetage : le Dr Ya-Chin Liang enseigne les premiers secours aux chiens de recherche"}, "rot": {"pre": "Chaque semaine à Zhongxing, vous pratiquez", "words": ["l'intubation difficile", "intuber le chef", "l'échographie au lit du patient", "la réanimation", "le commandement en catastrophe", "l'enseignement en amphi"]}, "app": {"eyebrow": "Innovation pédagogique · JMIR Med Educ 2025", "h2": "Votre progression, visible sur votre téléphone", "lead": "Depuis 2018, les urgences de Zhongxing ont remplacé l'évaluation papier des internes par une application mobile. Pendant la dernière heure de chaque garde, le senior donne un retour sur les jalons et les EPA dans l'application. Vous voyez à tout moment votre courbe de progression et les situations cliniques obligatoires qu'il vous reste à valider. Cette démarche a fait l'objet d'une étude publiée et d'un prix.", "phone": {"t": "Mes jalons", "s": "Illustration", "k1": "Moyenne EPA ce trimestre", "k2": "Situations obligatoires faites", "rows": ["Intubation (dont vidéolaryngoscopie)", "Échographie ciblée", "Direction de l'équipe de réanimation", "Annonce d’une mauvaise nouvelle"]}, "chartT": "Application mobile vs évaluation papier/web", "a": "Application", "b": "Papier / web", "m": ["Se disent « très satisfaits »", "Voient ensemble nombre, courbe et taux de réalisation"], "note": "Données : Chen HL, …, Hung TY. JMIR Med Educ 2025;11:e57216. Enquête auprès de 74 enseignants, internes et responsables de programme des terrains de formation en médecine d’urgence à Taïwan (groupe application 14, groupe papier/web 60).", "pts": ["Moins d'évaluations oubliées (P=.02)", "Tendances de performance plus faciles à voir (P<.001)", "Situations cliniques manquantes plus faciles à repérer (P<.001)", "Pas de temps supplémentaire pour évaluer ou donner un retour"], "awardY": "2023 · Congrès international d’éducation médicale du Taipei Veterans General Hospital", "awardH": "Concours de résumés de recherche, prix de bronze", "awardP": "Étude primée : comparaison application, papier et web pour une formation sur mesure des internes en médecine d’urgence. Lauréats : Tzu-Yao Hung, Hsin-Ling Chen, Chia-Wen Chang, Yi-Ching Chiu.", "read": "Lire l'article"}, "faq": {"eyebrow": "FAQ · pour les futurs internes", "h2": "Les questions que vous vous posez", "items": [{"q": "Quels sont les horaires ?", "a": "16 gardes de 12 heures par mois, environ 192 heures (plafond 200). En mois d'urgences adultes, les nuits sont regroupées sur une semaine fixe, sans alternance jour/nuit. Le mardi est la journée d'enseignement, sans activité de première ligne."}, {"q": "« Intuber le chef », c’est vrai ?", "a": "Oui. Pour la dernière étape, le chef se porte volontaire comme « patient » éveillé : sous anesthésie topique et monitorage complet, l'interne réalise une séquence de voies aériennes vigiles en vidéolaryngoscopie et endoscopie souple, et le chef commente en direct. C'est notre séance la plus populaire, et la plus photographiée."}, {"q": "Serai-je seul en première ligne la première année ?", "a": "Non. En R1–R2, vous voyez les patients sous supervision complète, deux seniors sont présents 24 h/24 et la dernière heure de chaque garde est un retour individuel. Vous avez aussi deux tuteurs, dans et hors du service."}, {"q": "Un hôpital régional offre-t-il assez de soins critiques ?", "a": "Deux mois dans chacune de nos réanimations médicale et chirurgicale, plus 1 à 3 mois dans la zone de soins critiques des urgences de NTUH, la pédiatrie de MacKay, la traumatologie de Linkou Chang Gung et la toxicologie du Taipei Veterans General."}, {"q": "La recherche est-elle obligatoire ? Est-ce stressant ?", "a": "Au moins un poster ou article par an, à partir d'une question clinique, avec un senior à vos côtés. Dès R3, une réunion de recherche tous les deux mois. Nos internes ont remporté le prix du meilleur poster à l'ICEM et publié en premier auteur dans des revues SCI."}, {"q": "Y a-t-il une vie après le travail ?", "a": "Oui. L'enseignement est regroupé le mardi et le planning est prévisible ; 7 à 10 jours de congés annuels selon l'année. L'équipe dîne et chante souvent ensemble — les photos sont plus haut."}, {"q": "Comment postuler ?", "a": "Le nombre de postes et le calendrier suivent les annonces annuelles du ministère de la Santé et de la Société taïwanaise de médecine d'urgence. Vous pouvez d'abord venir visiter ou faire un stage d'observation. Contact : Département d'enseignement et de recherche, site de Zhongxing, 02-2552-3234."}]}, "chief": {"stamp": "VALIDÉ · PAR LE CHEF", "eyebrow": "Intubate the Chief · validation des voies aériennes", "h2": "Votre validation airway ? <em>Intubez le chef.</em>", "lead": "À Zhongxing, la dernière étape de la formation aux voies aériennes n'est pas un mannequin. Le chef s'assoit, réalise lui-même son anesthésie topique et ouvre grand la bouche : l'interne déroule une séquence complète de voies aériennes vigiles sur un « patient » éveillé, qui parle et qui commente en direct. Les plus jeunes prennent des selfies, car ce moment mérite d'être retenu.", "path": [{"b": "Ateliers sur mannequin", "s": "Ventilation au masque, laryngoscopie directe et vidéo, bougie et aspiration SALAD, en petits groupes jusqu'à ce que le geste devienne naturel."}, {"b": "Cadavres et simulation haute fidélité", "s": "Vue de l'épiglotte seule et modèle cadavérique d'angine de Ludwig : le jugement s'entraîne sur les voies aériennes les plus difficiles."}, {"b": "La vraie salle de déchocage", "s": "Sous supervision du senior, au moins 35 intubations réussies avant la R3."}, {"b": "Dernier niveau : le chef en personne", "s": "Anesthésie topique vigile, vidéolaryngoscopie et endoscopie souple. Quand le chef approuve, vous êtes validé."}], "fine": "Le chef se porte volontaire. L'entraînement aux voies aériennes vigiles se fait sous anesthésie topique, avec monitorage complet et matériel de secours prêt."}, "care": {"eyebrow": "Urgences publiques métropolitaines", "h2": "Des urgences de qualité, et un filet de sécurité pour la ville", "lead": "Nous sommes le service d'urgences de l'Hôpital municipal de Taipei, à côté de la gare centrale. Navetteurs, touristes, personnes âgées seules, voisins sans domicile : chacun rencontre les mêmes urgentistes diplômés et reçoit le même niveau de soins.", "tiles": [{"n": "12 / 12", "h": "Tous les seniors sont urgentistes diplômés", "p": "Les 12 médecins seniors à temps plein sont tous spécialistes en médecine d'urgence ; deux seniors sont présents 24 h/24 et l'échographie au lit est toujours disponible."}, {"n": "Sans-abri", "h": "Des patients, pas des problèmes", "p": "Beaucoup de personnes autour de la gare centrale n'ont pas de logement. Avec nos travailleurs sociaux et l'aide médicale du Département des affaires sociales de Taipei, ceux qui ne peuvent pas payer peuvent aller au bout de leurs soins."}, {"n": "Recherche", "h": "Être assuré n'est pas être soigné", "p": "À partir de plusieurs années de données des urgences, nous étudions les départs prématurés et les reconsultations des personnes sans domicile, pour combler les lacunes de la prise en charge (étude en cours)."}, {"n": "Soins aigus à domicile", "h": "L'urgentiste vient chez vous", "p": "Après évaluation, les patients âgés à mobilité réduite peuvent être vus à domicile ou en téléconsultation par des médecins formés à l'urgence et terminer leur traitement aigu chez eux."}, {"n": "Palliatif", "h": "Présents jusqu’au bout", "p": "Tous les seniors sont formés aux soins palliatifs. Nous défendons des soins aigus adaptés aux personnes âgées et la décision partagée avec patients et familles."}, {"n": "Enseignement", "h": "La qualité, ça s'enseigne", "p": "Journée d'enseignement du mardi, retour en temps réel par l'application, supervision au lit du patient : la formation de l'interne aujourd'hui, ce sont les soins du patient demain."}], "note": "L'étude sur les personnes sans domicile n'est pas encore publiée ; les résultats seront partagés après publication évaluée par les pairs."}, "stars": {"eyebrow": "Tableau d’honneur des internes", "h2": "Les internes montent aussi sur scène", "lead": "À Zhongxing, prix, communications orales et recherche originale ne sont pas réservés aux seniors. Tout ce qui suit a été accompli par nos internes pendant leur formation. Le prochain, ce sera peut-être vous.", "awards": [{"y": "2023 · ICEM AMSTERDAM", "who": "Dr Chih-Chieh Wu", "h": "Prix Campbell MacFarlane du meilleur poster", "p": "Récompensé à l'International Conference on Emergency Medicine pour ses travaux sur la distance de dispersion et la concentration des aérosols pendant l'oxygénothérapie."}, {"y": "2023 · VILLE DE TAIPEI", "who": "Dr Wei-Lun Chen", "h": "Prix Jeune Xinglin (青年杏林獎)", "p": "Resté à Zhongxing après sa formation, il est aujourd’hui senior spécialisé en médecine de catastrophe."}, {"y": "INTERNAT", "who": "Dr Chung-Shiung Wen", "h": "Meilleur interne", "p": ""}, {"y": "FORUM DE RECHERCHE DES INTERNES DES NEUF HÔPITAUX", "who": "Dr Sheng-Han Yu", "h": "Communication orale, section chirurgicale : mention honorable", "p": "Distingué pour son étude sur la TSV et la troponine réalisée pendant l'internat (sous la direction du Dr Tzu-Yao Hung), publiée en 2026 dans Emergency Medicine Journal."}], "papersH": "Des recherches originales menées pendant l'internat", "papersP": "L'internat de médecine d'urgence est exigeant, et pourtant, accompagnés par leurs enseignants, ces médecins ont mené à bien des recherches originales pendant leur formation. Quatre d'entre eux sont restés et sont aujourd'hui nos seniors. Voici leurs articles en premier auteur.", "papers": [{"who": "Dr Chih-Chieh Wu", "now": ""}, {"who": "Dr Wei-Lun Chen", "now": "SENIOR AUJOURD’HUI"}, {"who": "Dr Chieh-Hung Lin", "now": "SENIOR AUJOURD’HUI"}, {"who": "Dr Cheng-Wei Tseng", "now": "SENIOR AUJOURD’HUI"}, {"who": "Dr Sheng-Han Yu", "now": "SENIOR AUJOURD’HUI"}], "note": "Prix et articles compilés à partir des archives du service ; les liens renvoient au DOI."}}, "es": {"meta": {"lang": "es", "title": "Urgencias de Zhongxing | Hospital Municipal de Taipéi, sede Zhongxing", "skip": "Ir al contenido principal", "langLabel": "Idioma", "desc": "Servicio de urgencias del Hospital Municipal de Taipéi, sede Zhongxing, junto a la estación central: residencia de medicina de urgencias, vía aérea y POCUS, investigación e intercambio internacional."}, "nav": {"who": "Información para ti", "sig": "Vía aérea · POCUS", "tue": "Martes docente", "train": "Formación y hospitales asociados", "fac": "Profesorado", "res": "Investigación", "intl": "Internacional", "hist": "Un siglo de historia", "crisis": "Desastres y pandemias", "honors": "Reconocimientos", "place": "Estación Principal · Dadaocheng", "join": "Únete", "app": "Innovación docente", "faq": "Preguntas", "care": "Cuidar la ciudad", "stars": "Logros de residentes"}, "hero": {"eyebrow": "Hospital de la Ciudad de Taipéi, sede Zhongxing · Servicio de Urgencias", "h1": "Arraigados en el casco antiguo de Taipéi,<br><em>preparados para cada urgencia</em>.", "sub": "Desde el cruce de caminos de la Estación Principal de Taipéi hasta las casas centenarias de Dadaocheng. Urgencias de Zhongxing reúne en un mismo equipo la atención rápida de la patología aguda, la vía aérea difícil, la ecografía a pie de cama, la docencia clínica y la respuesta ante desastres. Los 12 médicos adjuntos son especialistas certificados en medicina de urgencias, todos a tiempo completo.", "btn1": "Así formamos", "btn2": "Vengo como paciente", "mission": "Nuestra misión: ofrecer una atención de urgencias oportuna, segura y humana, mientras seguimos mejorando las técnicas, la evidencia y los sistemas que nuestra comunidad necesita.", "pillars": [{"t": "Proteger a la comunidad", "d": "La primera línea de defensa para la Estación Principal de Taipéi, Beimen, Dadaocheng y Wanhua."}, {"t": "Oficio en vía aérea y ecografía", "d": "Enseñamos lo que investigamos: nuestros artículos son el programa docente."}, {"t": "Preparados para lo imprevisto", "d": "SARS, la explosión de polvo del Formosa Fun Coast, el brote de COVID-19 en Wanhua: siempre estuvimos allí."}]}, "mon": {"aria": "Datos del servicio en estilo monitor: unas 30.000 visitas a urgencias al año, 12 médicos adjuntos a tiempo completo, 4 centros médicos asociados, 42–48 meses de residencia", "k1": "ED VISITS / YR", "u1": "Promedio anual de visitas a urgencias, 2023–2025", "k2": "ATTENDINGS", "u2": "Todos especialistas en urgencias a tiempo completo", "k3": "PARTNER CENTERS", "u3": "Centros médicos asociados para la formación", "k4": "TRAINING", "v4": "42–48", "u4": "meses · residencia de urgencias"}, "logoAlt": "Logotipo de Urgencias de Zhongxing: a la izquierda, el perfil urbano de Taipéi; a la derecha, las casas de Dadaocheng; en el centro, unos pulmones, una sonda de ecografía y un electrocardiograma", "who": {"eyebrow": "Elige tu perfil", "h2": "¿Quién eres?", "tabs": ["Pacientes", "Futuros residentes de urgencias", "Estudiantes de medicina · UGY · PGY", "Técnicos de emergencias · EMT"], "panels": [[{"n": "24 h", "h": "Urgencias abiertas todo el año", "p": "Atención de urgencias las 24 horas desde 1976. Áreas separadas de medicina interna, cirugía y pediatría, con consultas infantiles y de adultos independientes. Ginecología cuenta con una sala propia y acogedora (la «sala cálida») que protege su privacidad."}, {"n": "12", "h": "En cada turno, un especialista en urgencias", "p": "Los 12 médicos adjuntos a tiempo completo son especialistas certificados en medicina de urgencias, con dos líneas de adjuntos presentes las 24 horas. Tres ecógrafos a pie de cama permiten una exploración focalizada inmediata."}, {"n": "MRT Beimen", "h": "Junto a la Estación Principal de Taipéi", "p": "Calle Zhengzhou n.º 145, distrito de Datong, Taipéi. Se llega a pie desde la estación de metro Beimen o desde la salida Y27 de Taipei City Mall (galería subterránea)."}, {"n": "Hospitalización a domicilio", "h": "Atención aguda en casa tras el alta", "p": "Si usted tiene movilidad reducida o dificultad para acudir al hospital, y tras la valoración médica, un médico con experiencia en urgencias puede visitarle en casa o a distancia para tratar en su domicilio neumonías, infecciones urinarias, infecciones de partes blandas y otros procesos agudos."}, {"n": "Paliativos · Geriatría", "h": "Atención a personas mayores y pacientes al final de la vida", "p": "Todos los médicos adjuntos están acreditados en cuidados paliativos. Promovemos la atención aguda adaptada a la persona mayor (ACE) y la toma de decisiones compartida, y colaboramos con Medicina Integrada para enlazar urgencias con hospitalización, domicilio y cuidados de larga duración."}, {"n": "Circuito de aislamiento", "h": "Triaje de enfermedades infecciosas para su tranquilidad", "p": "Consultas de aislamiento con entrada independiente y climatización aislada. Desde el triaje se separa a los pacientes con fiebre o sospecha de enfermedad infecciosa. La sala de observación de urgencias tiene 18 camas, todas con cortina."}], [{"n": "16 turnos / mes", "h": "Horario previsible", "p": "Turnos de 12 horas, unas 192 horas al mes (máximo 200). Cuando rotas en urgencias de adultos, las noches se agrupan en una semana fija: nada de turnos «salteados» que alternan día y noche."}, {"n": "R1–R2", "h": "Supervisión de adjuntos en todo momento", "p": "En primer y segundo año atiendes bajo la supervisión de un adjunto docente. En la última hora de cada turno, tu adjunto elige un caso y te da retroalimentación inmediata. Dos líneas de adjuntos las 24 horas."}, {"n": "Cada martes", "h": "Día docente, sin primera línea", "p": "Ese día no cubres la primera línea asistencial: pasas la jornada con un adjunto en el programa troncal, el club de lectura (Tintinalli, 9.ª edición), sesiones bibliográficas y discusión de casos."}, {"n": "Evaluación en app", "h": "Basada en competencias (CBME)", "p": "Todas las evaluaciones de hitos y EPA se hacen en la app de residentes; los resultados se publicaron en JMIR Medical Education (2025). Puedes ver tu curva de progreso en cualquier momento."}, {"n": "Doble tutor", "h": "Alguien te respalda", "p": "Un tutor dentro y otro fuera del servicio, reunión mensual de tutoría, encuentro trimestral con la dirección del hospital y apoyo de psicólogos del hospital para valorar tu nivel de estrés."}, {"n": "Publica desde el primer año", "h": "Investiga a partir de preguntas clínicas", "p": "Al menos un póster en congreso o un artículo al año. La investigación sobre aerosoles de nuestros residentes ganó el premio al mejor póster del ICEM en 2023."}], [{"n": "PGY", "h": "Hospital asociado para la formación PGY en urgencias", "p": "La sede Zhongxing es hospital asociado del programa de formación médica general posgrado de dos años (PGY). En urgencias, los cursos de ecografía POCUS y vía aérea empiezan ya en el PGY."}, {"n": "R3 como monitor", "h": "Aprende de los residentes mayores", "p": "Desde tercer año, los residentes son monitores en los cursos de vía aérea y ecografía del PGY y, poco a poco, pasan a impartir clases. Enseñar para aprender es parte de nuestra cultura."}, {"n": "CrazyatLAB", "h": "Todos los dispositivos de intubación a tu alcance", "p": "Videolaringoscopios, Pentax AWS, estilete de intubación con vídeo, fibroscopio, videolaringoscopio de hoja hiperangulada, además de un maniquí transparente de intubación y un maniquí neonatal."}, {"n": "Estancias cortas", "h": "UGY, estudiantes en prácticas e internos: a tu medida", "p": "Los estudiantes UGY, en prácticas e internos pueden organizar una rotación por urgencias de la duración que necesiten. Unas urgencias de hospital regional junto a la Estación Principal de Taipéi, con pacientes muy diversos: personas mayores, personas sin hogar, turistas y viajeros diarios, además de simulacros de incidentes con múltiples víctimas. Un aprendizaje que no está en los libros."}, {"n": "Internacional", "h": "Presenta en el extranjero con tus profesores", "p": "En los últimos años hemos presentado en ICEM (Ámsterdam), EUSEM (Barcelona), AMEE (Suiza) y WAMM (Italia)."}, {"n": "Contacto", "h": "¿Quieres visitarnos?", "p": "Contacta con el Departamento de Docencia e Investigación de la sede Zhongxing (02-2552-3234) o consulta «Únete» más abajo."}], [{"n": "Transferencia", "h": "Dicha con claridad, escuchada con atención", "p": "Una transferencia clara es nuestra filosofía de mando. Los minutos en que llega la ambulancia marcan todo lo que viene después para el paciente."}, {"n": "Simulacros", "h": "Simulacros de múltiples víctimas, codo con codo", "p": "En los ejercicios de resiliencia urbana y de múltiples víctimas, urgencias, técnicos de emergencias y bomberos practican juntos, del triaje en el terreno al traslado dentro del hospital."}, {"n": "USAR", "h": "Socios del rescate de Taipéi", "p": "En diciembre de 2023, el Hospital Municipal de Taipéi y los Bomberos de Taipéi firmaron un memorando de entendimiento para entrenar juntos regularmente; los Dres. Ya-Chin Liang y Wei-Lun Chen son médicos colaboradores del equipo de búsqueda y rescate. En el terremoto de Hualien de 2024, nuestros médicos se movilizaron."}, {"n": "DMAT", "h": "Equipo médico de desastres", "p": "Varios adjuntos son comandantes de desastres certificados por el Departamento de Salud. Entrenamos juntos y salimos juntos."}, {"n": "Vía aérea", "h": "La respiración que más importa", "p": "Nuestros talleres de vía aérea empiezan por la ventilación con mascarilla y la aspiración SALAD, las habilidades que más importan en la calle."}, {"n": "Contacto", "h": "¿Quieres entrenar con nosotros?", "p": "Para colaboraciones y visitas, contacta con el Departamento de Docencia e Investigación de la sede Zhongxing (02-2552-3234)."}]]}, "sig": {"eyebrow": "Signature training · nuestros artículos muestran nuestras fortalezas", "h2": "Dos señas de identidad: vía aérea y POCUS", "lead": "Enseñamos lo que investigamos. La vía aérea difícil y la ecografía a pie de cama son los dos campos con más publicaciones de Urgencias de Zhongxing, las clases más divertidas y donde nuestros residentes se forman con más solidez.", "evk": "EVIDENCE · nuestros propios artículos", "air": {"eyebrow": "Airway · CrazyatLAB", "h3": "Cuando no ves la glotis, sabes cuál es el siguiente paso.", "p": "El jefe de servicio, Tzu-Yao Hung, es instructor experto de CrazyatLAB y su tesis doctoral trató sobre «estrategias de intubación difícil cuando solo se ve la epiglotis». En los estudios del servicio con cadáveres y maniquíes, los participantes son precisamente médicos PGY con 2–5 meses en urgencias, y los resultados revierten directamente en tu formación.", "steps": [{"b": "STEP 1", "s": "Ventilación con mascarilla, laringoscopia directa con bougie y limpieza de la vía aérea con aspiración SALAD"}, {"b": "STEP 2", "s": "Toda la gama de videolaringoscopia: hoja hiperangulada, estilete de intubación con vídeo y fibroscopio"}, {"b": "STEP 3", "s": "Método de enseñanza en cuatro pasos de Peyton para el estilete de intubación con vídeo (AMEE 2024)"}, {"b": "STEP 4", "s": "Cricotiroidotomía (FONA) y algoritmo de rescate; 35 intubaciones exitosas antes de terminar R3"}], "li": ["Talleres en grupos pequeños: dos estaciones con maniquí en rotación y, si te atascas, un monitor te guía uno a uno en un maniquí aparte", "Simulacro anual de vía aérea TRM, con participación del equipo de enfermería", "Durante la pandemia creamos la técnica de intubación segura SHE bougie, publicada en Emerg Med J"], "ev": ["Modelo cadavérico con solo la epiglotis visible: el estilete de intubación con vídeo logró la mejor tasa de éxito al primer intento (Sci Rep 2025)", "Ensayo aleatorizado en cadáveres que simula una angina de Ludwig (Am J Emerg Med 2024)", "Intubación del paciente sentado: desde atrás a la derecha vs cara a cara (West J Emerg Med 2025)"]}, "us": {"eyebrow": "POCUS · ecografía a pie de cama", "h3": "Cambia el fonendoscopio por la sonda, desde el PGY.", "p": "Tres instructores certificados por el comité de ecografía de urgencias y el Dr. Che-Chang Hsu, que escribe sobre anatomía ecográfica. Empiezas en el PGY y, al llegar a R3, realizas ecografías focalizadas de forma independiente y redactas informes formales bajo supervisión de un adjunto.", "steps": [{"b": "Equipos", "s": "Doppler color de gama alta con contraste (CEUS), Philips Sparq y ecógrafo de bolsillo"}, {"b": "Cursos", "s": "Dolor abdominal («sangre, líquido, vesícula, riñón»), dolor lumbar, TVP, RUSH, válvulas cardíacas"}, {"b": "Gamificación", "s": "Enseñanza gamificada de POCUS y concursos de diagnóstico de un vistazo del Dr. Bor-Hen Wu"}, {"b": "Objetivo", "s": "150 estudios y 11 categorías de casos obligatorios antes de terminar R3"}], "li": ["En R3, un mes de formación en la unidad de ecografía; opcionalmente, 1–3 meses de ecografía de urgencias en Shin Kong", "Bloqueos nerviosos ecoguiados para analgesia, accesos venosos centrales y punciones", "Desde R3, monitor en los cursos de ecografía del PGY"], "ev": ["Disco spotlight sign: neumomediastino por ecografía (Am J Emerg Med 2017)", "Diagnóstico ecográfico a pie de cama de la epiglotitis aguda (Am J Emerg Med 2011)"]}, "ws": [{"n": "Taller de REBOA", "p": "Práctica de oclusión aórtica con balón endovascular, dirigida por el Dr. Wei-Lun Chen, experto en medicina de desastres."}, {"n": "Taller de parto en urgencias", "p": "Escenario: una gestante llega en taxi a la puerta de urgencias con la cabeza fetal ya visible. Practicamos paso a paso hasta la expulsión de la placenta."}, {"n": "Examen oral simulado de toxicología", "p": "Intoxicación por plaguicidas, nuevas drogas, desastres químicos; practica tu respuesta con el formato del examen oral de especialidad."}, {"n": "Entrenamiento sorpresa de serpientes venenosas", "p": "Identificación y manejo de las seis principales serpientes venenosas de Taiwán, desde el lugar del incidente hasta el antiveneno."}]}, "tue": {"eyebrow": "Tuesday Teaching Day · 09:00–15:00", "h2": "Cada martes es tu día docente", "lead": "Concentramos la docencia en los martes: ese día no cubres la primera línea asistencial y pasas la jornada en clase con los adjuntos. Los adjuntos se turnan y cada uno trae el campo que mejor domina.", "days": [{"d": "MON", "s": "Clínica"}, {"d": "TUE", "s": "Día docente"}, {"d": "WED", "s": "Sesión general del hospital"}, {"d": "THU", "s": "Clínica"}, {"d": "FRI", "s": "Sesión mensual con Cirugía"}, {"d": "SAT", "s": "Sesión mensual con Radiología"}, {"d": "SUN", "s": "Clínica"}], "src": "Fuente: programas de los días docentes y materiales docentes de Urgencias de Zhongxing, 2023–2025.", "menuH": "Cada martes, siempre en el menú", "menu": ["Temario troncal (Tintinalli, 9.ª ed.)", "Club de lectura y sesión bibliográfica", "Discusión de casos (CbD)", "Revisión de reconsultas a 72 horas", "Redacción de historias clínicas", "Ética y derecho", "Simulación y talleres"], "modH": "Campos que los adjuntos dirigen por turnos", "modules": [{"f": "Cuidados críticos", "p": "Valoración y manejo del paciente crítico en urgencias, en conexión con la UCI."}, {"f": "Vía aérea · investigación", "p": "Talleres de vía aérea difícil y reuniones de seguimiento de los proyectos de investigación de los residentes."}, {"f": "Ecografía POCUS", "p": "Del dolor abdominal y lumbar a la TVP y el protocolo RUSH: un temario completo de ecografía a pie de cama."}, {"f": "Trauma", "p": "Temario ATLS y manejo del paciente traumatizado."}, {"f": "ECG · club de lectura", "p": "Interpretación del ECG y lectura del manual."}, {"f": "Urgencias pediátricas · medicina deportiva", "p": "Urgencias pediátricas graves, fluidoterapia y shock en niños, y simulacros de examen oral de pediatría."}, {"f": "Ginecología y obstetricia de urgencias", "p": "Urgencias ginecológicas y obstétricas frecuentes, del sangrado en el embarazo al parto precipitado."}, {"f": "Prehospitalaria · desastres", "p": "Atención prehospitalaria y regulación médica, DMAT y talleres de simulación como el REBOA."}, {"f": "Vía aérea · toxicología", "p": "Manejo de la vía aérea y toxicología."}]}, "train": {"eyebrow": "Residencia de medicina de urgencias · 42–48 meses", "h2": "Lo que distingue nuestra residencia", "lead": "Aquí la residencia de medicina de urgencias dura de 42 a 48 meses. Con la patología aguda y grave de la comunidad como eje, formamos médicos de urgencias capaces de afrontar desastres, que conocen los cuidados paliativos, investigan y saben enseñar.", "feat": [{"h": "Vía aérea difícil", "p": "El jefe de servicio es instructor experto de CrazyatLAB, y el servicio dispone de Trachway, Pentax AWS, fibroscopio y videolaringoscopios hiperangulados y con canal. Antes de terminar R3 sumarás al menos 35 intubaciones exitosas y sabrás realizar una cricotiroidotomía."}, {"h": "POCUS y ecografía con contraste", "p": "Doppler color de gama alta con contraste (CEUS), Philips Sparq y ecógrafo de bolsillo; tres instructores certificados por el comité de ecografía de urgencias. Antes de terminar R3 completarás al menos 150 ecografías focalizadas."}, {"h": "Toxicología y medicina ambiental", "p": "Programa de toxicología con 15 temas: plaguicidas, metales pesados, nuevas drogas, mordeduras de serpiente y fauna marina. Un mes de rotación externa en Toxicología Clínica de Taipei Veterans General Hospital. Nuestros residentes ganaron el concurso de diagnóstico toxicológico de un vistazo de la sociedad de medicina de urgencias."}, {"h": "Medicina de desastres y EMS", "p": "Centro de operaciones de emergencia del hospital y DMAT, prácticas en el centro de coordinación de emergencias y con el equipo de soporte vital avanzado, cursos de respuesta ante emergencias nucleares y heridas de guerra. Imparten clases médicos colaboradores del equipo de búsqueda y rescate de Taipéi y comandantes de desastres."}, {"h": "Paliativos y geriatría", "p": "Todos los médicos adjuntos están acreditados en cuidados paliativos; antes de la promoción participarás en un teatro breve sobre cuidados paliativos. Aprenderás a comunicar malas noticias, a conversar sobre órdenes de no reanimar (DNR) y a identificar a pacientes al final de la vida."}, {"h": "Gamificación y simulación", "p": "Ecografía gamificada, taller de REBOA, entrenamiento sorpresa de serpientes venenosas, simulación de parto y reanimación neonatal; el simulacro anual de vía aérea TRM incluye al equipo de enfermería."}], "planner": {"eyebrow": "Rotation planner", "h3": "¿Dónde te formarás cada año?", "legend": ["Urgencias de Zhongxing", "Otros servicios del hospital / otras sedes del TCH", "Rotaciones externas en hospitales asociados", "Investigación"], "month": "mes", "monthsTitle": "meses", "note": "Según el programa de formación de 2026; el calendario real lo propone el residente y se ajusta tras la aprobación del director del programa y el jefe de servicio.", "years": {"R1": {"goal": "Objetivo: reconocer constantes vitales anormales, hacer una anamnesis y exploración física completas, e interpretar ecografía y ECG básicos; obtener la certificación ACLS vigente. Tras superar la evaluación de 360 grados (EPA ≥ 3), podrás atender a pacientes de triaje nivel 1.", "items": [["Urgencias de adultos", "Urgencias de Zhongxing"], ["Pediatría", "TCH, sede Mujer e Infancia, o MacKay"], ["Medicina interna", "Planta de medicina interna general"], ["Cirugía", "Cirugía general e interconsultas"], ["Obstetricia y ginecología", "Planta y urgencias de obstetricia y ginecología"], ["Otorrinolaringología", "Consultas externas e interconsultas"], ["Oftalmología", "Consultas externas e interconsultas"]]}, "R2": {"goal": "Objetivo: atender a varios pacientes a la vez y priorizar según gravedad; certificarte en técnicas intermedias como intubación, tubo torácico y catéter venoso central; obtener ETTC, ATLS o APLS.", "items": [["Urgencias de adultos", "Urgencias de Zhongxing"], ["UCI médica", "Medicina intensiva"], ["Pediatría", "TCH, sede Mujer e Infancia, o MacKay"], ["Neurología", "Planta y ecografía cervical"], ["Cirugía", "Cirugía y trauma"], ["Medicina de desastres", "Centro de operaciones de emergencia y DMAT"], ["Diagnóstico por imagen", "Radiodiagnóstico"], ["Optativa", "Urgencias/Trauma en Linkou Chang Gung Memorial Hospital, ecografía en Shin Kong"]]}, "R3": {"goal": "Objetivo: liderar las urgencias en horas punta y formarte en gestión como jefe de residentes; 150 ecografías focalizadas, 35 intubaciones y cricotiroidotomía; obtener AILS; empezar como monitor de cursos del PGY y diseñar tu investigación.", "items": [["Urgencias de adultos", "Urgencias de Zhongxing"], ["UCI quirúrgica", "Medicina intensiva"], ["Urgencias pediátricas", "TCH, sede Mujer e Infancia, o MacKay"], ["Psiquiatría", "TCH, sede Songde"], ["Sistema de emergencias médicas", "Centro de coordinación + equipo de soporte vital avanzado"], ["Ecografía", "Unidad de ecografía"], ["Toxicología", "Toxicología Clínica, Taipei Veterans General Hospital"], ["Optativa · zona remota", "Hospital de Kinmen (Ministerio de Salud), NTUH, sede del Parque Biomédico de Hsinchu, u otros"]]}, "R3.5": {"goal": "Objetivo: desarrollar una subespecialidad, completar tu publicación y la formación en desastres y desastres químicos, participar en la formación de instructores ACLS y de médicos directores de EMS, y aprobar el examen de especialista certificado en medicina de urgencias.", "items": [["Urgencias de adultos", "Urgencias de Zhongxing"], ["Urgencias pediátricas", "Planta de pediatría y urgencias"], ["Optativa", "Linkou Chang Gung, Shin Kong, MacKay o nuestro servicio"], ["Investigación", "Elección de tema y director"]]}}}, "flag": [{"k": "FLAGSHIP · PEDIATRICS", "h": "MacKay Memorial Hospital · Pediatría y urgencias pediátricas", "mo": "Hasta 4 meses", "p": "La formación en pediatría y urgencias pediátricas se realiza en la sede Mujer e Infancia del TCH o en Pediatría de MacKay, con un total de cuatro meses. MacKay es hospital formador en medicina de urgencias y hospital base de nuestro programa de derivaciones; además puedes elegir 1–3 meses de urgencias y medicina intensiva."}, {"k": "FLAGSHIP · CRITICAL CARE", "h": "National Taiwan University Hospital (NTUH) · Área de críticos de urgencias", "mo": "1–3 meses", "p": "Atenderás a los pacientes más graves en el área de críticos de urgencias de un centro médico, y completarás así casos menos frecuentes en un hospital regional. Junto con 2 meses en la UCI médica y 2 en la UCI quirúrgica de nuestro hospital, la formación en críticos puede llegar a 7 meses."}, {"k": "TRAUMA", "h": "Linkou Chang Gung Memorial Hospital · Urgencias · Trauma", "mo": "1 mes cada uno", "p": "Durante las rotaciones optativas, al menos un mes en Urgencias y otro en urgencias de Trauma de Linkou Chang Gung, para aprender el trabajo del equipo de trauma grave y el protocolo de transfusión masiva."}, {"k": "TOXICOLOGY", "h": "Taipei Veterans General Hospital · Toxicología Clínica", "mo": "1 mes", "p": "En un centro médico acreditado para la formación especializada en toxicología clínica, atenderás interconsultas por todo tipo de intoxicaciones y consultas toxicológicas."}], "partners": [{"k": "PEDIATRICS", "b": "TCH, sede Mujer e Infancia", "s": "Pediatría y obstetricia-ginecología"}, {"k": "ULTRASOUND", "b": "Shin Kong Wu Ho-Su Memorial Hospital", "s": "Ecografía de urgencias, 1–3 meses"}, {"k": "REMOTE AREA", "b": "Hospital de Kinmen (Ministerio de Salud) · NTUH, sede del Parque Biomédico de Hsinchu", "s": "Urgencias y críticos en zona remota, 1 mes"}, {"k": "PSYCHIATRY", "b": "TCH, sede Songde", "s": "Planta y consultas de psiquiatría, 1 mes"}], "weekH": "Ritmo académico fijo, además de los martes", "weekCols": ["Cuándo", "Actividad", "Contenido"], "week": [["Última hora de cada turno", "Retroalimentación clínica", "Tu adjunto elige un caso para comentar y registra al momento la evaluación de hitos en la app"], ["Mensual", "Club de lectura", "Tintinalli's Emergency Medicine, 9.ª edición; los residentes nuevos tienen además un club de lectura de Minor emergency"], ["Segundo viernes de cada mes", "Sesión conjunta Urgencias-Cirugía", "Presentación de casos, activación del equipo de trauma e indicadores de calidad en trauma"], ["Un sábado al mes", "Sesión conjunta Urgencias-Radiología", "Interpretación de imágenes junto a los radiólogos"], ["Bimestral", "Sesión conjunta con Medicina Integrada", "Transición desde urgencias a hospitalización, domicilio y cuidados de larga duración"], ["Cada dos meses desde R3", "Reunión de investigación", "Diseño de estudios a partir de preguntas clínicas, IRB y envío a revistas"]]}, "fac": {"eyebrow": "Todos especialistas en urgencias · todos a tiempo completo", "h2": "Nuestro profesorado", "lead": "Todos nuestros adjuntos son especialistas en medicina de urgencias y trabajan a tiempo completo. Un equipo joven, positivo y con energía, que nunca deja solos a sus residentes. Los profesores con la etiqueta «Formado aquí · hoy adjunto» hicieron la residencia en Zhongxing y se quedaron. Pulsa «Ver historia» para conocer la trayectoria de cada profesor.", "culture": [{"b": "100 %", "h": "Todos especialistas en urgencias a tiempo completo", "p": "Cada profesor que te forma es especialista en medicina de urgencias; no hay médicos a tiempo parcial."}, {"b": "Jóvenes", "h": "Un equipo de adjuntos joven", "p": "Muchos de nuestros adjuntos están empezando su carrera: no te llevan muchos años, recuerdan lo que es ser residente y te acompañarán en los momentos duros."}, {"b": "4", "h": "Adjuntos formados en Zhongxing", "p": "Los Dres. Chieh-Hung Lin, Wei-Lun Chen, Cheng-Wei Tseng y Sheng-Han Yu terminaron aquí su residencia y se quedaron. La mejor recomendación: los residentes mayores se quedan como profesores."}, {"b": "2", "h": "Dos líneas de adjuntos las 24 horas", "p": "En R1–R2 siempre tienes un adjunto supervisando y retroalimentación individual en la última hora de cada turno. Aquí no existe el «arréglatelas tú primero»."}], "all": "Todos", "story": "Ver historia", "doctor": "Dr./Dra.", "tags": {"airway": "Vía aérea", "us": "Ecografía", "icu": "Cuidados críticos", "trauma": "Trauma", "peds": "Pediatría", "obgyn": "Ginecología y obstetricia", "sport": "Medicina deportiva", "ecg": "ECG", "tox": "Toxicología", "pre": "Prehospitalaria", "dis": "Desastres", "hah": "Hospitalización a domicilio", "res": "Investigación", "home": "Formado en Zhongxing"}, "people": [{"r": "Jefe de servicio · Secretario médico · Docencia en vía aérea", "li": ["Doctor en Biotecnología por la Universidad Nacional Yang Ming Chiao Tung (NYCU); profesor ayudante de su Facultad de Medicina", "Instructor experto de CrazyatLAB; instructor de vía aérea en IRCAD", "Instructor ACLS/APLS; instructor certificado por el comité de ecografía de urgencias", "Presentador del pódcast «¿Ya aprendiste medicina de urgencias?»"], "s": "Licenciado en Medicina por la Universidad Yang Ming; durante su servicio civil sustitutorio fue destinado a Santo Tomé y Príncipe, en África Occidental. Tras formarse en urgencias en Shin Kong, trabaja en Urgencias de Zhongxing desde 2002. Con el seudónimo «Daoren», es autor de «Cuentos negros de la sala de urgencias», «¡Un minuto que salva vidas! Manual de primeros auxilios en casa», «¡24 horas que salvan vidas! Manual de primeros auxilios en traumatismos», «Guía de salud del médico mochilero», «Diario de un joven médico en la isla negra de África Occidental» y «La aventura mágica de cuatro médicos en Sudamérica». Durante la pandemia elaboró el protocolo de intubación y, a partir de ahí, creó con Taipei Tech un equipo interdisciplinar de investigación sobre aerosoles. Recibió el reconocimiento oficial por servicios meritorios del Ministerio de Salud y Bienestar por la explosión de polvo del Formosa Fun Coast, el premio a profesor destacado en 2016 y a médico destacado en 2020.", "q": "Un jefe de servicio obsesionado con la docencia de la vía aérea, y un autor que firma con el seudónimo «Daoren».", "tp": ["Talleres de vía aérea difícil", "Vía aérea con paciente despierto («intubar al jefe»)", "Investigación sobre aerosoles", "Reuniones de seguimiento de investigación"], "od": "Médico mochilero que hizo su servicio civil en Santo Tomé y Príncipe, en África occidental; escribe libros de divulgación y presenta un pódcast."}, {"r": "Directora del programa de residencia · cuidados críticos (manejo de nivel UCI)", "li": ["Máster por el Instituto de Salud Ambiental y Ocupacional de la Universidad Nacional Yang Ming Chiao Tung (NYCU)", "2023: DTMH en la Liverpool School of Tropical Medicine, Reino Unido", "Instructora ACLS; miembro del comité de educación médica del hospital", "Médica destacada del Hospital de la Ciudad de Taipéi"], "s": "Formada en urgencias en Shin Kong, se especializa en toxicología y medicina ambiental. Llevó a nuestros residentes a ganar en 2023 el concurso de diagnóstico toxicológico de un vistazo de la sociedad de medicina de urgencias. Con el sueño de trabajar en Médicos Sin Fronteras, de septiembre a diciembre de 2023 completó en Liverpool su formación en medicina tropical. Madre de tres hijos y guía turística de Dadaocheng, comparte la belleza del barrio con visitantes extranjeros. Su investigación sobre evaluación CBME móvil se publicó en JMIR Medical Education.", "q": "Madre de tres hijos y directora del programa que llevó a los residentes a ganar el campeonato de diagnóstico toxicológico.", "tp": ["Cuidados críticos", "Toxicología e intoxicación por pesticidas", "Nuevas drogas de abuso", "Medicina tropical de urgencias", "Taller de parto de urgencia", "Comunicar malas noticias y ética médica"], "od": "Guía oficial de Dadaocheng, enseña el barrio a visitantes extranjeros; con el sueño de Médicos Sin Fronteras, estudió medicina tropical en Liverpool."}, {"r": "Subjefe de servicio · Director de docencia en POCUS", "li": ["Instructor certificado por el comité de ecografía de urgencias", "Instructor ACLS", "Cursando un máster en la National Taiwan University", "Certificación profesional en entrenamiento físico", "Médico de la delegación de Taipéi Chino en los Deaflympics 2022 (Brasil)"], "s": "Al final de su formación en urgencias en Shin Kong hizo un fellowship de investigación en ecografía. Participó en un emprendimiento de dispositivos médicos y en Zhongxing impulsó que la POCUS se enseñe desde el PGY, con excelentes valoraciones de los alumnos. En 2022 fue médico del equipo de Taiwán en los Juegos Sordolímpicos de Brasil.", "q": "El subjefe que hace arraigar la POCUS desde el PGY hasta el examen de especialidad.", "tp": ["RUSH", "Trombosis venosa profunda", "Dolor lumbar agudo", "Vesícula y colédoco", "Ecografía en la disnea", "Ecografía ocular y testicular", "Punción lumbar ecoguiada"], "od": "Entrenador físico certificado y exemprendedor en dispositivos médicos; en plena pandemia viajó a Brasil como médico de equipo en los Deaflympics."}, {"r": "Docencia de ecografía · docencia gamificada", "li": ["Instructor ACLS/APLS", "Instructor certificado por el comité de ecografía de urgencias", "Médico destacado del Hospital de la Ciudad de Taipéi, 2023", "Fellow de ecografía de urgencias, Hospital Shin Kong"], "s": "Primer fellow del programa de ecografía de urgencias de Shin Kong, dirige la formación en ecografía de los residentes de Zhongxing. Amante de la docencia gamificada, allí donde está hay risas, y convierte la ecografía a pie de cama en un juego. Le encanta viajar.", "q": "Donde está él, hay risas: convierte la docencia de ecografía en un juego.", "tp": ["Ecografía pulmonar", "POCUS en la RCP", "Ecografía aórtica", "Respuesta a fluidos", "Válvulas cardiacas", "Razonamiento diagnóstico y sesgos cognitivos"], "od": "Le encanta viajar y juega a Magic: The Gathering."}, {"r": "Docencia de POCUS a pie de cama · anatomía ecográfica", "li": ["Fellow de investigación en ecografía de urgencias, Shin Kong", "Autor de la columna de anatomía ecográfica de POCUS Academy"], "s": "Licenciado en Medicina por la Universidad Médica Chung Shan, se formó en urgencias en Shin Kong, donde completó el fellowship de investigación en ecografía. En Zhongxing enseña anatomía ecográfica: construir mentalmente estructuras 3D a partir de imágenes 2D y encontrar la patología como en un juego de POCUS. Le gustan la fotografía y los gatos.", "q": "Un artesano de la anatomía ecográfica que construye la 3D en su cabeza a partir de imágenes 2D.", "tp": ["Anatomía ecográfica", "POCUS Game", "Conversaciones al final de la vida y ética en urgencias"], "od": "Fotografía y gatos: cuenta su día a día en imágenes."}, {"r": "Director de formación en trauma", "li": ["Instructor AHA ACLS", "Acreditado como comandante de desastres por el Departamento de Salud de la Ciudad de Taipéi"], "s": "Tras completar su formación en urgencias en MacKay, se incorporó a Zhongxing, donde se encarga de la formación en trauma. La noche de la explosión de polvo del Formosa Fun Coast estaba de guardia en MacKay Tamsui y vivió en primera persona la activación y la respuesta ante múltiples víctimas.", "q": "La noche de la explosión de polvo de Formosa Fun Coast, era el médico de guardia de urgencias en MacKay Tamsui.", "tp": ["ATLS", "Trauma abdominal", "Simulacros de examen oral de trauma grave", "Luxación pélvica y síndrome compartimental", "Transfusión masiva", "Infección cervical profunda"]}, {"r": "Docencia de ECG · club de lectura", "li": ["Licenciado en Medicina por la National Taiwan University; residencia completada en Urgencias de Zhongxing", "Acreditado como comandante de desastres por el Departamento de Salud de la Ciudad de Taipéi", "Primer autor del artículo sobre la respuesta a la explosión de polvo del Formosa Fun Coast"], "s": "Tras su residencia en Urgencias de Zhongxing, se quedó como médico adjunto. Como jefe de residentes recopiló la experiencia de la respuesta a la explosión de polvo del Formosa Fun Coast y la publicó. Su docencia en ECG es minuciosa y aguda, y ha realizado numerosos bloqueos nerviosos en urgencias. Padre de dos hijos.", "q": "Un profesor de ECG minucioso y agudo, que como jefe de residentes escribió el análisis de la respuesta a la explosión.", "tp": ["Interpretación del ECG", "Shock e insuficiencia respiratoria", "Transfusión masiva", "Neumotórax a tensión", "Infarto de miocardio", "Bloqueos nerviosos"], "od": "Padre de dos hijos; su humor ayuda a todo el equipo a desconectar."}, {"r": "Urgencias pediátricas · medicina deportiva", "li": ["Instructora APLS", "Programa de medicina deportiva completado; médica de equipos deportivos en varias ocasiones", "Exadjunta de urgencias en el Hospital de Kinmen", "Autora de correspondencia, Indoor Air 2026"], "s": "Licenciada en Medicina por la Universidad Yang Ming; tras formarse en urgencias en Shuang Ho Hospital, trabajó en Kinmen, donde se quedó como adjunta. En Zhongxing dirige la docencia de pediatría: urgencias pediátricas graves, fluidoterapia y shock en niños, infecciones y urgencias respiratorias, y simulacros de examen oral de pediatría al nivel de la especialidad. Apasionada de la medicina deportiva, ha sido médica de equipo varias veces, entre ellas con la selección femenina sub-17 de fútbol en Ulán Bator. También investiga: es autora de correspondencia de un artículo de 2026 sobre aerosoles. Le encantan el buceo, el cómic y los videojuegos.", "q": "De Kinmen a Ulán Bator: una médica de equipo que lleva la urgencia pediátrica y la medicina deportiva a todas partes.", "tp": ["Urgencias pe a de desastres y atención prehospitalaria, y es uno de los autores principales de la serie de artículos sobre aerosoles. Gran jugador de bádminton.", "q": "Un guerrero amis de Ji'an, Hualien, y un adjunto de medicina de desastres formado en Zhongxing.", "tp": ["Taller de REBOA", "Triaje médico de desastres en Taiwán", "DMAT japonés", "Lesiones por explosión", "Lesiones químicas y eléctricas", "Nuevas drogas"], "od": "Gran deportista y un as del bádminton."}, {"r": "Docencia de ginecología y obstetricia de urgencias", "li": ["Residencia completada en Urgencias de Zhongxing", "Primer autor en West J Emerg Med 2025 (ensayo aleatorizado de intubación en sedestación)", "Primer autor en Emerg Med J 2024"], "s": "Médico adjunto de nueva generación que completó su residencia en Zhongxing y se quedó. Ya como residente participó en la investigación sobre vía aérea difícil y aerosoles, y publicó como primer autor un ensayo cruzado aleatorizado de intubación en sedestación, desde atrás a la derecha frente a cara a cara.", "q": "Un adjunto de nueva generación formado en Zhongxing, de la investigación sobre intubación sentada a la ginecología de urgencias.", "tp": ["Ginecología y obstetricia de urgencias", "Investigación en vía aérea difícil"]}, {"r": "Manejo de la vía aérea · toxicología", "li": ["Residencia de urgencias en Zhongxing, hoy adjunto", "Primer autor, Emerg Med J 2026 (TSV y troponina, completado durante la residencia)", "Mención de honor, comunicación oral (sección quirúrgica), Foro de Investigación de Residentes de Nueve Hospitales", "Coautor de estudios sobre aerosoles y vía aérea difícil (Indoor Air 2026, Sci Rep 2025, Am J Emerg Med 2024)"], "s": "Hizo la residencia en Zhongxing y se quedó como adjunto. Siendo residente se unió al equipo de investigación sobre aerosoles y vía aérea difícil y es coautor de varios artículos. Su foco clínico es el manejo de la vía aérea y la toxicología, que lleva al día docente de los martes.", "q": "Un nuevo adjunto que se unió a
