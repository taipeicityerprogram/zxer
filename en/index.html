ed"]]}, {"band": "2021 · Wanhua outbreak", "tag": "Official commendation", "h": "Heping closed its ED, and Zhongxing was first in line", "p": "The nearby Heping Branch became a dedicated COVID-19 hospital after an in-hospital outbreak and closed its ED. Zhongxing turned the glass window of the ED pharmacy into a testing window with a pass-through box. Medical and surgical physicians shared testing shifts, handling 200–400 tests a day without ever closing the ED. While dedicated wards were being set up, we managed the airways of unstable confirmed patients, covering intubation for more than half of the confirmed patients in the hospital. Staff lived in isolation from their families for two months.", "facts": [["200–400", "Tests per day"], ["&gt;½", "Of in-hospital confirmed patients intubated"], ["2 months", "Staff in isolation"]]}, {"band": "2022 · \"Snow House\" rapid prescription clinic", "tag": "National epidemic peak", "h": "500 patients in four hours, with critical care capacity intact", "p": "At the epidemic peak in May 2022, the ED organized the \"Snow House\" rapid prescription clinic across departments, offering testing and rapid prescriptions from day into night. In April–May 2022 it served nearly 15,000 emergency and outpatient visits. Wan Hai Lines donated negative-pressure isolation pods, Chairman Fei-Long Chen donated prefabricated testing cabins, and Inventec donated testing containers. The clinic ran until the Central Epidemic Command Center was disbanded in May 2023.", "facts": [["~15,000", "Visits in April–May"], ["500", "Patients in 4 peak hours"], ["2023.05", "Mission complete"]]}, {"band": "2023 → 2025 · Search and rescue, fire-service partners", "tag": "Interagency partnership", "h": "MOUs with the Taipei City Fire Department", "p": "On 7 December 2023, Taipei City Hospital and the Taipei City Fire Department signed an MOU: staff from both sides take part in each other's training and drills, carry out rescue missions together in major domestic disasters, and jointly provide emergency care in mass-casualty incidents in Taipei. Drs Ya-Chin Liang and Wei-Lun Chen are contracted physicians for the Taipei urban search-and-rescue team, and several attendings hold disaster commander qualifications from the Department of Health. Dr Ya-Chin Liang also teaches training courses for the rescue team, including hands-on first aid for search dogs. During the 2024 Hualien earthquake, our physicians mobilised. In July 2025 a second MOU followed, covering health check-ups and health management for firefighters.", "facts": [["2023.12", "Search-and-rescue MOU"], ["0403", "Hualien earthquake deployment"], ["2025.07", "Firefighter health partnership"]]}, {"band": "2020 → 2026 · Turning experience into science", "tag": "Interdisciplinary with Taipei Tech", "h": "An aerosol research team born in the pandemic", "p": "In 2020 the ED team and the Department of Energy and Refrigerating Air-Conditioning Engineering at National Taipei University of Technology formed an aerosol prevention research team. Using high-fidelity manikins and particle image velocimetry, they quantified healthcare workers' exposure during oxygen therapy, CPR and inhalation therapy. The results were published in Annals of Emergency Medicine, Scientific Reports, Journal of Hospital Infection and Indoor Air.", "facts": [["7", "Papers in the aerosol series"], ["6", "Years of Department of Health grants"], ["ICEM", "2023 Best Poster"]]}], "quote": "\"Multitasking in the ED is like caring for several relationships at once: keep the rhythm of each one, and help everyone move smoothly to their next stop.\"", "quoteSrc": "— Adapted from the Zhongxing ED resident recruitment website"}, "honors": {"eyebrow": "Honors", "h2": "Honor roll: you could be next", "lead": "We hope you will be better than us. That is the purpose of education.", "items": [{"y": "2023 · AMSTERDAM", "h": "ICEM Campbell MacFarlane Best Poster Award", "p": "Dr. Chih-Chieh Wu, then in training, won for his study of aerosol dispersion distance and concentration during oxygen therapy.", "gold": true}, {"y": "2023 · Taiwan Society of Emergency Medicine", "h": "Toxicology spot-diagnosis champions", "p": "Dr. Hsin-Ling Chen led our residents to the title.", "gold": true}, {"y": "2023 · Taipei City", "h": "Young Physician Award (Qingnian Xinglin Award)", "p": "Dr. Wei-Lun Chen, a Zhongxing-trained attending physician specializing in disaster medicine.", "gold": true}, {"y": "2023 · Taipei Veterans General Hospital International Medical Education Conference", "h": "Bronze award, research abstract competition", "p": "Research related to competency-based medical education."}, {"y": "2003 · 2015 · 2021", "h": "Three official commendations for meritorious service", "p": "SARS, the Formosa Fun Coast dust explosion and COVID-19. Director Tzu-Yao Hung received an official commendation for meritorious service from the Ministry of Health and Welfare for the Formosa Fun Coast dust explosion."}, {"y": "1999", "h": "Commendation for 921 earthquake relief", "p": "Took part in relief in central and northern Taiwan and was commended by the Taipei City Government, the Taichung County Government and medical associations."}, {"y": "Taipei City Hospital", "h": "Outstanding Physician · Outstanding Teacher", "p": "Bor-Hen Wu (Outstanding Physician, 2023), Tzu-Yao Hung (Outstanding Teacher, 2016; Outstanding Physician, 2020), Hsin-Ling Chen (Outstanding Physician)."}, {"y": "Residents", "h": "Outstanding Resident", "p": "Zhongxing ED residents have been selected as Outstanding Residents."}, {"y": "2025 · Taipei City", "h": "Urban resilience exercise", "p": "Our disaster response team took part in the Taipei urban resilience exercise, and the medical commander briefed inspecting officials on scene."}]}, "place": {"eyebrow": "Beimen · Taipei Main Station · Dadaocheng", "h2": "In the oldest and newest part of Taipei", "lead": "To the east are Taipei Main Station and the rising Taipei Twin Towers. To the north is Dadaocheng, lined with century-old tea merchants and fabric shops. A ten-minute walk after your shift brings you to the old flavors of Dihua Street.", "mapAria": "Map of the area around the Zhongxing Branch: Taipei Main Station and the Taipei Twin Towers to the southeast, Beimen (North Gate) to the south, Dadaocheng and Dihua Street to the north, and the Tamsui River to the west", "map": {"river": "Tamsui River", "rd1": "Zhongxiao West Road", "rd2": "Yanping North Road", "rd3": "Zhengzhou Road", "rd4": "Dihua Street", "ddc": "Dadaocheng", "mrt": "Beimen Station", "gate": "Beimen (North Gate)", "tms": "Taipei Main Station", "twin": "Taipei Twin Towers", "us": "Zhongxing ED"}, "mapNote": "Schematic, not to scale. Address: No. 145, Zhengzhou Road, Datong District, Taipei.", "list": [{"h": "Taipei Main Station · transport hub", "p": "High-speed rail, Taiwan Railway, Taipei Metro and the Taoyuan Airport MRT all meet here. That means emergencies among commuters and travelers, and it also means the front line for mass casualty incidents."}, {"h": "Beimen · gateway to the West District", "p": "Walking distance from MRT Beimen Station, or walk from Exit Y27 of the Taipei City Mall underground. The Beimen area continues to be renewed under the West District Gateway Project."}, {"h": "Dadaocheng · Dihua Street", "p": "A trading port for tea and dry goods since the Qing dynasty, it is still home to the Lunar New Year market street and old-street culture. Older residents, shopkeepers and tourists in the community are all people we care for."}, {"h": "Wanhua · vulnerable communities", "p": "Our hospital is built around caring for vulnerable groups and community medicine. We have long cared for people experiencing homelessness and older adults living alone around Taipei Main Station and Wanhua, and we use research to examine equity in emergency care."}], "fut1": {"eyebrow": "Planned · construction 2029 · completion 2033", "h3": "Smart building for acute and critical care", "svgA": "11 floors above ground", "svgB": "4 basement levels: triage and resuscitation space during disasters", "svgC": "→ MRT Beimen Station", "spec": [["11F", "Floors above ground"], ["B4", "Basement levels"], ["150+", "Underground acute beds during disasters"]], "li": ["Planned upgrade to a <b>severe-level (highest-tier) emergency responsibility hospital</b>", "The ED, operating rooms, ICUs and acute wards will be concentrated in the new building, with smart healthcare systems", "A first-of-its-kind underground emergency medical transport system: if an incident occurs on the high-speed rail, Taiwan Railway, Taipei Metro or Taoyuan Metro, the basement levels become temporary triage and resuscitation space, connected to MRT Beimen Station and the underground mall"], "src": "Source: United Daily News (udn.com), August 2026. The Taipei City Urban Planning Commission approved a relaxed building coverage ratio on July 23, 2026. The timeline is subject to approval by the competent authorities."}, "fut2": {"eyebrow": "Completion as early as 2027", "h3": "Our neighbor: the Taipei Twin Towers", "spec": [["360 m", "Tower D1 · 70 floors"], ["280 m", "Tower C1 · 53 floors"], ["NT$60.6 billion", "Total investment"]], "p": "The C1/D1 joint development will become Taiwan's second-tallest building and a landmark at the gateway to Taipei's West District, expected to create about 16,000 jobs. As of April 2026, the C1 steel structure had been erected to the 41st floor and D1 construction had reached the 32nd floor. With more people and more business coming through, the ED's role will only grow.", "src": "Source: Economic Daily News, April 2026", "smartH": "Smart ED", "smartP": "Zhongxing ED is working with industry technology partners on smart triage and continuous vital-sign monitoring, with the goal of detecting changes in waiting patients earlier. (Project in progress)"}}, "join": {"eyebrow": "Recruiting emergency medicine residents", "h2": "The world of Zhongxing ED holds many treasures.<br>Are you looking toward the horizon?", "p": "If you want to get in the game, we will be your coaches. You are welcome to visit, shadow, or simply talk with our residents.", "btn1": "Original recruitment site", "btn2": "See the training program again", "rows": [["Department of Education and Research, Zhongxing Branch", "02-2552-3234"], ["Address", "No. 145, Zhengzhou Road, Datong District, Taipei"], ["Getting here", "MRT Beimen Station · Taipei City Mall Y27"]], "copy": "Copy", "copied": "Copied"}, "gallery": {"eyebrow": "Life at Zhongxing", "h2": "After work, we are family too", "lead": "We work shifts together, learn together, and also eat and sing together."}, "footer": {"a": "© Department of Emergency Medicine, Taipei City Hospital, Zhongxing Branch", "b": "Sources: Emergency Medicine Residency Training Plan (18th revision, May 12, 2026), PubMed, United Daily News, Economic Daily News. Last updated October 2026. This website is for introduction only and does not constitute medical advice. In an emergency, call 119 or go to the nearest emergency department."}, "photos": {"air1": "Airway workshop: an attending physician demonstrates the video intubation stylet", "air2": "Small groups rotate through stations, with TAs coaching one-on-one", "air3": "Clinicians from abroad at an airway workshop", "air4": "Practicing video laryngoscopy and bag-mask ventilation", "ircad": "IRCAD airway course", "us1": "Bedside ultrasound teaching", "us2": "Hands-on POCUS: scanning and discussing", "us3": "Neck ultrasound practice", "tue1": "Group photo after teaching day", "tue2": "Case discussion in the teaching room", "tue3": "Small-group teaching: airway equipment explained", "intl1": "Clerkship completion and certificate presentation", "intl2": "Clinicians from abroad practicing resuscitation skills", "intl3": "Discussing cases with visiting clinicians", "intl4": "Doctors from abroad at an airway workshop", "intl5": "International trainees in a resuscitation room simulation", "intl6": "WAMM 2025 World Airway Management Meeting, Italy", "intl7": "Presenting a research poster at an international conference", "dis1": "Urban resilience exercise: the medical commander briefs on scene", "dis2": "Mass casualty drill: on-scene first-aid station", "dis3": "Mass casualty drill: triage and evacuation", "dis4": "Training with the Taipei City urban search-and-rescue team", "dis5": "Exchange with the Taipei City Fire Department urban search-and-rescue team", "dis6": "Radio command during a drill", "dis7": "ED mass casualty drill", "conf1": "Taiwan Society of Emergency Medicine winter scientific meeting and Taiwan Emergency Medicine Day", "conf2": "Recording a program for the Taiwan Society of Emergency Medicine", "life1": "Dinner after work", "life2": "Department gathering", "life3": "KTV after work", "life4": "Department celebration", "life5": "Attendings and residents", "sim1": "Resuscitation room and simulation equipment", "sim2": "High-fidelity simulation training", "vent": "Ventilator teaching", "sim3": "CPR team drill", "sim4": "Bag-mask ventilation and airway workshop", "intl8": "With visiting clinicians", "intl9": "Visiting clinicians with our resident", "life6": "Catching up after a shift", "chief1": "Airway sign-off: the chief is the patient, the juniors take selfies", "chief2": "The chief topicalizes his own airway", "chief3": "A resident performs video laryngoscopy on the awake chief", "chief4": "Airway sign-off: intubate the chief", "air5": "Video-intubation teaching in the resus room", "mug": "A mug printed with our own paper: Annals of Emergency Medicine 2022", "laser": "Laser-sheet imaging of aerosol spread during airway procedures", "covid1": "During the pandemic: transferring a patient in full PPE", "covid2": "During the pandemic: checking every order together", "drill1": "Mass-casualty drill: ED staff and EMS receive a simulated casualty", "drill2": "A simulated casualty on mask oxygen during a drill", "drill3": "Moulage before the drill", "tue4": "Teaching room: a case revealed step by step", "teach1": "Attending teaching at the nursing station", "care1": "Home visit", "care2": "Zhongxing palliative care gathering (2022)", "life7": "Whole-team dinner", "life8": "Coffee before the shift", "usar1": "Taipei search-and-rescue training ground", "usar2": "Medical preparation in a Taipei USAR (TPE USAR) tent", "usar3": "Taipei search-and-rescue team assembling", "usar4": "Rescue-team training: group photo after Dr Ya-Chin Liang's search-dog first-aid class", "usar5": "Rescue-team training: Dr Ya-Chin Liang teaches hands-on first aid for search dogs"}, "rot": {"pre": "Every week at Zhongxing, you practice", "words": ["difficult intubation", "intubating the chief", "bedside ultrasound", "resuscitation", "disaster command", "teaching from the podium"]}, "app": {"eyebrow": "Teaching innovation · JMIR Med Educ 2025", "h2": "Watch yourself grow, right on your phone", "lead": "Since 2018, Zhongxing ED has run two-way resident assessment on a phone app instead of paper. In the last hour of every shift, the supervising attending gives milestone and EPA feedback in the app. You can see your progress curve at any time, and which required clinical scenarios you still need. This approach became a published study and won an award.", "phone": {"t": "My milestones", "s": "Illustration", "k1": "EPA average this quarter", "k2": "Required scenarios done", "rows": ["Intubation (incl. video laryngoscopy)", "Focused ultrasound", "Leading the resuscitation team", "Breaking bad news"]}, "chartT": "Mobile app vs paper/web assessment", "a": "App", "b": "Paper / web", "m": ["Reported \"very satisfied\"", "See counts, trend chart and completion rate together"], "note": "Data: Chen HL, …, Hung TY. JMIR Med Educ 2025;11:e57216. Survey of 74 educators, residents and program directors at emergency residency sites in Taiwan (app group 14, paper/web group 60).", "pts": ["Fewer missed assessments (P=.02)", "Easier to see your own performance trends (P<.001)", "Easier to see which required clinical scenarios are still missing (P<.001)", "No extra time spent on assessment or feedback"], "awardY": "2023 · Taipei Veterans General Hospital International Medical Education Conference", "awardH": "Research abstract competition, Bronze Award", "awardP": "Winning study: a tailored-learning comparison of app, paper and web assessment in emergency residency training. Awardees: Tzu-Yao Hung, Hsin-Ling Chen, Chia-Wen Chang, Yi-Ching Chiu.", "read": "Read the paper"}, "faq": {"eyebrow": "FAQ · for future residents", "h2": "Questions you may have", "items": [{"q": "What are the working hours?", "a": "16 shifts a month, 12 hours each, about 192 hours (cap 200). On adult ED months, night shifts come as one fixed week, never back-and-forth day/night switching. Tuesday is teaching day with no front-line duty."}, {"q": "Is \"intubate the chief\" for real?", "a": "Yes. For the final airway checkpoint the chief volunteers as an awake \"patient\": under topical anaesthesia and full monitoring, residents complete an awake-airway sequence with video laryngoscopy and flexible endoscopy, and the chief gives feedback on the spot. It is our most popular, and most photographed, session."}, {"q": "Will I be left alone on the front line in year one?", "a": "No. R1–R2 see patients under full attending supervision, two attending lines are on duty 24 hours, and the last hour of each shift is one-on-one feedback. You also get two mentors, one inside and one outside the department."}, {"q": "Will a regional hospital give me enough critical care?", "a": "Two months each in our medical and surgical ICUs, plus 1–3 months in the NTUH ED critical care area, MacKay pediatrics, Linkou Chang Gung trauma and Taipei Veterans General toxicology."}, {"q": "Is research required? Is it stressful?", "a": "At least one society poster or paper a year, built from a clinical question with an attending alongside you. From R3, research meetings every two months. Our residents have won the ICEM Best Poster Award and published as first authors in SCI journals."}, {"q": "Is there life after work?", "a": "Yes. Teaching is concentrated on Tuesdays and the schedule is predictable; annual leave is 7–10 days depending on year. The team often eats out and sings karaoke together. The photos are above."}, {"q": "How do I apply?", "a": "Positions and timelines follow the annual announcements of the Ministry of Health and Welfare and the Taiwan Society of Emergency Medicine. You are welcome to visit or shadow first. Contact the Department of Education and Research, Zhongxing Branch: 02-2552-3234."}]}, "chief": {"stamp": "PASSED · CHIEF-APPROVED", "eyebrow": "Intubate the Chief · airway sign-off", "h2": "Want your airway sign-off? <em>Intubate the chief.</em>", "lead": "At Zhongxing, the final airway checkpoint is not a manikin. The chief takes the chair, topicalizes his own airway and opens wide, so residents can run a full awake-airway sequence on a patient who is awake, talking and giving feedback on the spot. The juniors are busy taking selfies, because this moment is worth remembering.", "path": [{"b": "Manikin workshops", "s": "Mask ventilation, direct and video laryngoscopy, bougie and SALAD suction, rotating in small groups until it feels natural."}, {"b": "Cadavers and high-fidelity simulation", "s": "Epiglottis-only views and a cadaver model of Ludwig's angina: judgement practised in the hardest airways."}, {"b": "The real resus room", "s": "Attending-supervised, with at least 35 successful intubations before R3."}, {"b": "Final level: the chief himself", "s": "Awake topicalization, video laryngoscopy and flexible endoscopy. When the chief nods, you pass."}], "fine": "The chief volunteers as the subject. Awake-airway practice is done under topical anaesthesia, with full monitoring and rescue equipment ready."}, "care": {"eyebrow": "Public metropolitan emergency care", "h2": "High-quality emergency care, and a safety net for the city", "lead": "We are the emergency department of Taipei City Hospital, next to Taipei Main Station. Commuters, tourists, older people living alone, neighbours experiencing homelessness: everyone who walks in meets the same board-certified emergency physicians and receives the same standard of care.", "tiles": [{"n": "12 / 12", "h": "Every attending is EM board-certified", "p": "All 12 full-time attendings are board-certified in emergency medicine, two attendings are on site around the clock, and bedside ultrasound is always at hand."}, {"n": "Homelessness", "h": "Patients, not problems", "p": "Many people around Taipei Main Station have no home. With our social workers and the Taipei Department of Social Welfare medical subsidy, people who cannot pay can still complete their emergency care."}, {"n": "Research", "h": "Insurance is not the same as care", "p": "Using several years of ED data, we are studying gaps in early departure and return visits among people experiencing homelessness, to find where care can be closed (study in progress)."}, {"n": "Home acute care", "h": "Emergency physicians at your door", "p": "After assessment, homebound older patients can be visited at home or by telehealth by EM-trained physicians and complete acute treatment at home."}, {"n": "Palliative", "h": "There for the last mile", "p": "All attendings are qualified in hospice and palliative care. We promote age-friendly acute care and shared decision-making with patients and families."}, {"n": "Teaching", "h": "Quality is taught", "p": "Tuesday teaching day, real-time app feedback, bedside attending supervision: a resident's training today is a patient's care tomorrow."}], "note": "The homelessness study is not yet published; results will be shared after peer-reviewed publication."}, "stars": {"eyebrow": "Resident Hall of Fame", "h2": "Residents take the stage too", "lead": "At Zhongxing, awards, podium talks and original research are not reserved for attendings. Everything below was achieved by our residents during their training. You could be next.", "awards": [{"y": "2023 · ICEM AMSTERDAM", "who": "Dr Chih-Chieh Wu", "h": "Campbell MacFarlane Best Poster Award", "p": "Recognised at the International Conference on Emergency Medicine for research on aerosol dispersion distance and concentration during oxygen therapy."}, {"y": "2023 · TAIPEI CITY", "who": "Dr Wei-Lun Chen", "h": "Young Xinglin Award (青年杏林獎)", "p": "Stayed at Zhongxing after training and is now an attending with a disaster-medicine focus."}, {"y": "RESIDENCY", "who": "Dr Chung-Shiung Wen", "h": "Best Resident", "p": ""}, {"y": "NINE-HOSPITAL RESIDENT RESEARCH FORUM", "who": "Dr Sheng-Han Yu", "h": "Oral presentation, surgical division: honourable mention", "p": "Awarded for his SVT and troponin study completed during residency (supervised by Dr Tzu-Yao Hung); the study was published in Emergency Medicine Journal in 2026."}], "papersH": "Original research completed during residency", "papersP": "Emergency residency is demanding, yet with mentoring from their teachers these doctors still completed original research during their training. Four of them stayed on and are now our attendings. Their first-author papers are listed below.", "papers": [{"who": "Dr Chih-Chieh Wu", "now": ""}, {"who": "Dr Wei-Lun Chen", "now": "NOW ATTENDING"}, {"who": "Dr Chieh-Hung Lin", "now": "NOW ATTENDING"}, {"who": "Dr Cheng-Wei Tseng", "now": "NOW ATTENDING"}, {"who": "Dr Sheng-Han Yu", "now": "NOW ATTENDING"}], "note": "Awards and papers compiled from department records; paper links go to the DOI."}}, "fr": {"meta": {"lang": "fr", "title": "Urgences de Zhongxing | Hôpital municipal de Taipei, site de Zhongxing", "skip": "Aller au contenu principal", "langLabel": "Langue", "desc": "Service d'urgences de l'Hôpital municipal de Taipei, site de Zhongxing, près de la gare centrale : internat de médecine d'urgence, voies aériennes et POCUS, recherche et échanges internationaux."}, "nav": {"who": "Pour vous", "sig": "Voies aériennes · POCUS", "tue": "Le mardi pédagogique", "train": "Formation et hôpitaux partenaires", "fac": "Équipe enseignante", "res": "Recherche", "intl": "International", "hist": "Un siècle d'histoire", "crisis": "Catastrophes et épidémies", "honors": "Distinctions", "place": "Gare principale · Dadaocheng", "join": "Nous rejoindre", "app": "Innovation pédagogique", "faq": "FAQ", "care": "Soigner la ville", "stars": "Réussites des internes"}, "hero": {"eyebrow": "Taipei City Hospital, site de Zhongxing · Service de médecine d'urgence", "h1": "Ancrés dans le vieux Taipei,<br><em>prêts pour chaque urgence</em>.", "sub": "Du grand carrefour de la gare principale de Taipei aux maisons centenaires de Dadaocheng. Aux urgences de Zhongxing, une seule équipe réunit prise en charge rapide des urgences, voies aériennes difficiles, échographie au lit du patient, enseignement clinique et réponse aux catastrophes. Nos 12 médecins seniors sont tous spécialistes en médecine d'urgence, tous à temps plein.", "btn1": "Découvrir notre formation", "btn2": "Je viens me faire soigner", "mission": "Notre mission : offrir des soins d'urgence rapides, sûrs et humains, tout en perfectionnant sans cesse les compétences, les preuves et les systèmes dont notre communauté a besoin.", "pillars": [{"t": "Protéger la communauté", "d": "La première ligne de défense autour de la gare principale de Taipei, de Beimen, de Dadaocheng et de Wanhua."}, {"t": "L'exigence du geste : voies aériennes et échographie", "d": "Nous enseignons ce que nous étudions ; nos publications sont notre programme."}, {"t": "Prêts pour l'imprévu", "d": "SRAS, explosion de poussière du Formosa Fun Coast, épidémie de Wanhua : nous étions là à chaque fois."}]}, "mon": {"aria": "Indicateurs du service façon moniteur : environ 30 000 passages aux urgences par an, 12 médecins seniors à temps plein, 4 centres médicaux partenaires, 42 à 48 mois d'internat", "k1": "ED VISITS / YR", "u1": "Passages annuels moyens aux urgences, 2023–2025", "k2": "ATTENDINGS", "u2": "Tous spécialistes en médecine d'urgence, à temps plein", "k3": "PARTNER CENTERS", "u3": "Centres médicaux partenaires de formation", "k4": "TRAINING", "v4": "42–48", "u4": "mois · internat de médecine d'urgence"}, "logoAlt": "Logo des urgences de Zhongxing : à gauche, la ligne d'horizon de Taipei ; à droite, les maisons-boutiques de Dadaocheng ; au centre, des poumons, une sonde d'échographie et un tracé d'ECG", "who": {"eyebrow": "Choisissez votre profil", "h2": "Qui êtes-vous ?", "tabs": ["Patient", "Futur interne en médecine d'urgence", "Étudiant en médecine · UGY · PGY", "Ambulanciers · EMT"], "panels": [[{"n": "24 h", "h": "Des urgences ouvertes toute l'année", "p": "Urgences ouvertes 24 h/24 depuis 1976. Consultations séparées en médecine, chirurgie et pédiatrie, avec des box distincts pour enfants et adultes. La gynécologie dispose d'une salle d'accueil dédiée (la « salle chaleureuse ») pour préserver votre intimité."}, {"n": "12", "h": "Un spécialiste des urgences à chaque garde", "p": "Nos 12 médecins seniors à temps plein sont tous spécialistes en médecine d'urgence. Deux lignes de seniors sont présentes 24 h/24. Trois échographes au lit du patient permettent un examen ciblé immédiat."}, {"n": "MRT Beimen", "h": "Juste à côté de la gare principale de Taipei", "p": "145, rue Zhengzhou, district de Datong, Taipei. Accessible à pied depuis la station de métro Beimen, ou depuis la sortie Y27 de la galerie souterraine de Taipei."}, {"n": "Soins aigus à domicile", "h": "Des soins aigus chez vous, même après la sortie", "p": "Pour les patients à mobilité réduite ou qui ont du mal à se déplacer, après évaluation médicale, un médecin issu de l'urgence peut assurer une visite à domicile ou une téléconsultation. Pneumonie, infection urinaire ou infection des tissus mous peuvent ainsi être traitées à la maison."}, {"n": "Soins palliatifs · Gériatrie", "h": "Une attention particulière aux aînés et aux patients en fin de vie", "p": "Tous nos médecins seniors sont qualifiés en soins palliatifs. Nous développons des soins aigus adaptés aux personnes âgées (ACE) et la décision médicale partagée. Avec le service de médecine intégrée, nous assurons le relais des urgences vers l'hospitalisation, le domicile et les soins de longue durée."}, {"n": "Circuit d'isolement", "h": "Tri des maladies infectieuses : consultez en confiance", "p": "Des box d'isolement avec entrée indépendante et ventilation séparée. Les patients fébriles ou suspects de maladie infectieuse sont orientés dès le tri. L'unité d'observation compte 18 lits, tous équipés de rideaux."}], [{"n": "16 gardes / mois", "h": "Des horaires prévisibles", "p": "Gardes de 12 heures, environ 192 heures par mois (200 au maximum). En urgences adultes, les nuits sont regroupées sur une semaine fixe : pas d'alternance jour/nuit en « dents de scie »."}, {"n": "R1–R2", "h": "Une supervision senior permanente", "p": "En 1re et 2e année, vous consultez sous la supervision d'un médecin senior enseignant. Chaque jour, pendant la dernière heure de garde, le senior choisit un cas et vous fait un retour immédiat. Deux lignes de seniors 24 h/24."}, {"n": "Chaque mardi", "h": "Journée pédagogique, hors première ligne", "p": "Ce jour-là, les internes ne sont pas en première ligne clinique. Ils suivent un médecin senior : cours fondamentaux, club de lecture (Tintinalli, 9e édition), revues de littérature et discussions de cas."}, {"n": "Évaluation sur app", "h": "Formation par compétences (CBME)", "p": "Toutes les évaluations des jalons et des EPA se font sur l'application des internes. Résultats publiés dans JMIR Medical Education (2025). Vous suivez votre progression à tout moment."}, {"n": "Double tutorat", "h": "Quelqu'un veille sur vous", "p": "Deux tuteurs, l'un dans le service, l'autre hors du service. Réunion de tutorat mensuelle, rencontre trimestrielle avec le directeur de l'hôpital, et un psychologue de l'hôpital pour évaluer le stress."}, {"n": "Publier dès la 1re année", "h": "La recherche part de la clinique", "p": "Au moins un poster ou un article par an. La recherche d'un interne sur les aérosols a remporté le prix du meilleur poster à l'ICEM 2023."}], [{"n": "PGY", "h": "Hôpital partenaire pour la formation PGY en urgence", "p": "Le site de Zhongxing est un hôpital partenaire du programme de médecine générale post-diplôme (PGY) de deux ans. Aux urgences, l'échographie POCUS et la gestion des voies aériennes s'apprennent dès le PGY."}, {"n": "R3 moniteur", "h": "Vos aînés vous accompagnent", "p": "Dès la 3e année, les internes sont moniteurs des cours PGY de voies aériennes et d'échographie, puis donnent progressivement des cours. Apprendre en enseignant fait partie de la culture du service."}, {"n": "CrazyatLAB", "h": "Tous les outils d'intubation à portée de main", "p": "Vidéolaryngoscopes, Pentax AWS, stylet vidéo, fibroscope, laryngoscope à lame hyperangulée, ainsi qu'un mannequin d'intubation transparent et un mannequin d'intubation néonatale."}, {"n": "Stages courts", "h": "UGY, externes et stagiaires : à la carte", "p": "Les étudiants UGY, externes et stagiaires peuvent organiser un stage aux urgences d'une durée adaptée à leurs besoins. Les urgences d'un hôpital régional à côté de la gare principale de Taipei accueillent des patients très variés : personnes âgées, personnes sans abri, touristes et navetteurs. Ajoutez les exercices d'afflux massif de victimes : tout un apprentissage hors des manuels."}, {"n": "International", "h": "Présenter vos travaux à l'étranger", "p": "Ces dernières années, nous avons présenté à l'ICEM (Amsterdam), à l'EUSEM (Barcelone), à l'AMEE (Suisse) et au WAMM (Italie)."}, {"n": "Contact", "h": "Envie de nous rendre visite ?", "p": "Contactez le service enseignement et recherche du site de Zhongxing (02-2552-3234), ou voyez plus bas « Nous rejoindre »."}], [{"n": "Transmission", "h": "Dite clairement, écoutée attentivement", "p": "Une transmission claire est notre philosophie de commandement. Les quelques minutes de l'arrivée de l'ambulance déterminent toute la suite pour le patient."}, {"n": "Exercices", "h": "Exercices de nombreuses victimes, côte à côte", "p": "Lors des exercices de résilience urbaine et de nombreuses victimes, urgences, ambulanciers et pompiers s'entraînent ensemble, du tri sur le terrain au transfert à l'hôpital."}, {"n": "USAR", "h": "Partenaires du sauvetage de Taipei", "p": "En décembre 2023, l'Hôpital municipal de Taipei et les pompiers de Taipei ont signé un protocole d'accord pour s'entraîner régulièrement ensemble ; les Drs Ya-Chin Liang et Wei-Lun Chen sont médecins attitrés de l'équipe de recherche et sauvetage. Lors du séisme de Hualien en 2024, nos médecins se sont mobilisés."}, {"n": "DMAT", "h": "Équipe médicale de catastrophe", "p": "Plusieurs seniors sont commandants de catastrophe certifiés par le Département de la santé. Nous nous entraînons et intervenons ensemble."}, {"n": "Voies aériennes", "h": "Le souffle qui compte le plus", "p": "Nos ateliers commencent par la ventilation au masque et l'aspiration SALAD, les gestes les plus importants sur le terrain."}, {"n": "Contact", "h": "Envie de vous entraîner avec nous ?", "p": "Pour les partenariats et les visites, contactez le service Enseignement et recherche du site de Zhongxing (02-2552-3234)."}]]}, "sig": {"eyebrow": "Signature training · nos publications parlent pour nous", "h2": "Deux points forts : voies aériennes et POCUS", "lead": "Nous enseignons ce que nous étudions. Voies aériennes difficiles et échographie au lit du patient : ce sont nos thèmes les plus publiés, nos cours les plus vivants et les compétences que nos internes maîtrisent le mieux.", "evk": "EVIDENCE · nos propres publications", "air": {"eyebrow": "Airway · CrazyatLAB", "h3": "Quand la glotte reste invisible, vous savez quoi faire.", "p": "Le chef de service, le Dr Tzu-Yao Hung, est formateur expert CrazyatLAB ; sa thèse de doctorat porte sur les stratégies d'intubation difficile lorsque seule l'épiglotte est visible. Les études du service sur cadavres et mannequins recrutent justement des médecins PGY arrivés aux urgences depuis 2 à 5 mois : leurs résultats nourrissent directement votre formation.", "steps": [{"b": "STEP 1", "s": "Ventilation au masque, laryngoscopie directe avec bougie, aspiration SALAD pour libérer les voies aériennes"}, {"b": "STEP 2", "s": "Toute la gamme des vidéolaryngoscopes : lame hyperangulée, stylet vidéo, fibroscope"}, {"b": "STEP 3", "s": "Méthode de Peyton en quatre étapes pour le stylet vidéo (AMEE 2024)"}, {"b": "STEP 4", "s": "Cricothyroïdotomie (FONA) et algorithme de sauvetage ; 35 intubations réussies avant la fin du R3"}], "li": ["Ateliers en petits groupes : deux stations de mannequins en rotation, et un moniteur qui vous guide individuellement sur un mannequin voisin en cas de difficulté", "Exercice annuel de TRM voies aériennes, avec l'équipe infirmière", "Technique d'intubation sécurisée SHE bougie, conçue pendant la pandémie et publiée dans Emerg Med J"], "ev": ["Modèle cadavérique « épiglotte seule visible » : meilleur taux de réussite au premier essai avec le stylet vidéo (Sci Rep 2025)", "Essai randomisé sur cadavre simulant une angine de Ludwig (Am J Emerg Med 2024)", "Patient assis : intubation par l'arrière droit vs face à face (West J Emerg Med 2025)"]}, "us": {"eyebrow": "POCUS · échographie au lit du patient", "h3": "La sonde remplace le stéthoscope, dès le PGY.", "p": "Trois enseignants certifiés par le comité d'échographie d'urgence, plus le Dr Che-Chang Hsu, spécialiste de l'anatomie échographique. Les bases s'acquièrent dès le PGY ; au R3, vous réalisez seul une échographie ciblée et rédigez un compte rendu formel sous supervision senior.", "steps": [{"b": "Appareils", "s": "Doppler couleur haut de gamme avec échographie de contraste (CEUS), Philips Sparq, échographe portable"}, {"b": "Cours", "s": "Douleur abdominale « sang, liquide, vésicule, rein », lombalgie, DVT, RUSH, valves cardiaques"}, {"b": "Ludique", "s": "Enseignement ludique de la POCUS et concours de diagnostic en un coup d'œil du Dr Bor-Hen Wu"}, {"b": "Objectif", "s": "150 examens et 11 catégories de cas obligatoires avant la fin du R3"}], "li": ["Au R3, un mois de stage en salle d'échographie, et 1 à 3 mois optionnels d'échographie d'urgence à Shin Kong Wu Ho-Su Memorial Hospital", "Blocs nerveux échoguidés pour l'analgésie, voies veineuses centrales et ponctions", "Dès le R3, moniteur des cours d'échographie PGY"], "ev": ["Disco spotlight sign : le pneumomédiastin à l'échographie (Am J Emerg Med 2017)", "Diagnostic de l'épiglottite aiguë par échographie au lit du patient (Am J Emerg Med 2011)"]}, "ws": [{"n": "Atelier REBOA", "p": "Entraînement à l'occlusion aortique par ballonnet endovasculaire, animé par le Dr Wei-Lun Chen, spécialiste de la médecine de catastrophe."}, {"n": "Atelier accouchement inopiné", "p": "Scénario : une parturiente arrive en taxi devant les urgences, la tête du bébé est déjà visible. Entraînement pas à pas jusqu'à la délivrance du placenta."}, {"n": "Oral simulé de toxicologie", "p": "Intoxications aux pesticides, nouvelles drogues, catastrophes chimiques : entraînement au format de l'oral de spécialité."}, {"n": "Entraînement « serpents venimeux »", "p": "Identification et prise en charge des six principaux serpents venimeux de Taïwan, du terrain au sérum antivenimeux."}]}, "tue": {"eyebrow": "Tuesday Teaching Day · 09:00–15:00", "h2": "Chaque mardi est votre journée pédagogique", "lead": "Nous concentrons l'enseignement le mardi : ce jour-là, les internes ne sont pas en première ligne clinique et passent la journée en cours avec les seniors. Les seniors animent à tour de rôle, chacun dans son domaine de prédilection.", "days": [{"d": "MON", "s": "Clinique"}, {"d": "TUE", "s": "Journée pédagogique"}, {"d": "WED", "s": "Réunion générale de l'hôpital"}, {"d": "THU", "s": "Clinique"}, {"d": "FRI", "s": "Réunion mensuelle avec la chirurgie"}, {"d": "SAT", "s": "Réunion mensuelle avec la radiologie"}, {"d": "SUN", "s": "Clinique"}], "src": "Source : programmes des journées pédagogiques et supports d'enseignement des urgences de Zhongxing, 2023–2025.", "menuH": "Chaque mardi, toujours au programme", "menu": ["Cours fondamentaux (Tintinalli, 9e éd.)", "Club de lecture et revue de presse", "Discussion de cas (CbD)", "Revue des reconsultations à 72 heures", "Rédaction des dossiers", "Éthique et droit", "Simulation et ateliers"], "modH": "Domaines animés à tour de rôle par nos seniors", "modules": [{"f": "Soins critiques", "p": "Évaluation et prise en charge des patients graves aux urgences, en lien avec la réanimation."}, {"f": "Voies aériennes · recherche", "p": "Ateliers voies aériennes difficiles et réunions d'avancement des projets de recherche des internes."}, {"f": "Échographie POCUS", "p": "De la douleur abdominale et lombaire à la TVP et au protocole RUSH : un cursus complet d'échographie au lit du patient."}, {"f": "Traumatologie", "p": "Cours fondamentaux ATLS et prise en charge du traumatisé."}, {"f": "ECG · club de lecture", "p": "Interprétation de l'ECG et lecture du manuel."}, {"f": "Urgences pédiatriques · médecine du sport", "p": "Urgences vitales de l'enfant, remplissage et choc, et oraux blancs de pédiatrie."}, {"f": "Gynéco-obstétrique d'urgence", "p": "Urgences gynécologiques et obstétricales courantes, du saignement pendant la grossesse à l'accouchement inopiné."}, {"f": "Préhospitalier · catastrophes", "p": "Soins préhospitaliers et régulation médicale, DMAT et ateliers de simulation comme le REBOA."}, {"f": "Voies aériennes · toxicologie", "p": "Gestion des voies aériennes et toxicologie."}]}, "train": {"eyebrow": "Internat de médecine d’urgence · 42 à 48 mois", "h2": "Les points forts de l'internat", "lead": "L'internat de médecine d'urgence dure ici de 42 à 48 mois. Centrés sur les urgences graves de la communauté, nous formons des urgentistes capables de gérer les catastrophes, formés aux soins palliatifs, rompus à la recherche et à l'enseignement.", "feat": [{"h": "Voies aériennes difficiles", "p": "Le chef de service est formateur expert CrazyatLAB. Le service dispose de Trachway, Pentax AWS, fibroscope, vidéolaryngoscopes à lame hyperangulée et à canal. Au moins 35 intubations réussies avant la fin du R3, et maîtrise de la cricothyroïdotomie."}, {"h": "POCUS et échographie de contraste", "p": "Doppler couleur haut de gamme avec échographie de contraste (CEUS), Philips Sparq et échographe portable ; trois enseignants certifiés par le comité d'échographie d'urgence. Au moins 150 échographies ciblées avant la fin du R3."}, {"h": "Toxicologie et médecine environnementale", "p": "Un cursus de 15 thèmes : pesticides, métaux lourds, nouvelles drogues, morsures de serpent et animaux marins. Un mois de stage externe en toxicologie clinique à Taipei Veterans General Hospital. Nos internes ont remporté le concours de diagnostic toxicologique en un coup d'œil de la Société de médecine d'urgence."}, {"h": "Médecine de catastrophe et EMS", "p": "Centre de gestion de crise de l'hôpital et DMAT, stages au centre de régulation et dans l'équipe de secours avancé, cours sur les accidents nucléaires et les blessures de guerre. Enseignement assuré par des médecins de l'équipe de recherche et sauvetage de Taipei et des commandants des opérations de secours."}, {"h": "Soins palliatifs et gériatrie", "p": "Tous les médecins seniors sont qualifiés en soins palliatifs ; avant de passer à l'année supérieure, chaque interne participe au théâtre de soins palliatifs. Vous apprenez à annoncer une mauvaise nouvelle, à discuter d'un DNR et à reconnaître le patient en fin de vie."}, {"h": "Pédagogie ludique et simulation", "p": "Échographie ludique, atelier REBOA, entraînement « serpents venimeux », simulations d'accouchement inopiné et de réanimation néonatale ; exercice annuel de TRM voies aériennes avec l'équipe infirmière."}], "planner": {"eyebrow": "Rotation planner", "h3": "Où vous formez-vous chaque année ?", "legend": ["Urgences de Zhongxing", "Autres services / sites de TCH", "Stages externes en hôpital partenaire", "Recherche"], "month": "mois", "monthsTitle": "mois", "note": "Selon le programme de formation 2026 ; le planning est proposé par l'interne puis ajusté après validation par le responsable pédagogique et le chef de service.", "years": {"R1": {"goal": "Objectifs : reconnaître les constantes anormales, mener une anamnèse et un examen clinique complets, maîtriser les bases de l'échographie et de l'ECG ; obtenir un certificat ACLS valide. Après une évaluation à 360 degrés (EPA ≥ 3), prise en charge des patients de tri de niveau 1.", "items": [["Urgences adultes", "Urgences de Zhongxing"], ["Pédiatrie", "TCH, site Femmes-Enfants, ou MacKay Memorial Hospital"], ["Médecine interne", "Service de médecine générale"], ["Chirurgie", "Chirurgie générale et avis spécialisés"], ["Gynécologie-obstétrique", "Service et urgences de gynécologie-obstétrique"], ["ORL", "Consultations et avis spécialisés"], ["Ophtalmologie", "Consultations et avis spécialisés"]]}, "R2": {"goal": "Objectifs : gérer plusieurs patients à la fois et hiérarchiser les priorités ; validation des gestes intermédiaires (intubation, drain thoracique, voie veineuse centrale) ; obtenir ETTC, ATLS ou APLS.", "items": [["Urgences adultes", "Urgences de Zhongxing"], ["Réanimation médicale", "Médecine intensive"], ["Pédiatrie", "TCH, site Femmes-Enfants, ou MacKay Memorial Hospital"], ["Neurologie", "Service et échographie cervicale"], ["Chirurgie", "Chirurgie et traumatologie"], ["Médecine de catastrophe", "Centre de gestion de crise et DMAT"], ["Imagerie médicale", "Radiologie diagnostique"], ["Option", "Urgences / traumatologie à Linkou Chang Gung Memorial Hospital, échographie à Shin Kong Wu Ho-Su Memorial Hospital"]]}, "R3": {"goal": "Objectifs : diriger les urgences aux heures de pointe, formation administrative de chef des internes ; 150 échographies ciblées, 35 intubations, cricothyroïdotomie ; obtenir AILS ; devenir moniteur des cours PGY et concevoir un projet de recherche.", "items": [["Urgences adultes", "Urgences de Zhongxing"], ["Réanimation chirurgicale", "Médecine intensive"], ["Urgences pédiatriques", "TCH, site Femmes-Enfants, ou MacKay Memorial Hospital"], ["Psychiatrie", "TCH, site Songde"], ["Secours préhospitaliers", "Centre de régulation + équipe de secours avancé"], ["Échographie", "Salle d'échographie"], ["Toxicologie", "Toxicologie clinique, Taipei Veterans General Hospital"], ["Option · zones isolées", "Hôpital de Kinmen (ministère de la Santé), NTUH, antenne du parc biomédical de Hsinchu, ou autre"]]}, "R3.5": {"goal": "Objectifs : développer une surspécialité, publier ses travaux, suivre la formation catastrophes et risques chimiques, participer aux formations d'instructeur ACLS et de médecin directeur EMS, réussir l'examen de spécialiste en médecine d'urgence.", "items": [["Urgences adultes", "Urgences de Zhongxing"], ["Urgences pédiatriques", "Service et urgences de pédiatrie"], ["Option", "Linkou Chang Gung, Shin Kong, MacKay ou notre service"], ["Recherche", "Choix du sujet et du directeur"]]}}}, "flag": [{"k": "FLAGSHIP · PEDIATRICS", "h": "MacKay Memorial Hospital : pédiatrie et urgences pédiatriques", "mo": "Jusqu'à 4 mois", "p": "La pédiatrie et les urgences pédiatriques se font au TCH, site Femmes-Enfants, ou en pédiatrie à MacKay, pour un total de quatre mois. MacKay est un hôpital formateur en médecine d'urgence et l'hôpital de référence de notre réseau de transfert ; 1 à 3 mois optionnels y sont aussi possibles en urgences et en médecine intensive."}, {"k": "FLAGSHIP · CRITICAL CARE", "h": "National Taiwan University Hospital (NTUH) : secteur de soins critiques des urgences", "mo": "1–3 mois", "p": "Vous prenez en charge les patients les plus graves dans le secteur de soins critiques des urgences d'un centre médical, pour compléter un volume de cas moins fréquent en hôpital régional. Avec 2 mois en réanimation médicale et 2 mois en réanimation chirurgicale chez nous, la formation en soins critiques peut atteindre 7 mois."}, {"k": "TRAUMA", "h": "Linkou Chang Gung Memorial Hospital : urgences · traumatologie", "mo": "1 mois chacun", "p": "Pendant la période optionnelle, au moins un mois aux urgences et un mois aux urgences traumatologiques de Linkou Chang Gung, pour apprendre le fonctionnement de l'équipe de traumatologie grave et le protocole de transfusion massive."}, {"k": "TOXICOLOGY", "h": "Taipei Veterans General Hospital : toxicologie clinique", "mo": "1 mois", "p": "Dans un centre médical habilité à former en toxicologie clinique, vous gérez des avis pour tous types d'intoxications et des consultations toxicologiques."}], "partners": [{"k": "PEDIATRICS", "b": "TCH, site Femmes-Enfants", "s": "Pédiatrie et gynécologie-obstétrique"}, {"k": "ULTRASOUND", "b": "Shin Kong Wu Ho-Su Memorial Hospital", "s": "Échographie d'urgence, 1 à 3 mois"}, {"k": "REMOTE AREA", "b": "Hôpital de Kinmen (ministère de la Santé) · NTUH, antenne du parc biomédical de Hsinchu", "s": "Urgences graves en zone isolée, 1 mois"}, {"k": "PSYCHIATRY", "b": "TCH, site Songde", "s": "Service et consultations de psychiatrie, 1 mois"}], "weekH": "Le rythme académique en dehors du mardi", "weekCols": ["Quand", "Activité", "Contenu"], "week": [["Dernière heure de chaque garde", "Retour clinique", "Le senior de garde choisit un cas à discuter et saisit l'évaluation des jalons en direct sur l'app"], ["Chaque mois", "Club de lecture", "Tintinalli's Emergency Medicine, 9e édition ; club de lecture Minor emergency pour les nouveaux internes"], ["2e vendredi du mois", "Réunion urgences-chirurgie", "Présentations de cas, déclenchement de l'équipe de traumatologie et indicateurs qualité en traumatologie"], ["Un samedi par mois", "Réunion urgences-radiologie", "Lecture d'imagerie avec les radiologues"], ["Tous les deux mois", "Réunion avec la médecine intégrée", "Le relais des urgences vers l'hospitalisation, le domicile et les soins de longue durée"], ["Tous les deux mois dès le R3", "Réunion de recherche", "De la question clinique au protocole, à l'IRB et à la soumission"]]}, "fac": {"eyebrow": "Tous urgentistes diplômés · tous à temps plein", "h2": "L'équipe enseignante", "lead": "Tous nos médecins seniors sont spécialistes en médecine d'urgence et à temps plein. Une équipe jeune, positive et motivée, qui ne laisse jamais un interne seul face à la difficulté. Les enseignants marqués « Formé ici · désormais senior » ont fait leur internat à Zhongxing et sont restés. Cliquez sur « Son parcours » pour découvrir chaque enseignant.", "culture": [{"b": "100 %", "h": "Tous spécialistes des urgences, à temps plein", "p": "Chaque enseignant qui vous encadre est spécialiste en médecine d'urgence. Aucun médecin vacataire."}, {"b": "Jeunes", "h": "Une équipe senior jeune", "p": "Beaucoup de nos seniors sont en début de carrière : peu d'écart d'âge avec vous, ils se souviennent de leur internat et sont prêts à vous accompagner dans les moments difficiles."}, {"b": "4", "h": "Seniors formés à Zhongxing", "p": "Les Drs Chieh-Hung Lin, Wei-Lun Chen, Cheng-Wei Tseng et Sheng-Han Yu ont fait leur internat ici et sont restés. La meilleure preuve : nos anciens deviennent nos enseignants."}, {"b": "2", "h": "Deux lignes de seniors 24 h/24", "p": "En R1–R2, supervision senior permanente et retour individuel pendant la dernière heure de chaque garde. Jamais de « débrouille-toi d'abord seul »."}], "all": "Tous", "story": "Son parcours", "doctor": "Dr", "tags": {"airway": "Voies aériennes", "us": "Échographie", "icu": "Soins critiques", "trauma": "Traumatologie", "peds": "Pédiatrie", "obgyn": "Gynéco-obstétrique", "sport": "Médecine du sport", "ecg": "ECG", "tox": "Toxicologie", "pre": "Préhospitalier", "dis": "Catastrophes", "hah": "Hospitalisation à domicile", "res": "Recherche", "home": "Formé à Zhongxing"}, "people": [{"r": "Chef de service · secrétaire médical · enseignement des voies aériennes", "li": ["Docteur (PhD) du département de biotechnologie de l'Université nationale Yang Ming Chiao Tung (NYCU), maître de conférences à la faculté de médecine", "Formateur expert CrazyatLAB, formateur en voies aériennes à l'IRCAD", "Instructeur ACLS / APLS, enseignant certifié par le comité d'échographie d'urgence", "Animateur du podcast « La médecine d'urgence, vous maîtrisez ? »"], "s": "Diplômé de la faculté de médecine de Yang-Ming, il a effectué son service civil à São Tomé-et-Príncipe, en Afrique de l'Ouest. Formé aux urgences de Shin Kong, il exerce aux urgences de Zhongxing depuis 2002. Sous le nom de plume « Daoren », il a publié « Contes noirs des urgences », « Une minute pour sauver une vie ! Manuel de secours à domicile », « 24 heures pour sauver une vie ! Manuel de secours en traumatologie », « Le guide santé du médecin routard », « Carnets d'un jeune médecin sur l'île noire d'Afrique de l'Ouest » et « L'aventure magique de quatre médecins en Amérique du Sud ». Pendant la pandémie, il a établi le protocole d'intubation du service, puis fondé avec Taipei Tech une équipe de recherche interdisciplinaire sur les aérosols. Distinction officielle pour services méritoires du ministère de la Santé et des Affaires sociales après l'explosion de poussière du Formosa Fun Coast, enseignant d'excellence 2016, médecin d'excellence 2020.", "q": "Un chef de service passionné par l'enseignement des voies aériennes, et un auteur qui écrit sous le pseudonyme « Daoren ».", "tp": ["Ateliers voies aériennes difficiles", "Voies aériennes vigiles (« intuber le chef »)", "Recherche sur les aérosols", "Réunions d’avancement de la recherche"], "od": "Médecin routard, il a effectué son service civil à São Tomé-et-Principe, en Afrique de l'Ouest ; il écrit des livres de vulgarisation et anime un podcast."}, {"r": "Directrice du programme d'internat · soins critiques (prise en charge de niveau réanimation)", "li": ["Master de l'Institut de santé environnementale et professionnelle, Université nationale Yang Ming Chiao Tung (NYCU)", "DTMH, Liverpool School of Tropical Medicine (2023)", "Instructrice ACLS, membre du comité d'éducation médicale de l'hôpital", "Médecin d'excellence de Taipei City Hospital"], "s": "Formée aux urgences de Shin Kong, elle est spécialiste de toxicologie et de médecine environnementale. En 2023, elle a mené les internes à la victoire au concours de diagnostic toxicologique en un coup d'œil de la Société de médecine d'urgence. Rêvant de Médecins sans frontières, elle a suivi de septembre à décembre 2023 le cursus de médecine tropicale à Liverpool. Mère de trois enfants, elle est aussi guide à Dadaocheng et fait découvrir le quartier aux visiteurs étrangers. Ses travaux sur l'évaluation CBME mobile ont été publiés dans JMIR Medical Education.", "q": "Mère de trois enfants, et directrice du programme qui a mené les internes au titre de champion de diagnostic toxicologique.", "tp": ["Soins critiques", "Toxicologie et intoxications aux pesticides", "Nouvelles drogues", "Médecine tropicale d’urgence", "Atelier d’accouchement inopiné", "Annonce des mauvaises nouvelles et éthique"], "od": "Guide agréée de Dadaocheng, elle fait découvrir le quartier aux visiteurs étrangers ; rêvant de Médecins sans frontières, elle a étudié la médecine tropicale à Liverpool."}, {"r": "Chef de service adjoint · responsable de l'enseignement POCUS", "li": ["Enseignant certifié par le comité d'échographie d'urgence", "Instructeur ACLS", "Master en cours à l'Université nationale de Taïwan", "Diplômé en préparation physique", "Médecin de la délégation du Taipei chinois aux Deaflympics 2022 (Brésil)"], "s": "Après sa formation aux urgences de Shin Kong, il a suivi un fellowship de recherche en échographie. Ancien entrepreneur dans les dispositifs médicaux, il a ancré la POCUS dès le PGY à Zhongxing, unanimement saluée par les stagiaires. En 2022, il a été médecin de la délégation aux Deaflympics au Brésil.", "q": "Le chef adjoint qui enracine la POCUS du PGY jusqu'à l'examen de spécialité.", "tp": ["RUSH", "Thrombose veineuse profonde", "Douleur lombaire aiguë", "Vésicule et voie biliaire principale", "Échographie de la dyspnée", "Échographie oculaire et testiculaire", "Ponction lombaire échoguidée"], "od": "Préparateur physique diplômé et ancien entrepreneur en dispositifs médicaux ; pendant la pandémie, il est parti au Brésil comme médecin d'équipe aux Deaflympics."}, {"r": "Enseignement de l'échographie · pédagogie ludique", "li": ["Instructeur ACLS/APLS", "Enseignant certifié par le comité d'échographie d'urgence", "Médecin d'excellence de Taipei City Hospital (2023)", "Fellow en échographie d'urgence, hôpital Shin Kong"], "s": "Tout premier fellow du programme d'échographie d'urgence de Shin Kong, il pilote la formation échographique des internes de Zhongxing. Adepte de la pédagogie ludique, il apporte la bonne humeur partout où il passe et intègre le jeu à l'enseignement de l'échographie au lit du patient. Grand voyageur.", "q": "Là où il passe, on rit : il fait entrer le jeu dans l'enseignement de l'échographie.", "tp": ["Échographie pulmonaire", "POCUS pendant la RCP", "Échographie aortique", "Réponse au remplissage", "Valves cardiaques", "Raisonnement diagnostique et biais cognitifs"], "od": "Grand voyageur et joueur de Magic: The Gathering."}, {"r": "Enseignement POCUS au lit du patient · anatomie échographique", "li": ["Fellow de recherche en échographie d'urgence à Shin Kong Wu Ho-Su Memorial Hospital", "Auteur de la rubrique d'anatomie échographique de POCUS Academy"], "s": "Diplômé de la faculté de médecine de Chung Shan, formé aux urgences de Shin Kong où il a aussi suivi le fellowship de recherche en échographie. À Zhongxing, il enseigne l'anatomie échographique : reconstruire mentalement la 3D à partir d'images 2D, et repérer la pathologie comme dans un jeu POCUS. Amateur de photographie et de chats.", "q": "Un artisan de l'anatomie échographique qui reconstruit la 3D dans sa tête à partir d'images 2D.", "tp": ["Anatomie échographique", "POCUS Game", "Entretiens de fin de vie et éthique aux urgences"], "od": "Photographie et chats : il raconte son quotidien en images."}, {"r": "Responsable de la formation en traumatologie", "li": ["Instructeur ACLS de l'AHA", "Qualifié commandant des opérations de secours par le Département de la santé"], "s": "Formé aux urgences de MacKay, il a rejoint Zhongxing où il est responsable de la formation en traumatologie. Le soir de l'explosion de poussière du Formosa Fun Coast, il était de garde à MacKay, site de Tamsui : il a vécu de l'intérieur le déclenchement du plan afflux massif de victimes.", "q": "Le soir de l'explosion de poussière de Formosa Fun Coast, il était l'urgentiste de garde à MacKay Tamsui.", "tp": ["ATLS", "Traumatisme abdominal", "Oraux blancs de traumatologie grave", "Luxation du bassin et syndrome des loges", "Transfusion massive", "Infection cervicale profonde"]}, {"r": "Enseignement de l’ECG · club de lecture", "li": ["Diplômé de la faculté de médecine de l'Université nationale de Taïwan, interne formé aux urgences de Zhongxing", "Qualifié commandant des opérations de secours par le Département de la santé", "Premier auteur de l'article sur la réponse à l'explosion de poussière du Formosa Fun Coast"], "s": "Après sa formation de spécialiste aux urgences de Zhongxing, il y est resté comme médecin senior. Chef des internes à l'époque, il a analysé et publié l'expérience du service lors de l'explosion de poussière du Formosa Fun Coast. Son enseignement de l'ECG est minutieux et incisif ; il a réalisé de nombreux blocs nerveux aux urgences. Papa de deux enfants.", "q": "Un enseignant de l'ECG minutieux et percutant, qui a rédigé le retour d'expérience de l'explosion en tant que chef des internes.", "tp": ["Interprétation de l'ECG", "Choc et insuffisance respiratoire", "Transfusion massive", "Pneumothorax compressif", "Infarctus du myocarde", "Blocs nerveux"], "od": "Père de deux enfants, son humour aide toute l'équipe à décompresser."}, {"r": "Urgences pédiatriques · médecine du sport", "li": ["Instructrice APLS", "Cursus de médecine du sport validé ; médecin d’équipes sportives à plusieurs reprises", "Ancienne urgentiste senior à l'hôpital de Kinmen", "Autrice correspondante, Indoor Air 2026"], "s": "Diplômée de la faculté de médecine de Yang-Ming, formée aux urgences de Shuang Ho Hospital, elle a ensuite exercé à Kinmen où elle est devenue senior. À Zhongxing, elle pilote l'enseignement pédiatrique : urgences vitales de l'enfant, remplissage et choc, infections et urgences respiratoires, ainsi que des oraux blancs au niveau de l'examen de spécialité. Passionnée de médecine du sport, elle a été plusieurs fois médecin d'équipe, notamment avec l'équipe féminine U17 de football à Oulan-Bator. Elle fait aussi de la recherche : autrice correspondante d'un article de 2026 sur les aérosols. Amatrice de plongée, de mangas et de jeux vidéo.", "q": "De Kinmen à Oulan-Bator : une médecin d'équipe qui emporte urgences pédiatriques et médecine du sport partout.", "tp": ["Urgences vitales de l'enfant", "Remplissage et choc chez l'enfant", "Urgences respiratoires pédiatriques", "Douleur abdominale et ingestion de corps étranger chez l'enfant", "Fièvre et éruption", "Oraux blancs de pédiatrie", "Droit médical"], "od": "Plongée, mangas et jeux vidéo."}, {"r": "Catastrophes · soins préhospitaliers · DMAT", "li": ["Médecin régulateur (direction médicale en ligne)", "Qualifié commandant des opérations de secours par le Département de la santé", "Médecin de l'équipe de recherche et sauvetage de Taipei", "Médecin d’équipe aux Special Olympics"], "s": "Diplômé de l'Université de médecine Chung Shan, formé aux urgences de Dalin Tzu Chi Hospital. Spécialiste de la réponse aux catastrophes et des soins préhospitaliers, il organise la formation de l'équipe médicale de catastrophe (DMAT) de l'hôpital et a créé les cours sur le système de commandement des interventions d'urgence et sur la prise en charge hospitalière des blessés de guerre.", "q": "Faire de l'hôpital un système capable de réagir : DMAT, commandement, plan de prise en charge des blessés de guerre.", "tp": ["Système de commandement hospitalier", "Premiers secours canins (formation des sauveteurs)", "Catastrophes nucléaires et chimiques", "TECC (soins tactiques aux blessés)", "Plan hospitalier blessés de guerre", "Exercices de catastrophe chimique", "Axes de recherche en médecine préhospitalière"], "od": "Médecin d’équipe aux Special Olympics."}, {"r": "Soins préhospitaliers · médecine de catastrophe", "li": ["Prix des jeunes médecins de la ville de Taipei 2023", "Médecin de l'équipe de recherche et sauvetage de Taipei", "Qualifié commandant des opérations de secours par le Département de la santé", "Mobilisé lors du grand séisme de Hualien"], "s": "Diplômé de la faculté de médecine de Yang-Ming, il a effectué son service civil médical à Kinmen ; c'est un guerrier amis de Ji'an, à Hualien. Brillant produit de l'internat de Zhongxing, spécialiste de la médecine de catastrophe et des soins préhospitaliers, il est aussi l'un des principaux auteurs de la série d'articles sur les aérosols. Excellent joueur de badminton.", "q": "Un guerrier amis de Ji'an, à Hualien, et un senior en médecine de catastrophe formé à Zhongxing.", "tp": ["Atelier REBOA", "Tri médical en catastrophe à Taïwan", "DMAT japonaise", "Lésions par explosion", "Brûlures chimiques et électriques", "Nouvelles drogues de rue"], "od": "Sportif accompli et excellent joueur de badminton."}, {"r": "Enseignement de la gynécologie-obstétrique d'urgence", "li": ["Interne formé aux urgences de Zhongxing", "Premier auteur, West J Emerg Med 2025 (essai randomisé d'intubation en position assise)", "Premier auteur, Emerg Med J 2024"], "s": "Jeune médecin senior resté à Zhongxing après son internat. Interne, il participait déjà à la recherche sur les voies aériennes difficiles et les aérosols ; il a publié en premier auteur l'essai croisé randomisé comparant l'intubation du patient assis par l'arrière droit et face à face.", "q": "Un senior de la nouvelle génération formé à Zhongxing, de la recherche sur l'intubation assise à la gynéco-obstétrique d'urgence.", "tp": ["Gynéco-obstétrique d'urgence", "Recherche sur les voies aériennes difficiles"]}, {"r": "Voies aériennes · toxicologie", "li": ["Internat de médecine d'urgence à Zhongxing, désormais senior", "Premier auteur, Emerg Med J 2026 (TSV et troponine, réalisé pendant l'internat)", "Mention honorable, communication orale (section chirurgicale), forum de recherche des internes des neuf hôpitaux", "Co-auteur d'études sur les aérosols et les voies aériennes difficiles (Indoor Air 2026, Sci Rep 2025, Am J Emerg Med 2024)"], "s": "Il a fait son internat à Zhongxing et y est resté comme senior. Interne, il a rejoint l'équipe de recherche sur les aérosols et les voies aériennes difficiles et a cosigné plusieurs articles. Ses domaines cliniques sont la gestion des voies aériennes et la toxicologie, qu'il enseigne lors de la journée du mardi.", "q": "Un nouveau senior qui a rejoint l'équipe de recherche dès l'internat.", "tp": ["Gestion des voies aériennes", "Toxicologie", "Recherche sur les aérosols"]}, {"r": "Senior en médecine intégrée · hospitalisation à domicile (HAH)", "li": ["Ancien interne des urgences de Zhongxing", "Prix Campbell MacFarlane du meilleur poster, ICEM 2023", "Premier auteur, Sci Rep 2023 (dispersion des aérosols sous oxygénothérapie)"], "s": "Interne, il a remporté le prix du meilleur poster à l'ICEM d'Amsterdam pour ses travaux sur la dispersion des aérosols sous oxygénothérapie, et a donné notre cours sur l'hospitalisation à domicile. Aujourd'hui senior en médecine intégrée, il participe au programme national d'hospitalisation à domicile, qui permet aux patients à mobilité réduite de traiter chez eux une pneumonie, une infection urinaire ou des tissus mous. Un partenaire essentiel des urgences.", "q": "Parti des urgences, il ramène les soins aigus au domicile des patients.", "tp": ["Hospitalisation à domicile", "Échocardiographie", "POCUS et volémie"]}], "homeBadge": "Formé ici · désormais senior", "partnerBadge": "Médecine intégrée · partenaire des urgences", "pfBtn": "Portrait →", "pfTopics": "Ce qu’il ou elle enseigne", "pfCv": "Parcours et distinctions", "pfStory": "Son histoire", "pfOff": "En dehors du travail", "pfPubs": "Publications ({n} ; jusqu’à 5 affichées)"}, "res": {"eyebrow": "Research · updated Oct 2026", "h2": "Une recherche née de la clinique", "lead": "Notre mission de recherche : rendre la gestion des voies aériennes et les thérapies respiratoires aux urgences plus sûres pour les patients, les soignants et l'environnement de soins. Deux axes principaux : <b>l'exposition aux bioaérosols lors de la gestion des voies aériennes en urgence et en réanimation</b> et <b>les stratégies d'intubation des voies aériennes difficiles</b> ; s'y ajoutent l'éducation médicale par compétences, les bases de données de l'assurance maladie et des études de cas cliniques. Chaque article est accompagné de son lien DOI.", "hl": [{"b": "Q1", "s": "Annals of Emergency Medicine, JMIR Med Educ (n° 1 de la catégorie éducation), Indoor Air"}, {"b": "8", "s": "articles de la série sur les aérosols, 2021–2026"}, {"b": "2", "s": "essais randomisés sur cadavres frais congelés en voies aériennes difficiles"}, {"b": "7", "s": "années consécutives de financement par le Département de la santé de la ville de Taipei et le NSTC"}], "search": "Rechercher un titre, une revue ou un auteur", "count": "{n} articles", "empty": "Aucun article ne correspond. Essayez un autre mot-clé.", "cats": {"all": "Tous", "aer": "Aérosols", "air": "Voies aériennes", "edu": "Éducation médicale", "us": "Échographie", "dis": "Catastrophes", "nhi": "Bases de l'assurance maladie", "case": "Clinique", "oth": "Autres"}, "summaries": {"ina26": "Hiérarchie de protection pendant la thérapie inhalée : pression négative ≫ N95 côté patient ≫ masque chirurgical ; avec une pièce en T ouverte, une aspiration HEPA en un seul point ne suffit pas.", "jfma26": "Dépistage par l'ISAR du risque de reconsultation aux urgences et de réhospitalisation chez les personnes âgées.", "sr25": "Modèle de voies aériennes difficiles « épiglotte seule visible » sur cadavre frais congelé : le stylet vidéo l'emporte en réussite au premier essai et en durée d'intubation.", "ina25": "La RCP mécanique génère nettement moins d'aérosols côté tête que la RCP manuelle ; sonde d'intubation + HEPA + aspiration les éliminent presque totalement.", "wjem25": "Patient assis : comparaison croisée randomisée de l'intubation par l'arrière droit et face à face.", "jmir25": "Le système d'évaluation CBME mobile des urgences de Zhongxing : plus immédiat que le papier ou le web, et préféré par les internes.", "jhi25": "Faute de chambres d'isolement, des purificateurs d'air orientés et une aspiration HEPA peuvent remplacer une chambre à pression négative.", "emj24": "Cas d'imagerie diagnostique aux urgences.", "ajem24": "Essai randomisé sur cadavre simulant une angine de Ludwig : meilleurs taux de réussite et efficacité avec le stylet vidéo.", "sr23b": "Étude primée meilleur poster à l'ICEM 2023 : distance de dispersion n'est pas concentration ; les pieds du patient sont une zone de forte exposition négligée.", "sr23a": "RCP à mains nues par un témoin avec un masque bien ajusté : l'exposition côté tête diminue de plus de 80 %.", "aem23": "Cas d'imagerie dans Annals of Emergency Medicine.", "aem22": "Comparaison de la production d'aérosols de cinq méthodes de préoxygénation avant intubation.", "plos21": "Début de la pandémie : caisson d'isolement à pression négative et aspiration HEPA pour protéger l'opérateur d'intubation.", "emj20": "Techniques d'intubation sécurisée pendant la COVID-19.", "bmc19": "Quand seule l'épiglotte est visible, soulever l'épiglotte avec la sonde est la clé de la réussite.", "jam19": "Explosion de poussière du Formosa Fun Coast : la réponse d'un hôpital régional sans service de grands brûlés.", "ajem17": "Un nouveau signe échographique du pneumomédiastin.", "cc26": "La position ventrale réoriente l'aérosol expiré : l'exposition sous masque du personnel diminue dans 13 comparaisons sur 16 (−51 % en moyenne), mais augmente avec un masque de CPAP étanche côté tête.", "emj26": "TSV paroxystique aux urgences : l'élévation de la troponine prédit fortement l'hospitalisation, mais pas le pronostic à 30 jours (cohorte appariée par score de propension)."}, "grantsH": "Projets de recherche financés (investigateur principal : Tzu-Yao Hung)", "grants": [["Quantification de l'exposition aux aérosols infectieux lors de la RCP manuelle et mécanique, et évaluation des stratégies de prévention", "Département de la santé de la ville de Taipei · 2026"], ["Mécanismes et stratégies thérapeutiques du dysfonctionnement cérébral lié à l'hyperammoniémie", "NSTC · 2025–2026"], ["Essai contrôlé randomisé comparant l'intubation du patient assis par l'arrière droit et face à face (Pentax AWS, stylet vidéo, laryngoscope à lame hyperangulée)", "Département de la santé de la ville de Taipei · 2025"], ["Évaluation du risque de transmission par aérosols sous oxygénothérapie par mesures multipoints de concentration et visualisation des écoulements", "Département de la santé de la ville de Taipei · 2024"], ["Efficacité de la pression négative, de l'aspiration HEPA et du masque chirurgical pour éliminer les aérosols dans un espace d'isolement clos", "Département de la santé de la ville de Taipei · 2023"], ["Risque de dispersion d'aérosols des différents dispositifs de voies aériennes en RCP continue et en RCP 30:2", "Département de la santé de la ville de Taipei · 2022"], ["Réduction du risque des gestes infectants sur les voies aériennes par l'association caisson d'isolement à pression négative, HEPA et vidéolaryngoscope", "Département de la santé de la ville de Taipei · 2021"]], "confH": "Communications en congrès internationaux", "conf": [["Third World Airway Management Meeting (WAMM), Italie", "2025 · poster"], ["Congrès de l'AMEE (éducation médicale), Suisse : méthode de Peyton en quatre étapes pour l'apprentissage du stylet vidéo", "2024"], ["European Airway Management Society Congress, Baveno, Italie", "2023"], ["EUSEM, Barcelone : évaluation CBME mobile ; exposition aux aérosols en RCP selon trois scénarios", "2023"], ["ICEM, Amsterdam : <b>Campbell MacFarlane Best Poster Award</b>", "2023"], ["Asian Conference on Emergency Medicine", "2021"], ["EUSEM : Glasgow 2018, Prague 2019, en ligne 2020", "Plusieurs communications"]], "ongoing": "<b>En cours et en projet (résultats non encore publiés) :</b> tri intelligent et surveillance continue des constantes vitales (en partenariat avec des industriels), entraînement aux voies aériennes à faible dose et haute fréquence assisté par IA, étude sur l'équité des soins d'urgence pour les personnes sans abri, étude de suivi des soins aigus à domicile.", "latestK": "DERNIÈRES PUBLICATIONS", "latest": [{"j": "Critical Care · 2026", "h": "Le décubitus ventral change l'aérosol inhalé par les soignants", "p": "Deux mannequins qui respirent, 32 configurations, vélocimétrie par images de particules : le décubitus ventral réduit l'exposition sous masque dans la plupart des cas, mais l'augmente avec une CPAP étanche côté tête.", "a": "Premier auteur : Dr Tzu-Yao Hung, chef de service · co-auteur Dr Che-Chang Hsu", "d": "10.1186/s13054-026-06416-9"}, {"j": "Emergency Medicine Journal · 2026", "h": "Troponine élevée dans la TSV : faut-il s’inquiéter ?", "p": "L'élévation de la troponine prédit fortement l'hospitalisation, mais pas le pronostic à 30 jours. Travail réalisé par le Dr Sheng-Han Yu pendant son internat sous la direction du Dr Tzu-Yao Hung, distingué au forum de recherche des internes des neuf hôpitaux.", "a": "Premier auteur : Dr Sheng-Han Yu · co-auteur Dr Jr-Han Liou", "d": "10.1136/emermed-2026-216291"}]}, "intl": {"eyebrow": "International · coopérations internationales et interdisciplinaires", "h2": "International : le monde entre aux urgences", "lead": "Des soignants étrangers viennent à Zhongxing suivre nos ateliers de voies aériennes et nous accompagner en stage ; nous présentons aussi les travaux menés à Zhongxing dans les congrès internationaux en Europe. Côté interdisciplinaire, notre recherche sur les aérosols avec le département de génie énergétique et de climatisation de Taipei Tech dure depuis six ans.", "cards": [{"h": "Des soignants étrangers se forment aux voies aériennes", "p": "Médecins et infirmiers étrangers suivent nos ateliers de voies aériennes, station par station : ventilation au masque, vidéolaryngoscopie, puis intubation au fibroscope."}, {"h": "Fin de stage, certificat en poche", "p": "Les soignants en visite suivent les équipes aux urgences et participent aux journées pédagogiques ; le service leur remet un certificat à la fin du stage."}, {"h": "Nos travaux sur la scène internationale", "p": "WAMM (Italie, 2025), EUSEM, ICEM, AMEE : internes et seniors présentent ensemble à l'étranger."}, {"h": "Interdisciplinarité : médecine × ingénierie", "p": "Avec le département de génie climatique de Taipei Tech, nous avons construit une plateforme de mesure des aérosols haute fidélité : la vélocimétrie par images de particules transforme l'invisible en données."}]}, "hist": {"eyebrow": "History", "h2": "Un siècle d'histoire : cliquez sur une année", "lead": "Sources : programme de formation des spécialistes en médecine d'urgence du site de Zhongxing (révision n° 18 du 12/05/2026) et articles de presse.", "nav": "Utilisez les flèches pour changer d'année", "items": [{"t": "Fondation de l'hôpital de la Croix-Rouge", "h": "Hôpital de la section taïwanaise de la Croix-Rouge japonaise", "p": "Selon le programme de formation de l'hôpital, l'ancêtre du site de Zhongxing a été fondé en 1905 ; c'était alors le premier hôpital universitaire de Taïwan.", "tag": "Les origines"}, {"t": "Naissance du service des urgences", "h": "Second hôpital affilié de l'Université nationale de Taïwan", "p": "Devenu le second hôpital affilié de l'Université nationale de Taïwan, l'établissement crée un poste « urgences » : c'est le début de notre service des urgences.", "tag": "An 1 des urgences"}, {"t": "Urgences 24 h/24", "h": "Ouverture des urgences 24 h/24", "p": "Désormais ouvertes toute l'année. Le bâtiment des urgences est inauguré en 1983.", "tag": "Toute l'année"}, {"t": "Nouveau bâtiment et réseau d'urgence", "h": "Les urgences s'installent au rez-de-chaussée du nouveau bâtiment", "p": "Participation au « double réseau » de secours médicaux d'urgence de Taipei et co-organisation de l'exercice Wan An n° 22.", "tag": "Réseau d'urgence"}, {"t": "Séisme du 21 septembre", "h": "Secours lors du séisme du 21 septembre, dans le centre et le nord", "p": "Participation aux secours, saluée par le gouvernement de la ville de Taipei, le gouvernement du comté de Taichung, l'Ordre des médecins de Taipei et la Fédération nationale des ordres des médecins.", "tag": "Réponse aux catastrophes"}, {"t": "Premier poste de dépistage de la fièvre de Taïwan", "h": "SRAS : poste de dépistage de la fièvre ouvert le 13 mai", "p": "Le premier poste de dépistage de la fièvre de Taïwan est installé devant les urgences de Zhongxing ; les autres hôpitaux viennent l'observer. Pendant le SRAS, l'hôpital assume la charge médicale du secteur sud de Taipei, déclare 105 patients et sort victorieux de la lutte. Distinction officielle pour services méritoires.", "tag": "Services méritoires"}, {"t": "Le site de Zhongxing", "h": "Taipei City Hospital, site de Zhongxing", "p": "L'hôpital devient le site de Zhongxing et prépare un dispositif de transfert aérien ; les transferts aériens interhospitaliers débutent en octobre de la même année.", "tag": "Transfert aérien"}, {"t": "Hôpital formateur en médecine d'urgence", "h": "Agrément comme hôpital formateur en médecine d'urgence", "p": "Avec 10 spécialistes seniors à temps plein, le service recrute ses premiers internes en médecine d'urgence en août 2014 et s'engage pleinement dans l'enseignement.", "tag": "Hôpital universitaire"}, {"t": "Explosion du Formosa Fun Coast", "h": "Un afflux massif de victimes, sans service de grands brûlés", "p": "Tout l'hôpital déclenche le plan afflux massif de victimes, accueille des grands brûlés puis les transfère vers des centres médicaux. Le Dr Tzu-Yao Hung reçoit la distinction officielle pour services méritoires du ministère de la Santé et des Affaires sociales ; le chef des internes, le Dr Chieh-Hung Lin, publie le retour d'expérience dans le Journal of Acute Medicine (2019).", "tag": "Services méritoires"}, {"t": "Création de CrazyatLAB", "h": "Fondation de CrazyatLAB avec des passionnés", "p": "Le Dr Tzu-Yao Hung fonde CrazyatLAB avec d'autres passionnés de l'enseignement des voies aériennes et intègre les voies aériennes difficiles à la formation des internes.", "tag": "Enseignement des voies aériennes"}, {"t": "Évaluation mobile", "h": "L'évaluation croisée des internes passe sur smartphone", "p": "Le système d'évaluation web a été transformé en application mobile (AppSheet) pour un retour en temps réel sur les jalons et les EPA. L'étude a reçu un prix de bronze au congrès international d'éducation médicale du Taipei Veterans General Hospital en 2023 et a été publiée dans JMIR Medical Education en 2025.", "tag": "CBME"}, {"t": "Rénovation des urgences", "h": "Circuits, hygiène et prévention de la violence entièrement repensés", "p": "Les travaux de rénovation des urgences s'achèvent en avril 2019 ; ils intègrent circuits, contrôle des infections et protection contre la violence aux urgences.", "tag": "Locaux"}, {"t": "Équipe de recherche sur les aérosols", "h": "Création d'une équipe de recherche sur les aérosols avec Taipei Tech", "p": "Au début de la pandémie, collaboration avec le département de génie énergétique et de climatisation de l'Université nationale de technologie de Taipei (Taipei Tech) ; dès l'année suivante, publications dans PLoS ONE, Annals of Emergency Medicine et d'autres revues.", "tag": "Interdisciplinarité"}, {"t": "La tempête de Wanhua", "h": "Heping ferme ses urgences, Zhongxing tient bon", "p": "Guichets de prélèvement aménagés, 200 à 400 prélèvements par jour, intubation de patients positifs ; les soignants vivent isolés pendant deux mois, et les urgences ne ferment jamais. Distinction officielle pour services méritoires.", "tag": "Services méritoires"}, {"t": "Consultation « Snow House »", "h": "Près de 15 000 consultations en avril–mai", "p": "Au pic national de l'épidémie, le service organise la consultation de délivrance rapide « Snow House » : jusqu'à 500 patients en 4 heures au plus fort, pour préserver la capacité d'accueil des urgences graves.", "tag": "Lutte contre l'épidémie"}, {"t": "Meilleur poster à l'ICEM", "h": "Un interne sur la scène internationale", "p": "Le Dr Chih-Chieh Wu (alors interne) reçoit l'ICEM Campbell MacFarlane Best Poster Award ; la même année, les internes remportent le concours de diagnostic toxicologique en un coup d'œil et le Dr Wei-Lun Chen reçoit le prix des jeunes médecins.", "tag": "Distinctions"}, {"t": "Accord avec les pompiers", "h": "Hôpital municipal × pompiers de Taipei : renforcer le sauvetage", "p": "Signé le 7 décembre par le chef des pompiers Mo Huai-tsu et le directeur général Hsiao Sheng-huang : formations et exercices communs, missions de sauvetage communes, prise en charge commune des afflux massifs de victimes et cours de formation conçus ensemble.", "tag": "Partenariat interinstitutionnel"}, {"t": "Séisme de Hualien", "h": "Nos médecins mobilisés pour le séisme de Hualien", "p": "Les Drs Ya-Chin Liang et Wei-Lun Chen sont médecins attitrés de l'équipe de sauvetage de Taipei : la médecine de catastrophe passe des exercices au terrain.", "tag": "Réponse aux catastrophes"}, {"t": "Santé des pompiers
